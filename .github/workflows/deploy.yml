name: Continuous Delivery

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Test Brain
        run: |
          cd brain
          go test -v ./...

      - name: Test Scheduler MCP
        run: |
          cd scheduler-mcp
          go test -v ./...

      - name: Test Discord MCP
        run: |
          cd discord-mcp
          go test -v ./...

  build-and-push:
    name: Build & Push Images to GHCR
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: brain
            context: .
            file: ./brain/Dockerfile
            image: ghcr.io/azylman/aerial-brain
          - service: scheduler-mcp
            context: ./scheduler-mcp
            file: ./scheduler-mcp/Dockerfile
            image: ghcr.io/azylman/aerial-scheduler-mcp
          - service: discord-mcp
            context: ./discord-mcp
            file: ./discord-mcp/Dockerfile
            image: ghcr.io/azylman/aerial-discord-mcp
          - service: docker-mcp
            context: ./docker-mcp
            file: ./docker-mcp/Dockerfile
            image: ghcr.io/azylman/aerial-docker-mcp
          - service: github-mcp
            context: ./github-mcp
            file: ./github-mcp/Dockerfile
            image: ghcr.io/azylman/aerial-github-mcp
          - service: ollama
            context: ./docker/ollama
            file: ./docker/ollama/Dockerfile
            image: ghcr.io/azylman/aerial-ollama
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max