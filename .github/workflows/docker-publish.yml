name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild and push all container images'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changed Microservices
    runs-on: [self-hosted, ci]
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
      eri: ${{ steps.filter.outputs.eri }}
      haro: ${{ steps.filter.outputs.haro }}
      coven: ${{ steps.filter.outputs.coven }}
      discord-mcp: ${{ steps.filter.outputs.discord-mcp }}
      kernel-mcp: ${{ steps.filter.outputs.kernel-mcp }}
      github-mcp: ${{ steps.filter.outputs.github-mcp }}
      nomad-mcp: ${{ steps.filter.outputs.nomad-mcp }}
      infisical-mcp: ${{ steps.filter.outputs.infisical-mcp }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docs: ${{ steps.filter.outputs.docs }}
      mesh-proxy: ${{ steps.filter.outputs.mesh-proxy }}
      hangar: ${{ steps.filter.outputs.hangar }}
      synapse: ${{ steps.filter.outputs.synapse }}
      vanadis: ${{ steps.filter.outputs.vanadis }}
      prospera: ${{ steps.filter.outputs.prospera }}
      github-runner: ${{ steps.filter.outputs.github-runner }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pkg:
              - 'pkg/**'
            eri:
              - 'services/eri/**'
              - 'pkg/**'
            haro:
              - 'services/haro/**'
              - 'pkg/**'
            coven:
              - 'services/coven/**'
              - 'pkg/**'
            discord-mcp:
              - 'mcp/discord-mcp/**'
              - 'pkg/**'
            kernel-mcp:
              - 'mcp/kernel-mcp/**'
              - 'pkg/**'
            github-mcp:
              - 'mcp/github-mcp/**'
            nomad-mcp:
              - 'mcp/nomad-mcp/**'
            infisical-mcp:
              - 'mcp/infisical-mcp/**'
            dashboard:
              - 'services/dashboard/**'
              - 'pkg/**'
            docs:
              - 'services/docs-service/**'
            mesh-proxy:
              - 'services/proxy/**'
            hangar:
              - 'services/hangar/**'
              - 'pkg/**'
            synapse:
              - 'services/synapse/**'
              - 'pkg/**'
            vanadis:
              - 'services/vanadis/**'
              - 'pkg/**'
            prospera:
              - 'services/prospera/**'
              - 'pkg/**'
            github-runner:
              - 'services/github-runner/**'

      - name: Compute Dynamic Build Matrix
        id: set-matrix
        run: |
          node -e '
            const filter = {
              eri: "${{ steps.filter.outputs.eri }}",
              haro: "${{ steps.filter.outputs.haro }}",
              coven: "${{ steps.filter.outputs.coven }}",
              "discord-mcp": "${{ steps.filter.outputs.discord-mcp }}",
              "kernel-mcp": "${{ steps.filter.outputs.kernel-mcp }}",
              "github-mcp": "${{ steps.filter.outputs.github-mcp }}",
              "nomad-mcp": "${{ steps.filter.outputs.nomad-mcp }}",
              "infisical-mcp": "${{ steps.filter.outputs.infisical-mcp }}",
              dashboard: "${{ steps.filter.outputs.dashboard }}",
              docs: "${{ steps.filter.outputs.docs }}",
              "mesh-proxy": "${{ steps.filter.outputs.mesh-proxy }}",
              hangar: "${{ steps.filter.outputs.hangar }}",
              synapse: "${{ steps.filter.outputs.synapse }}",
              vanadis: "${{ steps.filter.outputs.vanadis }}",
              prospera: "${{ steps.filter.outputs.prospera }}",
              "github-runner": "${{ steps.filter.outputs.github-runner }}"
            };

            const catalog = [
              { service: "eri", context: ".", file: "./services/eri/Dockerfile", image_name: "aerial-eri" },
              { service: "haro", context: ".", file: "./services/haro/Dockerfile", image_name: "aerial-haro" },
              { service: "coven", context: ".", file: "./services/coven/Dockerfile", image_name: "aerial-coven" },
              { service: "discord-mcp", context: ".", file: "./mcp/discord-mcp/Dockerfile", image_name: "aerial-discord-mcp" },
              { service: "kernel-mcp", context: ".", file: "./mcp/kernel-mcp/Dockerfile", image_name: "aerial-kernel-mcp" },
              { service: "github-mcp", context: "./mcp/github-mcp", file: "./mcp/github-mcp/Dockerfile", image_name: "aerial-github-mcp" },
              { service: "nomad-mcp", context: "./mcp/nomad-mcp", file: "./mcp/nomad-mcp/Dockerfile", image_name: "aerial-nomad-mcp" },
              { service: "infisical-mcp", context: "./mcp/infisical-mcp", file: "./mcp/infisical-mcp/Dockerfile", image_name: "aerial-infisical-mcp" },
              { service: "dashboard", context: ".", file: "./services/dashboard/Dockerfile", image_name: "aerial-dashboard" },
              { service: "docs", context: "./services/docs-service", file: "./services/docs-service/Dockerfile", image_name: "aerial-docs" },
              { service: "mesh-proxy", context: "./services/proxy", file: "./services/proxy/Dockerfile", image_name: "aerial-proxy" },
              { service: "hangar", context: ".", file: "./services/hangar/Dockerfile", image_name: "aerial-hangar" },
              { service: "synapse", context: ".", file: "./services/synapse/Dockerfile", image_name: "aerial-synapse" },
              { service: "vanadis", context: ".", file: "./services/vanadis/Dockerfile", image_name: "aerial-vanadis" },
              { service: "prospera", context: ".", file: "./services/prospera/Dockerfile", image_name: "aerial-prospera" },
              { service: "github-runner", context: ".", file: "./services/github-runner/Dockerfile", image_name: "aerial-github-runner" }
            ];

            const forceAll = "${{ inputs.force_all }}" === "true";
            const active = forceAll ? catalog : catalog.filter(c => filter[c.service] === "true");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(active)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_builds=${active.length > 0}\n`);
          '

  test:
    name: Run Service Unit Tests
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify Monorepo Test Coverage & Gating
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          GO_MODULES=$(find . -maxdepth 3 -name "go.mod" ! -path "*/.*" ! -path "*/vendor/*" | sed 's|^\./||; s|/go\.mod$||' | sort)
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          if [ "$FORCE_ALL" = "true" ] || [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -q -E '^(pkg/|scripts/check-coverage\.sh$)'; then
            sh scripts/check-coverage.sh --check --summary
          else
            RAN_ANY=0
            FAILED_ANY=0
            for svc in $GO_MODULES; do
              if ! echo "$CHANGED_FILES" | grep -q "^${svc}/"; then
                continue
              fi
              RAN_ANY=1
              sh scripts/check-coverage.sh --check --summary --service "$svc" || FAILED_ANY=1
            done
            if [ "$RAN_ANY" -eq 0 ]; then
              echo "No Go module or frontend changes detected; skipping unit test coverage run."
            fi
            [ "$FAILED_ANY" -eq 0 ]
          fi

  lint:
    name: Lint Microservices & Frontend
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify Repository Hygiene & Invariants
        run: |
          # 1. UTF-8 BOM Hygiene
          BOM_HEX=$(printf '\357\273\277')
          BOM_FILES=$(git grep -I -l "^$BOM_HEX" 2>/dev/null || true)
          if [ -n "$BOM_FILES" ]; then
            echo "::error::Invalid UTF-8 BOM detected in tracked files:"
            echo "$BOM_FILES" | sed 's/^/   • /'
            exit 1
          fi

          # 2. Direct execution of main() in test files
          MAIN_CALLS=$(git grep -E '\bmain\(\)' 'services/eri/*_test.go' 2>/dev/null || true)
          if [ -n "$MAIN_CALLS" ]; then
            echo "::error::Direct execution of main() detected in test files:"
            echo "$MAIN_CALLS" | sed 's/^/   • /'
            exit 1
          fi

          # 3. Grafana Dashboard JSON Syntax
          for jf in nomad/grafana/dashboards/*.json; do
            if [ -f "$jf" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$jf', 'utf8'))"
            fi
          done

          # 4. Docker Compose Validation
          docker compose -f docker-compose.yml config --quiet

          # 5. Ratcheted Code Health Gate & Scanner Unit Tests
          (cd scripts/code-health && go test -v -race ./... && go run . -root ../.. -baseline ../../.code-health-baseline.json)

      - name: Lint & Check Dead Code in Go Modules
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          GO_MODULES=$(find . -maxdepth 3 -name "go.mod" ! -path "*/.*" ! -path "*/vendor/*" | sed 's|^\./||; s|/go\.mod$||' | sort)
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          LINT_ALL=0
          if [ "$FORCE_ALL" = "true" ] || [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -q -E '^(pkg/|\.golangci\.yml$)'; then
            LINT_ALL=1
          fi
          for svc in $GO_MODULES; do
            if [ "$LINT_ALL" -eq 0 ] && ! echo "$CHANGED_FILES" | grep -q "^${svc}/"; then
              continue
            fi
            echo "=== Linting & checking deadcode in $svc ==="
            (
              cd "$svc"
              golangci-lint run --path-prefix="$svc/" --config "$GITHUB_WORKSPACE/.golangci.yml" ./...
              MAIN_PKGS=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)
              if [ -n "$MAIN_PKGS" ]; then
                DEAD_PROD=$(deadcode $MAIN_PKGS)
                if [ -n "$DEAD_PROD" ]; then
                  echo "::error::Unreachable production code or compiled-in test hooks detected in $svc:"
                  echo "$DEAD_PROD"
                  exit 1
                fi
              fi
            )
          done

      - name: Lint Permet HUD Frontend Syntax
        if: needs.changes.outputs.dashboard == 'true'
        run: |
          node --check services/dashboard/static/app.js

      - name: Lint Docsify Custom Plugins
        if: needs.changes.outputs.docs == 'true'
        run: |
          node --check services/docs-service/app/assets/js/plugins/docsify-mermaid-cyberpunk.js

  build-and-push:
    name: Build & Push Images to GHCR (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.has_builds == 'true'
    runs-on: [self-hosted, ci]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Persistent Local Buildx Builder
        run: |
          mkdir -p /cache/buildx-config /root/.docker/buildx/instances
          (
            flock 200
            if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
              docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
            fi
            export BUILDX_CONFIG=/cache/buildx-config
            echo '[registry."docker.io"]' > /cache/buildkitd.toml.new
            echo '  mirrors = ["mirror.gcr.io"]' >> /cache/buildkitd.toml.new
            RECREATE=0
            if ! cmp -s /cache/buildkitd.toml.new /cache/buildkitd.toml 2>/dev/null; then
              mv -f /cache/buildkitd.toml.new /cache/buildkitd.toml
              RECREATE=1
            else
              rm -f /cache/buildkitd.toml.new
            fi
            if ! docker buildx inspect --bootstrap calibarn-buildkit >/dev/null 2>&1 || [ "$RECREATE" -eq 1 ] || [ ! -f /cache/.buildkitd-mirrored ]; then
              docker buildx rm -f calibarn-buildkit >/dev/null 2>&1 || true
              docker rm -f buildx_buildkit_calibarn-buildkit0 >/dev/null 2>&1 || true
              docker buildx create --name calibarn-buildkit --driver docker-container --driver-opt network=host --config /cache/buildkitd.toml --use --bootstrap
              touch /cache/.buildkitd-mirrored
            fi
            cp -f /cache/buildx-config/instances/calibarn-buildkit /root/.docker/buildx/instances/calibarn-buildkit
          ) 200>/cache/buildx.lock
          docker buildx use calibarn-buildkit

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Git Tree SHA
        id: tree_check
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
          if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; } && [ "$REF" = "refs/heads/main" ] && [ "$FORCE_ALL" != "true" ]; then
            if docker buildx imagetools inspect "ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Push Image from PR Tree Cache (${{ matrix.service }})
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.tree_check.outputs.exists == 'true'
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
          SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.tree_check.outputs.tree_sha }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:${SHA}" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            "$SRC"

      - name: Build and Push ${{ matrix.service }}
        if: steps.tree_check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}:tree-${{ steps.tree_check.outputs.tree_sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/{1}:{2}', steps.repo_owner.outputs.owner, matrix.image_name, github.sha) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            aerial.commit_sha=${{ github.sha }}
            aerial.service=${{ matrix.service }}

  roborev:
    name: roborev
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == 'azylman' || github.actor == 'dependabot[bot]')
    runs-on: [self-hosted, roborev]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Dependabot Metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2

      - name: Enable Auto-Merge for Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          export GH_TOKEN="${GITHUB_PAT:-${GH_TOKEN}}"
          gh pr merge --auto --squash "$PR_URL"

      - name: Run Independent RoboRev Review Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -o pipefail
          if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ] || [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Dependabot PR detected; skipping RoboRev LLM review gate."
            exit 0
          fi
          if ! git cat-file -e origin/main:.roborev.toml 2>/dev/null || ! (git cat-file -e origin/main:nomad/jobs/github-runner.nomad 2>/dev/null || git cat-file -e origin/main:nomad/jobs/roborev-runner.nomad 2>/dev/null); then
            echo "RoboRev not bootstrapped on main; skipping."
            exit 0
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            OVERRIDE_COMMENT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq "[.[] | select(.user.login == \"azylman\" and (.body | contains(\"## roborev-override\")) and ((.body | contains(\"${HEAD_SHA}\")) or (.body | contains(\"${SHORT_SHA}\"))))] | last | .body // empty" 2>/dev/null || true)
            if [ -n "${OVERRIDE_COMMENT}" ]; then
              echo "${OVERRIDE_COMMENT}" >> "$GITHUB_STEP_SUMMARY"
              echo "RoboRev gate overridden for commit ${SHORT_SHA} via verified technical rebuttal."
              exit 0
            fi
          fi
          roborev ci review \
            --agent gemini \
            --min-severity medium \
            --reasoning thorough | tee /tmp/roborev-review.md
          cat /tmp/roborev-review.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "Synthesis unavailable" /tmp/roborev-review.md; then
            echo "::error::RoboRev synthesis failed or fell back to raw output; failing closed."
            exit 1
          fi
          if grep -Eq '^## roborev: Review Passed|^No issues found\.$|^No findings at or above [a-z]+ severity\.$|roborev: no changes to review' /tmp/roborev-review.md; then
            echo "RoboRev gate passed."
            exit 0
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "${PR_NUMBER}" --body-file /tmp/roborev-review.md || true
          fi
          echo "::error::RoboRev reported actionable findings (>= medium severity)."
          exit 1

  build-gate:
    name: CI Gate
    needs: [changes, test, lint, roborev, build-and-push]
    if: always()
    runs-on: [self-hosted, ci]
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
      HAS_BUILDS: ${{ needs.changes.outputs.has_builds }}
    steps:
      - name: Verify All Upstream Jobs & Container Builds
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          FAILED=$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$FAILED" ]; then
            echo "::error::Upstream job(s) failed or were cancelled: $FAILED"
            exit 1
          fi
          UNEXPECTED_SKIP=$(echo "$NEEDS_JSON" | jq -r --arg event "$EVENT_NAME" --arg has_builds "${HAS_BUILDS:-false}" '
            [to_entries[] | select(
              .value.result == "skipped" and (
                .key == "changes" or
                .key == "validate" or
                ((.key == "build-and-push" or .key == "docker") and $has_builds == "true") or
                (.key != "build-and-push" and .key != "docker" and $event == "pull_request")
              )
            ) | .key] | join(", ")
          ')
          if [ -n "$UNEXPECTED_SKIP" ]; then
            echo "::error::Required upstream job(s) were unexpectedly skipped: $UNEXPECTED_SKIP"
            exit 1
          fi
          echo "All required checks and builds passed."

  promote-release:
    name: Promote Images to :latest
    needs: [changes, build-and-push, build-gate]
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.has_builds == 'true' && needs.build-gate.result == 'success'
    runs-on: [self-hosted, ci]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Changed Microservices to :latest
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Promote non-eri dependencies before eri to prevent RPC skew on Watchtower restart
          pids=""
          for IMG in $(echo "$MATRIX_JSON" | jq -r '.[] | select(.service != "eri") | .image_name'); do
            echo "Promoting non-eri manifest ghcr.io/${OWNER}/${IMG}:${SHA} -> ghcr.io/${OWNER}/${IMG}:latest"
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${IMG}:latest" \
              --annotation "index:org.opencontainers.image.revision=${SHA}" \
              "ghcr.io/${OWNER}/${IMG}:${SHA}" &
            pids="$pids $!"
          done
          for pid in $pids; do
            wait "$pid" || exit 1
          done

          if echo "$MATRIX_JSON" | jq -e '.[] | select(.service == "eri")' >/dev/null; then
            echo "Promoting eri manifest ghcr.io/${OWNER}/aerial-eri:${SHA} -> ghcr.io/${OWNER}/aerial-eri:latest"
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/aerial-eri:latest" \
              --annotation "index:org.opencontainers.image.revision=${SHA}" \
              "ghcr.io/${OWNER}/aerial-eri:${SHA}"
          fi
