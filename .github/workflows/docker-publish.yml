name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild and push all container images'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
      eri: ${{ steps.filter.outputs.eri }}
      haro: ${{ steps.filter.outputs.haro }}
      coven: ${{ steps.filter.outputs.coven }}
      discord-mcp: ${{ steps.filter.outputs.discord-mcp }}
      kernel-mcp: ${{ steps.filter.outputs.kernel-mcp }}
      github-mcp: ${{ steps.filter.outputs.github-mcp }}
      nomad-mcp: ${{ steps.filter.outputs.nomad-mcp }}
      infisical-mcp: ${{ steps.filter.outputs.infisical-mcp }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docs: ${{ steps.filter.outputs.docs }}
      proxy: ${{ steps.filter.outputs.proxy }}
      hangar: ${{ steps.filter.outputs.hangar }}
      webhooks-router: ${{ steps.filter.outputs.webhooks-router }}
      vanadis: ${{ steps.filter.outputs.vanadis }}
      prospera: ${{ steps.filter.outputs.prospera }}
      roborev-runner: ${{ steps.filter.outputs.roborev-runner }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pkg:
              - 'pkg/**'
            eri:
              - 'services/eri/**'
              - 'pkg/**'
            haro:
              - 'services/haro/**'
              - 'pkg/**'
            coven:
              - 'services/coven/**'
              - 'pkg/**'
            discord-mcp:
              - 'mcp/discord-mcp/**'
              - 'pkg/**'
            kernel-mcp:
              - 'mcp/kernel-mcp/**'
              - 'pkg/**'
            github-mcp:
              - 'mcp/github-mcp/**'
            nomad-mcp:
              - 'mcp/nomad-mcp/**'
            infisical-mcp:
              - 'mcp/infisical-mcp/**'
            dashboard:
              - 'services/dashboard/**'
              - 'pkg/**'
            docs:
              - 'services/docs-service/**'
            proxy:
              - 'services/proxy/**'
            hangar:
              - 'services/hangar/**'
              - 'pkg/**'
            webhooks-router:
              - 'services/webhooks-router/**'
              - 'pkg/**'
            vanadis:
              - 'services/vanadis/**'
              - 'pkg/**'
            prospera:
              - 'services/prospera/**'
              - 'pkg/**'
            roborev-runner:
              - 'services/roborev-runner/**'

      - name: Compute Dynamic Build Matrix
        id: set-matrix
        run: |
          node -e '
            const filter = {
              eri: "${{ steps.filter.outputs.eri }}",
              haro: "${{ steps.filter.outputs.haro }}",
              coven: "${{ steps.filter.outputs.coven }}",
              "discord-mcp": "${{ steps.filter.outputs.discord-mcp }}",
              "kernel-mcp": "${{ steps.filter.outputs.kernel-mcp }}",
              "github-mcp": "${{ steps.filter.outputs.github-mcp }}",
              "nomad-mcp": "${{ steps.filter.outputs.nomad-mcp }}",
              "infisical-mcp": "${{ steps.filter.outputs.infisical-mcp }}",
              dashboard: "${{ steps.filter.outputs.dashboard }}",
              docs: "${{ steps.filter.outputs.docs }}",
              proxy: "${{ steps.filter.outputs.proxy }}",
              hangar: "${{ steps.filter.outputs.hangar }}",
              "webhooks-router": "${{ steps.filter.outputs.webhooks-router }}",
              vanadis: "${{ steps.filter.outputs.vanadis }}",
              prospera: "${{ steps.filter.outputs.prospera }}",
              "roborev-runner": "${{ steps.filter.outputs.roborev-runner }}"
            };

            const catalog = [
              { service: "eri", context: ".", file: "./services/eri/Dockerfile", image_name: "aerial-eri" },
              { service: "haro", context: ".", file: "./services/haro/Dockerfile", image_name: "aerial-haro" },
              { service: "coven", context: ".", file: "./services/coven/Dockerfile", image_name: "aerial-coven" },
              { service: "discord-mcp", context: ".", file: "./mcp/discord-mcp/Dockerfile", image_name: "aerial-discord-mcp" },
              { service: "kernel-mcp", context: ".", file: "./mcp/kernel-mcp/Dockerfile", image_name: "aerial-kernel-mcp" },
              { service: "github-mcp", context: "./mcp/github-mcp", file: "./mcp/github-mcp/Dockerfile", image_name: "aerial-github-mcp" },
              { service: "nomad-mcp", context: "./mcp/nomad-mcp", file: "./mcp/nomad-mcp/Dockerfile", image_name: "aerial-nomad-mcp" },
              { service: "infisical-mcp", context: "./mcp/infisical-mcp", file: "./mcp/infisical-mcp/Dockerfile", image_name: "aerial-infisical-mcp" },
              { service: "dashboard", context: ".", file: "./services/dashboard/Dockerfile", image_name: "aerial-dashboard" },
              { service: "docs", context: "./services/docs-service", file: "./services/docs-service/Dockerfile", image_name: "aerial-docs" },
              { service: "proxy", context: "./services/proxy", file: "./services/proxy/Dockerfile", image_name: "aerial-proxy" },
              { service: "hangar", context: ".", file: "./services/hangar/Dockerfile", image_name: "aerial-hangar" },
              { service: "webhooks-router", context: ".", file: "./services/webhooks-router/Dockerfile", image_name: "aerial-webhooks-router" },
              { service: "vanadis", context: ".", file: "./services/vanadis/Dockerfile", image_name: "aerial-vanadis" },
              { service: "prospera", context: ".", file: "./services/prospera/Dockerfile", image_name: "aerial-prospera" },
              { service: "roborev-runner", context: ".", file: "./services/roborev-runner/Dockerfile", image_name: "aerial-roborev-runner" }
            ];

            const forceAll = "${{ inputs.force_all }}" === "true";
            const active = forceAll ? catalog : catalog.filter(c => filter[c.service] === "true");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(active)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_builds=${active.length > 0}\n`);
          '

  test:
    name: Run Service Unit Tests
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go 1.27.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Monorepo Test Coverage & Gating
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          GO_MODULES=$(find . -maxdepth 3 -name "go.mod" ! -path "*/.*" ! -path "*/vendor/*" | sed 's|^\./||; s|/go\.mod$||' | sort)
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          if [ "$FORCE_ALL" = "true" ] || [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -q -E '^(pkg/|scripts/check-coverage\.sh$)'; then
            sh scripts/check-coverage.sh --check --summary
          else
            RAN_ANY=0
            for svc in $GO_MODULES; do
              if ! echo "$CHANGED_FILES" | grep -q "^${svc}/"; then
                continue
              fi
              RAN_ANY=1
              sh scripts/check-coverage.sh --check --summary --service "$svc"
            done
            if [ "$RAN_ANY" -eq 0 ]; then
              echo "No Go module or frontend changes detected; skipping unit test coverage run."
            fi
          fi

      - name: Test Webhooks Router
        if: needs.changes.outputs.webhooks-router == 'true'
        run: |
          cd services/webhooks-router
          go test -v -race ./...

      - name: Test Vanadis
        if: needs.changes.outputs.vanadis == 'true'
        run: |
          cd services/vanadis
          go test -v -race ./...

  lint:
    name: Lint Microservices & Frontend
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go 1.27.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Repository Hygiene & Invariants
        run: |
          # 1. UTF-8 BOM Hygiene
          BOM_HEX=$(printf '\357\273\277')
          BOM_FILES=$(git grep -I -l "^$BOM_HEX" 2>/dev/null || true)
          if [ -n "$BOM_FILES" ]; then
            echo "::error::Invalid UTF-8 BOM detected in tracked files:"
            echo "$BOM_FILES" | sed 's/^/   • /'
            exit 1
          fi

          # 2. Direct execution of main() in test files
          MAIN_CALLS=$(git grep -E '\bmain\(\)' 'services/eri/*_test.go' 2>/dev/null || true)
          if [ -n "$MAIN_CALLS" ]; then
            echo "::error::Direct execution of main() detected in test files:"
            echo "$MAIN_CALLS" | sed 's/^/   • /'
            exit 1
          fi

          # 3. Grafana Dashboard JSON Syntax
          for jf in nomad/grafana/dashboards/*.json; do
            if [ -f "$jf" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$jf', 'utf8'))"
            fi
          done

          # 4. Docker Compose Validation
          docker compose -f docker-compose.yml config --quiet

          # 5. Ratcheted Code Health Gate & Scanner Unit Tests
          (cd scripts/code-health && go test -v ./... && go run . -root ../.. -baseline ../../.code-health-baseline.json)

      - name: Install golangci-lint
        run: |
          mkdir -p $(go env GOPATH)/bin
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz | tar -xz -C $(go env GOPATH)/bin --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint

      - name: Install deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.51.0

      - name: Lint & Check Dead Code in Go Modules
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          GO_MODULES=$(find . -maxdepth 3 -name "go.mod" ! -path "*/.*" ! -path "*/vendor/*" | sed 's|^\./||; s|/go\.mod$||' | sort)
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          LINT_ALL=0
          if [ "$FORCE_ALL" = "true" ] || [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -q -E '^(pkg/|\.golangci\.yml$)'; then
            LINT_ALL=1
          fi
          for svc in $GO_MODULES; do
            if [ "$LINT_ALL" -eq 0 ] && ! echo "$CHANGED_FILES" | grep -q "^${svc}/"; then
              continue
            fi
            echo "=== Linting & checking deadcode in $svc ==="
            (
              cd "$svc"
              golangci-lint run --path-prefix="$svc/" --config "$GITHUB_WORKSPACE/.golangci.yml" ./...
              MAIN_PKGS=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)
              if [ -n "$MAIN_PKGS" ]; then
                DEAD_PROD=$(deadcode $MAIN_PKGS)
                if [ -n "$DEAD_PROD" ]; then
                  echo "::error::Unreachable production code or compiled-in test hooks detected in $svc:"
                  echo "$DEAD_PROD"
                  exit 1
                fi
              fi
            )
          done

      - name: Lint Permet HUD Frontend Syntax
        if: needs.changes.outputs.dashboard == 'true'
        run: |
          node --check services/dashboard/static/app.js

      - name: Lint Docsify Custom Plugins
        if: needs.changes.outputs.docs == 'true'
        run: |
          node --check services/docs-service/app/assets/js/plugins/docsify-mermaid-cyberpunk.js

  build-and-push:
    name: Build & Push Images to GHCR (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            aerial.commit_sha=${{ github.sha }}
            aerial.service=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-gate:
    name: Container Builds Gate
    needs: [changes, test, lint, build-and-push]
    if: always() && !cancelled() && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Container Builds
        run: |
          CHANGES_RES="${{ needs.changes.result }}"
          TEST_RES="${{ needs.test.result }}"
          LINT_RES="${{ needs.lint.result }}"
          BUILD_RES="${{ needs.build-and-push.result }}"
          HAS_BUILDS="${{ needs.changes.outputs.has_builds }}"

          echo "Changes status: $CHANGES_RES"
          echo "Test status: $TEST_RES"
          echo "Lint status: $LINT_RES"
          echo "Has builds: $HAS_BUILDS"
          echo "Builds status: $BUILD_RES"

          if [ "$CHANGES_RES" != "success" ]; then
            echo "::error::Changes detection failed"
            exit 1
          fi

          if [ "$TEST_RES" != "success" ] && { [ "${{ github.event_name }}" != "push" ] || [ "$TEST_RES" != "skipped" ]; }; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [ "$LINT_RES" != "success" ] && { [ "${{ github.event_name }}" != "push" ] || [ "$LINT_RES" != "skipped" ]; }; then
            echo "::error::Linting failed"
            exit 1
          fi

          if [ "$HAS_BUILDS" = "false" ]; then
            echo "No container builds required for this change. Gate passed."
            exit 0
          fi

          if [ "$BUILD_RES" != "success" ]; then
            echo "::error::One or more container builds failed or were cancelled"
            exit 1
          fi

          echo "All required container builds passed successfully."

  promote-release:
    name: Promote Images to :latest
    needs: [changes, build-and-push, build-gate]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.has_builds == 'true' && needs.build-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Changed Microservices to :latest
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Promote non-eri dependencies before eri to prevent RPC skew on Watchtower restart
          echo "$MATRIX_JSON" | jq -c 'sort_by(.service == "eri") | .[]' | while read -r entry; do
            IMG=$(echo "$entry" | jq -r '.image_name')
            SRC="ghcr.io/${OWNER}/${IMG}:${SHA}"
            DST="ghcr.io/${OWNER}/${IMG}:latest"
            echo "Promoting manifest ${SRC} -> ${DST}"
            docker buildx imagetools create --tag "${DST}" "${SRC}"
          done
