name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild and push all container images'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  changes:
    permissions:
      contents: read
      packages: write
      checks: write
    name: Detect Changed Microservices
    # Main pushes use the dedicated deploy pool so retag/promote never queue behind PR jobs.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","ci"]') || fromJSON('["self-hosted","deploy"]') }}
    outputs:
      pkg: ${{ steps.affected.outputs.pkg }}
      eri: ${{ steps.affected.outputs.eri }}
      eri-restate: ${{ steps.affected.outputs.eri-restate }}
      haro: ${{ steps.affected.outputs.haro }}
      coven: ${{ steps.affected.outputs.coven }}
      discord-mcp: ${{ steps.affected.outputs.discord-mcp }}
      docket-mcp: ${{ steps.affected.outputs.docket-mcp }}
      kernel-mcp: ${{ steps.affected.outputs.kernel-mcp }}
      infisical-mcp: ${{ steps.affected.outputs.infisical-mcp }}
      console: ${{ steps.affected.outputs.console }}
      docs: ${{ steps.affected.outputs.docs }}
      synapse: ${{ steps.affected.outputs.synapse }}
      transcripts: ${{ steps.affected.outputs.transcripts }}
      vanadis: ${{ steps.affected.outputs.vanadis }}
      vanadis-restate: ${{ steps.affected.outputs.vanadis-restate }}
      vanadis-nats: ${{ steps.affected.outputs.vanadis-nats }}
      coverage-ingest: ${{ steps.affected.outputs.coverage-ingest }}
      prospera: ${{ steps.affected.outputs.prospera }}
      github-runner: ${{ steps.affected.outputs.github-runner }}
      migrator: ${{ steps.affected.outputs.migrator }}
      matrix: ${{ steps.affected.outputs.matrix }}
      has_builds: ${{ steps.affected.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 2 }}

      - name: Select Images via Bazel & Manifest Digests
        id: affected
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          FORCE_FLAG=""
          if [ "$FORCE_ALL" = "true" ]; then
            FORCE_FLAG="--force-all"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null || true
            (git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD^1 HEAD 2>/dev/null || true) > "$RUNNER_TEMP/changed-files.txt"
          else
            (git diff --name-only HEAD^1 HEAD 2>/dev/null || true) > "$RUNNER_TEMP/changed-files.txt"
          fi
          ./scripts/bazel-select-images.sh $FORCE_FLAG --github-output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/changed-files.txt"

      - name: Test Build Metadata Publisher
        run: node --test scripts/build-metadata.test.cjs

      - name: Publish Build Selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON: ${{ steps.affected.outputs.matrix }}
          HAS_BUILDS: ${{ steps.affected.outputs.has_builds }}
        run: node scripts/build-metadata.cjs manifest

  test:
    name: Run Service Unit Tests
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify Monorepo Test Coverage & Gating
        run: |
          set -euo pipefail
          ./scripts/verify.sh

      # Real-Restate tests (build tag restateintegration) run against a pinned
      # restate-server binary; the script fetches and sha256-checks it.
      - name: Run Real-Restate Integration Tests
        if: needs.changes.outputs.eri == 'true' || needs.changes.outputs.eri-restate == 'true' || inputs.force_all == true
        run: bazel test --@rules_go//go/config:tags=restateintegration --test_arg=-test.v //services/eri/pkg/restatetest/... //services/eri/pkg/queue/...

  lint:
    name: Lint Microservices & Frontend
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 2 }}

      - name: Verify Repository Hygiene & Invariants
        run: |
          # 1. UTF-8 BOM Hygiene
          BOM_HEX=$(printf '\357\273\277')
          BOM_FILES=$(git grep -I -l "^$BOM_HEX" 2>/dev/null || true)
          if [ -n "$BOM_FILES" ]; then
            echo "::error::Invalid UTF-8 BOM detected in tracked files:"
            echo "$BOM_FILES" | sed 's/^/   • /'
            exit 1
          fi

          # 2. Direct execution of main() in test files
          MAIN_CALLS=$(git grep -E '\bmain\(\)' 'services/eri/*_test.go' 2>/dev/null || true)
          if [ -n "$MAIN_CALLS" ]; then
            echo "::error::Direct execution of main() detected in test files:"
            echo "$MAIN_CALLS" | sed 's/^/   • /'
            exit 1
          fi

          # 3. Ratcheted Code Health Gate & Scanner Unit Tests
          (cd scripts/code-health && go run . -root ../.. -baseline ../../.code-health-baseline.json)

      - name: Lint & Check Dead Code in Go Modules
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          . scripts/lib/hermetic-go-env.sh
          ensure_bazel_build_files "$GITHUB_WORKSPACE"
          GO_MODULES=$(discover_go_services)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null || true
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          fi
          if [ "${FORCE_ALL:-}" = "true" ] || [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -q -E '(^pkg/|^\.golangci\.ya?ml|^scripts/|^go\.(mod|sum)$|^build/|^MODULE\.bazel|^\.github/)'; then
            LINT_MODULES="$GO_MODULES"
          else
            LINT_MODULES=""
            for mod in $GO_MODULES; do
              if echo "$CHANGED_FILES" | grep -q "^$mod/"; then
                LINT_MODULES="$LINT_MODULES $mod"
              fi
            done
            if [ -z "$LINT_MODULES" ]; then
              echo "No Go module changes detected for linting; skipping."
              exit 0
            fi
          fi
          for svc in $LINT_MODULES; do
            echo "=== Linting & checking deadcode in $svc ==="
            (
              cd "$svc"
              golangci-lint run --path-prefix="$svc/" --config "$GITHUB_WORKSPACE/.golangci.yml" ./...
              FILTER_FLAG="-filter=^github\.com/azylman/aerial/${svc}(/|$)"
              if [ "$svc" = "services/eri" ]; then
                MAIN_PKGS=$(cd "$GITHUB_WORKSPACE" && go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./services/eri/... ./services/eri-restate/...)
              else
                MAIN_PKGS=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)
              fi
              if [ -n "$MAIN_PKGS" ]; then
                DEAD_PROD=$(cd "$GITHUB_WORKSPACE" && deadcode $FILTER_FLAG $MAIN_PKGS)
                if [ -n "$DEAD_PROD" ]; then
                  echo "::error::Unreachable production code or compiled-in test hooks detected in $svc:"
                  echo "$DEAD_PROD"
                  exit 1
                fi
              fi
              DEAD_TEST=$(deadcode -test $FILTER_FLAG ./...)
              if [ -n "$DEAD_TEST" ]; then
                echo "::error::Unreachable functions detected by deadcode -test in $svc:"
                echo "$DEAD_TEST"
                exit 1
              fi
            )
          done

      - name: Console React UI Gates (typecheck, coverage, build)
        if: needs.changes.outputs.console == 'true'
        working-directory: services/console/ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:coverage
          npm run build

  console-e2e:
    name: Console UI E2E Suite
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        if: needs.changes.outputs.console == 'true'
        uses: actions/checkout@v7

      - name: Build Console Binary For The Suite
        if: needs.changes.outputs.console == 'true'
        working-directory: services/console
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/aerial-console-e2e" .

      # Browser regression suite for the React console at /console/ (services/console/ui/e2e).
      # Runs inside the Playwright image whose tag matches the pinned @playwright/test, so browsers
      # and system libraries come from the image (no apt installs on runners). Sources are copied in
      # with docker cp rather than bind-mounted, which keeps the job independent of the docker host.
      - name: Run Console E2E Suite In Playwright Image
        if: needs.changes.outputs.console == 'true'
        run: |
          set -u
          PW_VERSION=$(node -p "require('./services/console/ui/package.json').devDependencies['@playwright/test']")
          CID=$(docker create --ipc=host -e CI=1 -e CONSOLE_E2E_BIN=/work/aerial-console-e2e -w /work/ui \
            "mcr.microsoft.com/playwright:v${PW_VERSION}-noble" \
            sh -c 'npm ci --no-audit --no-fund && npm run build && npm run e2e')
          docker cp services/console/. "$CID:/work/"
          # The UI imports the shared theme from ../../../web/theme (repo layout); from /work/ui
          # that resolves to /web/theme.
          docker cp web/. "$CID:/web"
          docker cp "$RUNNER_TEMP/aerial-console-e2e" "$CID:/work/aerial-console-e2e"
          STATUS=0
          docker start -a "$CID" || STATUS=$?
          mkdir -p services/console/ui/e2e
          docker cp "$CID:/work/ui/e2e/artifacts" services/console/ui/e2e/ 2>/dev/null || true
          docker rm -f "$CID" >/dev/null
          exit "$STATUS"

      - name: Upload Console E2E Artifacts
        if: failure() && needs.changes.outputs.console == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: console-e2e-artifacts
          path: services/console/ui/e2e/artifacts
          if-no-files-found: ignore

  build-and-push:
    permissions:
      contents: read
      packages: write
      checks: write
    name: Build & Push Images to GHCR (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.has_builds == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","ci"]') || fromJSON('["self-hosted","deploy"]') }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
      HAS_BUILDS: ${{ needs.changes.outputs.has_builds }}
      SERVICE_JSON: ${{ toJSON(matrix) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Publish Running Image Result
        id: metadata_running
        run: node scripts/build-metadata.cjs running

      - name: Ensure Ephemeral Bazel Build Files
        if: matrix.type == 'bazel' || matrix.service == 'eri-restate'
        run: |
          . scripts/lib/hermetic-go-env.sh
          ensure_bazel_build_files "$GITHUB_WORKSPACE"

      - name: Set up Persistent Local Buildx Builder
        if: matrix.type == 'docker' && github.event_name == 'pull_request'
        uses: ./.github/actions/setup-buildx-builder

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Git Tree SHA
        id: tree_check
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
          if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; } && [ "$REF" = "refs/heads/main" ] && [ "$FORCE_ALL" != "true" ]; then
            IMAGE_REF="ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}"
            if command -v crane >/dev/null 2>&1; then
              if crane digest "$IMAGE_REF" >/dev/null 2>&1; then
                echo "exists=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      # Pull requests set the builder up before login (above). Push runs decide first whether the
      # PR tree-cache image exists: a hit is a registry-side imagetools copy that needs only the
      # buildx CLI and the GHCR login, so the shared calibarn-buildkit builder is set up on a miss only.
      - name: Set up Persistent Local Buildx Builder (Cache Miss)
        if: matrix.type == 'docker' && github.event_name != 'pull_request' && steps.tree_check.outputs.exists != 'true'
        uses: ./.github/actions/setup-buildx-builder

      - name: Stage Pre-Built Binaries for eri-restate
        if: matrix.service == 'eri-restate'
        run: |
          set -euo pipefail
          bazel build --remote_download_toplevel \
            //services/eri-restate/cmd/eri-restate:eri-restate \
            //services/eri/cmd/hook-guard:hook-guard \
            //services/eri/cmd/transcript-search:transcript-search
          mkdir -p .bazel-stage
          cp -L bazel-bin/services/eri-restate/cmd/eri-restate/eri-restate_/eri-restate .bazel-stage/eri-restate
          cp -L bazel-bin/services/eri/cmd/hook-guard/hook-guard_/hook-guard .bazel-stage/hook-guard
          cp -L bazel-bin/services/eri/cmd/transcript-search/transcript-search_/transcript-search .bazel-stage/transcript-search

      - name: Push Image (${{ matrix.service }})
        id: cache_push
        if: matrix.type == 'bazel' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.tree_check.outputs.exists == 'true')
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
          SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.tree_check.outputs.tree_sha }}
          TREE_EXISTS: ${{ steps.tree_check.outputs.exists }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TYPE: ${{ matrix.type }}
          PUSH_ALLOWED: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set -euo pipefail
          if [ "$TYPE" = "bazel" ]; then
            if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; } && [ "$REF" = "refs/heads/main" ] && [ "$TREE_EXISTS" = "true" ]; then
              echo "Reusing existing tree-cache image ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA} for ${SHA}"
              SRC="ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}"
              if command -v crane >/dev/null 2>&1; then
                crane tag "$SRC" "${SHA}"
                DIGEST=$(crane digest "$SRC" 2>/dev/null || true)
              else
                docker buildx imagetools create \
                  --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:${SHA}" \
                  --annotation "index:org.opencontainers.image.revision=${SHA}" \
                  "$SRC"
                DIGEST=""
              fi
              if [ -n "$DIGEST" ]; then
                echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
              fi
            else
              bazel build --remote_download_toplevel "//images:${{ matrix.service }}"
              if [ "$PUSH_ALLOWED" = "true" ]; then
                INDEX="bazel-bin/images/${{ matrix.service }}/index.json"
                DIGEST=""
                if [ -f "$INDEX" ]; then
                  DIGEST=$(jq -r '.manifests[0].digest // empty' "$INDEX")
                fi
                TAG_ARGS=(--tag "tree-${TREE_SHA}")
                if [ "$EVENT_NAME" != "pull_request" ]; then
                  TAG_ARGS+=(--tag "${SHA}")
                fi
                bazel run "//images:push_${{ matrix.service }}" -- --repository "ghcr.io/${OWNER}/${IMAGE_NAME}" "${TAG_ARGS[@]}"
                if command -v crane >/dev/null 2>&1; then
                  PUSHED_DIGEST=$(crane digest "ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}" 2>/dev/null || true)
                  if [ -n "$PUSHED_DIGEST" ]; then
                    DIGEST="$PUSHED_DIGEST"
                  fi
                fi
                if [ -z "${DIGEST:-}" ]; then
                  echo "::error::Failed to extract image digest from $INDEX" >&2
                  exit 1
                fi
                echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            SRC="ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}"
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:${SHA}" \
              --annotation "index:org.opencontainers.image.revision=${SHA}" \
              "$SRC"
            DIGEST=""
            if command -v crane >/dev/null 2>&1; then
              DIGEST=$(crane digest "ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}" 2>/dev/null || true)
            fi
            if [ -n "$DIGEST" ]; then
              echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and Push ${{ matrix.service }}
        id: image_push
        if: matrix.type == 'docker' && steps.tree_check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts || '' }}
          file: ${{ matrix.file }}
          push: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}:tree-${{ steps.tree_check.outputs.tree_sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/{1}:{2}', steps.repo_owner.outputs.owner, matrix.image_name, github.sha) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            aerial.commit_sha=${{ github.sha }}
            aerial.service=${{ matrix.service }}

      - name: Publish Final Image Result
        if: always()
        env:
          RESULT_CHECK_ID: ${{ steps.metadata_running.outputs.check_id }}
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          PUSH_ALLOWED: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          TREE_SHA: ${{ steps.tree_check.outputs.tree_sha }}
          IMAGE_DIGEST: ${{ steps.image_push.outputs.digest || steps.cache_push.outputs.digest }}
        run: node scripts/build-metadata.cjs result

  roborev:
    name: roborev
    if: >
      github.event_name == 'pull_request' &&
      (github.actor == 'azylman' || github.actor == 'mcarmody' || github.actor == 'brockventures' || github.actor == 'dependabot[bot]' || github.actor == 'aerial-synapse[bot]') &&
      (github.event.pull_request.user.login == 'azylman' || github.event.pull_request.user.login == 'mcarmody' || github.event.pull_request.user.login == 'brockventures' || github.event.pull_request.user.login == 'dependabot[bot]') &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       github.event.pull_request.head.repo.full_name == 'mcarmody/aerial' ||
       github.event.pull_request.head.repo.full_name == 'brockventures/aerial')
    runs-on: [self-hosted, roborev]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: read
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Dependabot Metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      - name: Run Independent RoboRev Review Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -o pipefail
          if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ] || [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Dependabot PR detected; skipping RoboRev LLM review gate."
            exit 0
          fi
          if ! git cat-file -e origin/main:.roborev.toml 2>/dev/null; then
            echo "RoboRev not bootstrapped on main; skipping."
            exit 0
          fi
          export GH_TOKEN="${GITHUB_PAT:-${GH_TOKEN}}"
          export GITHUB_TOKEN="${GITHUB_PAT:-${GITHUB_TOKEN}}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            OVERRIDE_COMMENT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq "[.[] | select(.user.login == \"azylman\" and (.body | contains(\"## roborev-override\")) and ((.body | contains(\"${HEAD_SHA}\")) or (.body | contains(\"${SHORT_SHA}\"))))] | last | .body // empty" 2>/dev/null || true)
            if [ -n "${OVERRIDE_COMMENT}" ]; then
              echo "${OVERRIDE_COMMENT}" >> "$GITHUB_STEP_SUMMARY"
              echo "RoboRev gate overridden for commit ${SHORT_SHA} via verified technical rebuttal."
              exit 0
            fi

            CUR_PATCH=$(git diff "origin/main...${HEAD_SHA}" 2>/dev/null | git patch-id --stable | awk '{print $1}')
            if [ -n "${CUR_PATCH:-}" ]; then
              CANDIDATE_SHAS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" --jq '.[].sha' 2>/dev/null || true)
              PARENT_SHA=$(git rev-parse --verify "${HEAD_SHA}^1" 2>/dev/null || true)
              ALL_CANDIDATES=$(printf "%s\n%s\n" "${CANDIDATE_SHAS}" "${PARENT_SHA}" | grep -v '^[[:space:]]*$' | sort -u || true)
              for PREV_SHA in $ALL_CANDIDATES; do
                if [ "$PREV_SHA" = "$HEAD_SHA" ]; then
                  continue
                fi
                if ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
                  continue
                fi
                PREV_PATCH=$(git diff "origin/main...${PREV_SHA}" 2>/dev/null | git patch-id --stable | awk '{print $1}')
                if [ -n "${PREV_PATCH:-}" ] && [ "$PREV_PATCH" = "$CUR_PATCH" ]; then
                  PASSED_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREV_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "roborev" and .status == "completed" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
                  if [ "${PASSED_COUNT:-0}" -gt 0 ]; then
                    SUMMARY_LINE="RoboRev gate passed via unchanged patch-id ${CUR_PATCH:0:12} inherited from green commit ${PREV_SHA:0:7}."
                    echo "$SUMMARY_LINE" >> "$GITHUB_STEP_SUMMARY"
                    echo "$SUMMARY_LINE"
                    exit 0
                  fi
                fi
              done
            fi
          fi
          roborev ci review \
            --agent claude-code \
            --min-severity medium \
            --reasoning thorough | tee /tmp/roborev-review.md
          cat /tmp/roborev-review.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "Synthesis unavailable" /tmp/roborev-review.md; then
            echo "::error::RoboRev synthesis failed or fell back to raw output; failing closed."
            exit 1
          fi
          if grep -Eq '^## roborev: Review Passed|^No issues found\.$|^No findings at or above [a-z]+ severity\.$|roborev: no changes to review' /tmp/roborev-review.md; then
            echo "RoboRev gate passed."
            exit 0
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "${PR_NUMBER}" --body-file /tmp/roborev-review.md || true
          fi
          echo "::error::RoboRev reported actionable findings (>= medium severity)."
          exit 1

      - name: Enable Auto-Merge on Review Pass
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          export GH_TOKEN="${GITHUB_PAT:-${GH_TOKEN}}"
          gh pr merge --auto --squash "$PR_URL" || true

  build-gate:
    permissions:
      contents: read
      packages: write
      checks: write
    name: CI Gate
    needs: [changes, test, lint, console-e2e, roborev, build-and-push]
    # Push and workflow_dispatch runs publish the final record from promote-release instead.
    if: always() && github.event_name == 'pull_request'
    runs-on: [self-hosted, ci]
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
      HAS_BUILDS: ${{ needs.changes.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify All Upstream Jobs & Container Builds
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          FAILED=$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$FAILED" ]; then
            echo "::error::Upstream job(s) failed or were cancelled: $FAILED"
            exit 1
          fi
          UNEXPECTED_SKIP=$(echo "$NEEDS_JSON" | jq -r --arg event "$EVENT_NAME" --arg has_builds "${HAS_BUILDS:-false}" '
            [to_entries[] | select(
              .value.result == "skipped" and (
                .key == "changes" or
                .key == "validate" or
                ((.key == "build-and-push" or .key == "docker") and $has_builds == "true") or
                (.key != "build-and-push" and .key != "docker" and $event == "pull_request")
              )
            ) | .key] | join(", ")
          ')
          if [ -n "$UNEXPECTED_SKIP" ]; then
            echo "::error::Required upstream job(s) were unexpectedly skipped: $UNEXPECTED_SKIP"
            exit 1
          fi
          echo "All required checks and builds passed."

      - name: Publish Final Build Metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          MATRIX_RESULT: ${{ needs.build-and-push.result }}
        run: node scripts/build-metadata.cjs final

  # Push/workflow_dispatch release job: CI Gate's final build-metadata publish plus the :latest
  # promotion, folded into one deploy-pool job. It runs only when no upstream job failed or was
  # cancelled; `build-metadata.cjs final` itself still rejects any non-success matrix or need.
  promote-release:
    name: Promote Images to :latest
    needs: [changes, test, lint, console-e2e, roborev, build-and-push]
    if: >
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, deploy]
    permissions:
      contents: read
      packages: write
      checks: write
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      HAS_BUILDS: ${{ needs.changes.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish Final Build Metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          MATRIX_RESULT: ${{ needs.build-and-push.result }}
        run: node scripts/build-metadata.cjs final

      - name: Lowercase Repository Owner
        if: needs.changes.outputs.has_builds == 'true'
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        if: needs.changes.outputs.has_builds == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Changed Microservices to :latest
        if: needs.changes.outputs.has_builds == 'true'
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Promote non-eri dependencies before eri and eri-restate to prevent RPC skew on Watchtower restart
          pids=""
          for IMG in $(echo "$MATRIX_JSON" | jq -r '.[] | select(.service != "eri" and .service != "eri-restate") | .image_name'); do
            echo "Promoting non-eri manifest ghcr.io/${OWNER}/${IMG}:${SHA} -> ghcr.io/${OWNER}/${IMG}:latest"
            if command -v crane >/dev/null 2>&1; then
              crane tag "ghcr.io/${OWNER}/${IMG}:${SHA}" "latest" &
            else
              docker buildx imagetools create \
                --tag "ghcr.io/${OWNER}/${IMG}:latest" \
                --annotation "index:org.opencontainers.image.revision=${SHA}" \
                "ghcr.io/${OWNER}/${IMG}:${SHA}" &
            fi
            pids="$pids $!"
          done
          for pid in $pids; do
            wait "$pid" || exit 1
          done

          if echo "$MATRIX_JSON" | jq -e '.[] | select(.service == "eri-restate")' >/dev/null; then
            echo "Promoting eri-restate manifest ghcr.io/${OWNER}/aerial-eri-restate:${SHA} -> ghcr.io/${OWNER}/aerial-eri-restate:latest"
            if command -v crane >/dev/null 2>&1; then
              crane tag "ghcr.io/${OWNER}/aerial-eri-restate:${SHA}" "latest"
            else
              docker buildx imagetools create \
                --tag "ghcr.io/${OWNER}/aerial-eri-restate:latest" \
                --annotation "index:org.opencontainers.image.revision=${SHA}" \
                "ghcr.io/${OWNER}/aerial-eri-restate:${SHA}"
            fi
          fi

          if echo "$MATRIX_JSON" | jq -e '.[] | select(.service == "eri")' >/dev/null; then
            echo "Promoting eri manifest ghcr.io/${OWNER}/aerial-eri:${SHA} -> ghcr.io/${OWNER}/aerial-eri:latest"
            if command -v crane >/dev/null 2>&1; then
              crane tag "ghcr.io/${OWNER}/aerial-eri:${SHA}" "latest"
            else
              docker buildx imagetools create \
                --tag "ghcr.io/${OWNER}/aerial-eri:latest" \
                --annotation "index:org.opencontainers.image.revision=${SHA}" \
                "ghcr.io/${OWNER}/aerial-eri:${SHA}"
            fi
          fi
