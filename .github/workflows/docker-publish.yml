name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      brain: ${{ steps.filter.outputs.brain }}
      scheduler-mcp: ${{ steps.filter.outputs.scheduler-mcp }}
      discord-mcp: ${{ steps.filter.outputs.discord-mcp }}
      docker-mcp: ${{ steps.filter.outputs.docker-mcp }}
      github-mcp: ${{ steps.filter.outputs.github-mcp }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docs: ${{ steps.filter.outputs.docs }}
      proxy: ${{ steps.filter.outputs.proxy }}
      ollama: ${{ steps.filter.outputs.ollama }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            brain:
              - 'brain/**'
              - 'GEMINI.md'
              - '.agents/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            scheduler-mcp:
              - 'scheduler-mcp/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            discord-mcp:
              - 'discord-mcp/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            docker-mcp:
              - 'docker-mcp/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            github-mcp:
              - 'github-mcp/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            dashboard:
              - 'dashboard/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            docs:
              - 'docs-service/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            proxy:
              - 'proxy/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            ollama:
              - 'docker/ollama/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'

  test:
    name: Run Service Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Brain
        if: needs.changes.outputs.brain == 'true'
        run: |
          cd brain
          go test -v ./...

      - name: Test Scheduler MCP
        if: needs.changes.outputs.scheduler-mcp == 'true'
        run: |
          cd scheduler-mcp
          go test -v ./...

      - name: Test Discord MCP
        if: needs.changes.outputs.discord-mcp == 'true'
        run: |
          cd discord-mcp
          go test -v ./...

      - name: Test Status Dashboard (Go Backend & Permet HUD Frontend)
        if: needs.changes.outputs.dashboard == 'true'
        run: |
          cd dashboard
          go test -v ./...
          node --test *.test.js

  lint:
    name: Lint Microservices & Frontend
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint Brain
        if: needs.changes.outputs.brain == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: brain

      - name: Lint Scheduler MCP
        if: needs.changes.outputs.scheduler-mcp == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: scheduler-mcp

      - name: Lint Discord MCP
        if: needs.changes.outputs.discord-mcp == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: discord-mcp

      - name: Lint Status Dashboard Go Backend
        if: needs.changes.outputs.dashboard == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: dashboard

      - name: Lint Permet HUD Frontend Syntax
        if: needs.changes.outputs.dashboard == 'true'
        run: |
          node --check dashboard/static/app.js

      - name: Lint Docsify Custom Plugins
        if: needs.changes.outputs.docs == 'true'
        run: |
          node --check docs-service/app/assets/js/plugins/docsify-mermaid-cyberpunk.js

  build-and-push:
    name: Build & Push Images to GHCR
    needs: [changes, test, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: brain
            context: .
            file: ./brain/Dockerfile
            image_name: aerial-brain
          - service: scheduler-mcp
            context: ./scheduler-mcp
            file: ./scheduler-mcp/Dockerfile
            image_name: aerial-scheduler-mcp
          - service: discord-mcp
            context: ./discord-mcp
            file: ./discord-mcp/Dockerfile
            image_name: aerial-discord-mcp
          - service: docker-mcp
            context: ./docker-mcp
            file: ./docker-mcp/Dockerfile
            image_name: aerial-docker-mcp
          - service: github-mcp
            context: ./github-mcp
            file: ./github-mcp/Dockerfile
            image_name: aerial-github-mcp
          - service: dashboard
            context: ./dashboard
            file: ./dashboard/Dockerfile
            image_name: aerial-dashboard
          - service: docs
            context: ./docs-service
            file: ./docs-service/Dockerfile
            image_name: aerial-docs
          - service: proxy
            context: ./proxy
            file: ./proxy/Dockerfile
            image_name: aerial-proxy
          - service: ollama
            context: ./docker/ollama
            file: ./docker/ollama/Dockerfile
            image_name: aerial-ollama

    steps:
      - name: Checkout Repository
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        if: needs.changes.outputs[matrix.service] == 'true'
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        if: needs.changes.outputs[matrix.service] == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
