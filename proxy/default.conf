# Map HTTP status codes to standardized log levels for Vector ingestion
map $status $log_level {
    ~^[5] error;
    ~^[4] warn;
    default info;
}

# Structured JSON log format matching Vector pipeline schema
log_format json_analytics escape=json
    '{"time":"$time_iso8601",'
    '"level":"$log_level",'
    '"message":"$request_method $request_uri $status",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"}';

# Connection upgrade mapping for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Conditional OpenObserve admin session cookie (only injected if not already present in request)
map $cookie_auth_tokens $oo_auth_cookie {
    "" "auth_tokens=eyJhY2Nlc3NfdG9rZW4iOiJCYXNpYyBZV1J0YVc1QVlXVnlhV0ZzTG14dlkyRnNPa0ZsY21saGJDRk1iMmR6TWpBeU5pTT0iLCJyZWZyZXNoX3Rva2VuIjoiIn0=; Path=/openobserve/; Max-Age=315360000; SameSite=Lax";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # Stream structured JSON access logs to Docker stdout
    access_log /var/log/nginx/access.log json_analytics;

    # Docker embedded DNS resolver for dynamic runtime upstream resolution with fast failover
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Health check for Autoheal and Docker supervisor
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Root Landing Portal (Homepage with dynamic resolution & Permet failover)
    location / {
        set $homepage_backend http://aerial-homepage:3000;
        proxy_pass $homepage_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Disable upstream compression so sub_filter can rewrite stylesheet URLs
        proxy_set_header Accept-Encoding "";

        # Dynamic cache busting for Homepage custom.css
        sub_filter '/api/config/custom.css' '/api/config/custom.css?v=249.2';
        sub_filter_once off;

        # WebSocket & Server-Sent Events (SSE) for Real-Time Widgets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;

        # Fail-safe: Fallback to Permet HUD if Homepage is restarting or unavailable
        proxy_intercept_errors on;
        error_page 502 503 504 =302 /dashboard/;
    }

    # Homepage Custom Cyberpunk CSS Stylesheet with strict cache invalidation
    location = /api/config/custom.css {
        set $homepage_backend http://aerial-homepage:3000;
        proxy_pass $homepage_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Status Dashboard Microservice (Dynamic DNS via Docker resolver)
    location /dashboard/ {
        set $dashboard_backend http://aerial-dashboard:8080;
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dashboard {
        return 301 /dashboard/$is_args$args;
    }

    # Documentation Microservice (Docsify + Mermaid)
    location /docs/ {
        set $docs_backend http://aerial-docs:80;
        rewrite ^/docs/(.*)$ /$1 break;
        proxy_pass $docs_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Agentsview Custom Cyberpunk CSS Stylesheet
    location = /agentsview/custom.css {
        alias /etc/nginx/agentsview-cyberpunk.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Agentsview Microservice (Isolated under /agentsview/ with dynamic DNS)
    location /agentsview/ {
        set $agentsview_backend http://aerial-agentsview:8080;
        proxy_pass $agentsview_backend;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Disable upstream compression so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # Inject custom Cyberpunk stylesheet into HTML head
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/agentsview/custom.css?v=1.0"></head>';
        sub_filter_once on;

        # WebSocket & SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location = /agentsview {
        return 301 /agentsview/$is_args$args;
    }

    # Backward compatibility redirects for legacy /conversations path
    location = /conversations {
        return 301 /agentsview/;
    }

    location /conversations/ {
        rewrite ^/conversations/(.*)$ /agentsview/$1 permanent;
    }

    # Backward compatibility redirects for legacy bookmarks and links
    location /sessions/ {
        return 301 /agentsview$request_uri;
    }

    location = /sessions {
        return 301 /agentsview/sessions;
    }

    location /analytics/ {
        return 301 /agentsview$request_uri;
    }

    location = /analytics {
        return 301 /agentsview/analytics;
    }

    location /insights/ {
        return 301 /agentsview$request_uri;
    }

    location = /insights {
        return 301 /agentsview/insights;
    }

    # Grafana Custom Cyberpunk CSS Stylesheet
    location = /grafana/custom.css {
        alias /etc/nginx/grafana-cyberpunk.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Grafana Observability Dashboard Microservice
    location /grafana/ {
        set $grafana_backend http://aerial-grafana:3000;
        proxy_pass $grafana_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable upstream compression so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # Inject custom Cyberpunk stylesheet into HTML head
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/grafana/custom.css?v=3.0"></head>';
        sub_filter_once on;

        # WebSocket & Live Streaming Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # OpenObserve Custom Cyberpunk CSS Stylesheet
    location = /openobserve/custom.css {
        alias /etc/nginx/openobserve-cyberpunk.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # OpenObserve Static Assets (cached with upstream compression intact)
    location /openobserve/web/assets/ {
        set $openobserve_backend http://aerial-openobserve:5080;
        proxy_pass $openobserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenObserve Telemetry & Log Explorer Microservice
    location /openobserve/ {
        set $openobserve_backend http://aerial-openobserve:5080;
        proxy_pass $openobserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /openobserve;

        # Disable upstream compression so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # Explicitly scope sub_filter to HTML payloads only
        sub_filter_types text/html;

        # Inject OpenObserve admin session cookie if not already set in browser
        add_header Set-Cookie $oo_auth_cookie always;

        # Inject custom Cyberpunk stylesheet and client-side session/stream initialization into HTML head
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/openobserve/custom.css?v=1.0"><script>(function(){try{var u="eyJnaXZlbl9uYW1lIjoiYWRtaW5AYWVyaWFsLmxvY2FsIiwiYXV0aF90aW1lIjoxNzQyMjU2MDAwLCJuYW1lIjoiYWRtaW5AYWVyaWFsLmxvY2FsIiwiZXhwIjoxODkzNDU2MDAwLCJmYW1pbHlfbmFtZSI6IiIsImVtYWlsIjoiYWRtaW5AYWVyaWFsLmxvY2FsIiwicm9sZSI6InJvb3QifQ==";if(!localStorage.getItem("userInfo")){localStorage.setItem("userInfo",u);}if(!localStorage.getItem("creds")){localStorage.setItem("creds","true");}if(!localStorage.getItem("theme")){localStorage.setItem("theme","dark");}if(!localStorage.getItem("oo_selected_stream_logs_default")){localStorage.setItem("oo_selected_stream_logs_default",JSON.stringify(["docker_logs"]));}if(!localStorage.getItem("oo_logs_stream_type_default")){localStorage.setItem("oo_logs_stream_type_default","logs");}var f={};try{f=JSON.parse(localStorage.getItem("logFilterField"))||{};}catch(e){}if(!f||typeof f!=="object"||Array.isArray(f)){f={};}if(!f.default_docker_logs||!f.default_docker_logs.length){f.default_docker_logs=["service","message"];localStorage.setItem("logFilterField",JSON.stringify(f));}if(!f["default_docker-logs"]||!f["default_docker-logs"].length){f["default_docker-logs"]=["service","message"];localStorage.setItem("logFilterField",JSON.stringify(f));}var p=location.pathname;if((p==="/openobserve/"||p==="/openobserve"||p==="/openobserve/web/"||p==="/openobserve/web")&&(!location.hash||location.hash==="#/"||location.hash==="#")&&(!location.search||location.search==="")){location.replace("/openobserve/web/logs?stream=docker_logs&stream_type=logs");}}catch(e){}})();</script></head>';
        sub_filter_once on;

        # WebSocket & Live Streaming Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /openobserve {
        return 301 /openobserve/$is_args$args;
    }
}

