server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # Docker embedded DNS resolver for dynamic runtime upstream resolution with fast failover
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Health check for Autoheal and Docker supervisor
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Root redirect to Status Dashboard
    location = / {
        return 302 /dashboard/;
    }

    # Status Dashboard Microservice (Dynamic DNS via Docker resolver)
    location /dashboard/ {
        set $dashboard_backend http://aerial-dashboard:8080;
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dashboard {
        return 301 /dashboard/$is_args$args;
    }

    # Documentation Microservice (Docsify + Mermaid)
    location /docs/ {
        set $docs_backend http://aerial-docs:80;
        rewrite ^/docs/(.*)$ /$1 break;
        proxy_pass $docs_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Agentsview Custom Cyberpunk CSS Stylesheet
    location = /agentsview/custom.css {
        alias /etc/nginx/agentsview-cyberpunk.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Agentsview Microservice (Isolated under /agentsview/ with dynamic DNS)
    location /agentsview/ {
        set $agentsview_backend http://aerial-agentsview:8080;
        proxy_pass $agentsview_backend;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Disable upstream compression so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # Inject custom Cyberpunk stylesheet into HTML head
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/agentsview/custom.css?v=1.0"></head>';
        sub_filter_once on;

        # WebSocket & SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location = /agentsview {
        return 301 /agentsview/$is_args$args;
    }

    # Backward compatibility redirects for legacy /conversations path
    location = /conversations {
        return 301 /agentsview/;
    }

    location /conversations/ {
        rewrite ^/conversations/(.*)$ /agentsview/$1 permanent;
    }

    # Backward compatibility redirects for legacy bookmarks and links
    location /sessions/ {
        return 301 /agentsview$request_uri;
    }

    location = /sessions {
        return 301 /agentsview/sessions;
    }

    location /analytics/ {
        return 301 /agentsview$request_uri;
    }

    location = /analytics {
        return 301 /agentsview/analytics;
    }

    location /insights/ {
        return 301 /agentsview$request_uri;
    }

    location = /insights {
        return 301 /agentsview/insights;
    }

    # Grafana Custom Cyberpunk CSS Stylesheet
    location = /grafana/custom.css {
        alias /etc/nginx/grafana-cyberpunk.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Grafana Observability Dashboard Microservice
    location /grafana/ {
        set $grafana_backend http://aerial-grafana:3000;
        proxy_pass $grafana_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable upstream compression so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # Inject custom Cyberpunk stylesheet into HTML head
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/grafana/custom.css?v=3.0"></head>';
        sub_filter_once on;

        # WebSocket & Live Streaming Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}

