server {
    listen 80;
    server_name _;
    server_tokens off;

    # Exact match for Status Dashboard homepage
    location = / {
        proxy_pass http://aerial-dashboard:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Status Dashboard specific assets & APIs
    location /api/ {
        proxy_pass http://aerial-dashboard:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /style.css {
        proxy_pass http://aerial-dashboard:8080/style.css;
        proxy_set_header Host $host;
    }

    location = /app.js {
        proxy_pass http://aerial-dashboard:8080/app.js;
        proxy_set_header Host $host;
    }

    # Agentsview main entrypoint
    location /conversations/ {
        proxy_pass http://aerial-agentsview:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location = /conversations {
        return 301 /conversations/;
    }

    # Agentsview default fallback (for assets, API, and WebSockets)
    location / {
        proxy_pass http://aerial-agentsview:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
