server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # Health check for Autoheal and Docker supervisor
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Status Dashboard specific homepage
    location = / {
        proxy_pass http://aerial-dashboard:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Status Dashboard specific APIs
    location = /api/status {
        proxy_pass http://aerial-dashboard:8080/api/status;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/facts {
        proxy_pass http://aerial-dashboard:8080/api/facts;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Status Dashboard static assets
    location = /style.css {
        proxy_pass http://aerial-dashboard:8080/style.css;
        proxy_set_header Host $http_host;
    }

    location = /app.js {
        proxy_pass http://aerial-dashboard:8080/app.js;
        proxy_set_header Host $http_host;
    }

    # Agentsview entrypoint
    location /conversations/ {
        proxy_pass http://aerial-agentsview:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location = /conversations {
        return 301 /conversations/;
    }

    # Agentsview fallback (for /api/v1, /assets/, /analytics/, WebSockets, etc.)
    location / {
        proxy_pass http://aerial-agentsview:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
