version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - nilerr
    - noctx
    - predeclared
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - hash.Hash.Write
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - errchkjson
          - ineffassign
          - noctx
          - staticcheck
          - unparam
          - unused
          - wastedassign
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
