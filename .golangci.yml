version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - cyclop
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - gocyclo
    - gomoddirectives
    - goprintffuncname
    - govet
    - iface
    - ineffassign
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 20
      package-average: 10.0
    exhaustive:
      default-signifies-exhaustive: true
    gomoddirectives:
      replace-local: true
    perfsprint:
      error-format: false
    dupl:
      threshold: 100
    dupword:
      comments-only: true
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - hash.Hash.Write
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
    funlen:
      lines: 150
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - nilness
        - reflectvaluecompare
        - sortslice
        - timeformat
        - unusedwrite
    modernize:
      disable:
        - omitzero
    nestif:
      min-complexity: 5
    staticcheck:
      checks:
        - "SA*"
        - "S1*"
        - "QF1*"
    thelper:
      tb:
        name: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - cyclop
          - dupl
          - errcheck
          - errchkjson
          - funlen
          - gocognit
          - gocyclo
          - maintidx
          - nestif
          - nilnil
          - noctx
          - staticcheck
          - unparam
        path: _test\.go
      - linters:
          - containedctx
        path: services/eri/pkg/(queue/(pool|worker)|runner/(interchangeable_pool|streaming_daemon|unified_pool))\.go
      - linters:
          - nilnil
        path: (services/eri/pkg/db/(dispatches|messages)|services/prospera/store)\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
