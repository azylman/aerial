version: "2"
linters:
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - gocritic
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - evalOrder
        - sloppyReassign
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - hash.Hash.Write
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
    staticcheck:
      checks:
        - "SA*"
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - errcheck
          - errchkjson
          - ineffassign
          - nilnil
          - noctx
          - staticcheck
          - unparam
          - unused
          - wastedassign
        path: _test\.go
      - linters:
          - containedctx
        path: services/eri/pkg/(queue/(pool|worker)|runner/(interchangeable_pool|streaming_daemon|unified_pool))\.go
      - linters:
          - nilnil
        path: (services/eri/pkg/db/(dispatches|messages)|services/prospera/store)\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
