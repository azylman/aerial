version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 20
      package-average: 10.0
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: use channels, deadline-bounded condition polling, or an injected clock instead of time.Sleep
    gomoddirectives:
      replace-local: true
    perfsprint:
      error-format: false
    tagalign:
      align: true
      sort: false
    dupl:
      threshold: 100
    dupword:
      comments-only: true
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - hash.Hash.Write
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*github.com/azylman/aerial/services/synapse.RouterServer).publishPRLifecycleEvent
        - (*github.com/azylman/aerial/services/synapse.RouterServer).publishDeployLifecycleEvent
    funlen:
      lines: 150
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - paramTypeCombine
        # ptrToRefParam: both findings are deliberate pointer-to-reference params
        # (deferred *error metrics hook, lazily initialised *map lock table).
        - ptrToRefParam
        # rangeValCopy: 215 findings (166 production), each a >128-byte struct copy
        # in a range loop with no measured hot path; over the 150-finding budget.
        - rangeValCopy
        # sloppyReassign: contradicts govet shadow; every `if err = f()` it flags
        # reuses an outer err, and the suggested `err :=` is a shadow finding.
        - sloppyReassign
        # sprintfQuotedString: 29 findings, all deliberate wire formats (Discord
        # markdown code spans, ETag quoting, TwiML attributes) where %q/%#q would
        # Go-escape the payload or fall back to double quotes and change output.
        - sprintfQuotedString
        # stringConcatSimplify: pure taste; its 22 findings all collapse readable
        # one-line-per-record strings.Join test fixtures into single long lines.
        - stringConcatSimplify
        - unnamedResult
        - whyNoLint
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - nilness
        - reflectvaluecompare
        - shadow
        - sortslice
        - timeformat
        - unusedwrite
      settings:
        shadow:
          strict: false
    modernize:
      disable:
        - omitzero
    nestif:
      min-complexity: 5
    staticcheck:
      checks:
        - "SA*"
        - "S1*"
        - "QF1*"
    dogsled:
      max-blank-identifiers: 3
    gosec:
      # Re-audited per rule (build-1794767772 chunk 6). Every rule not listed is
      # enforced; each exclusion below is noise for this codebase, not a backlog.
      excludes:
        # G101: name heuristic; all 4 hits were file paths or empty strings
        # (kubeTokenPath, oauthTokenSourcePath, apiKey := ""). Secret leaks are
        # caught by eri's commit guard scanner instead.
        - G101
        # G104: duplicates errcheck, which owns the unchecked-error policy
        # (including its deliberate Close exclusions); all 3 hits were Body.Close.
        - G104
        # G115: all 14 hits are deliberate width conversions: two's-complement
        # PCM reinterpretation and bounded mu-law math in prospera/ulaw.go,
        # protocol counters (NATS NumPending, Postgres attnum) and modulo indices.
        - G115
        # G201/G202/G701: dynamic SQL here only splices fixed identifiers and
        # generated $N placeholder lists; every value is bound (11 hits, 0 real).
        - G201
        - G202
        - G701
        # G204: subprocess launches are the product (git, agent CLIs); args are
        # passed as argv, never through a shell.
        - G204
        # G301/G302/G306: eri stages homes, rules, hooks and attachments for agent
        # turns that run as a different uid (1000), so 0755/0644 are required.
        - G301
        - G302
        - G306
        # G304/G703: 62 hits, all operator-configured paths (config files,
        # mounted rule/skill trees, transcripts eri itself writes). The one
        # plan-supplied path (vanadis target files) now reads through os.Root.
        - G304
        - G703
        # G704: proxies and clients target configured upstream base URLs by
        # design (16 hits); the one real escape (discord-mcp absolute-form
        # request URIs) is fixed by pinning the upstream host.
        - G704
        # G706: 17 hits, all log lines carrying internal IDs, config paths or
        # upstream URLs; the one attacker-supplied value (httpkit reload path) is
        # now logged with %q.
        - G706
    gosmopolitan:
      allow-time-local: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    thelper:
      tb:
        name: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - errcheck
          - errchkjson
          - goconst
          - gosec
          - gosmopolitan
          - nilnil
          - noctx
          - unparam
        path: _test\.go
      - linters:
          - staticcheck
        path: _test\.go
        text: "SA1012:"
      - linters:
          - containedctx
        path: services/eri/pkg/(queue/(pool|worker)|runner/(interchangeable_pool|streaming_daemon|unified_pool))\.go
      - linters:
          - nilnil
        path: (services/eri/pkg/db/(dispatches|messages)|services/prospera/store)\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/azylman)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
