server {
    listen 80;
    server_name _;
    server_tokens off;

    # Health check for Autoheal and supervisor
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Theme CSS Stylesheets (Fast revalidation & cache-busting)
    location ~* \.css$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vendored static assets (Docsify, Mermaid, JS, Prism plugins)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Docsify Shell
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fallback for root README if user config has no README.md
    location = /README.md {
        root /share/aerial-config/docs;
        types { text/markdown md; }
        try_files /README.md /usr/share/nginx/html/fallback/README.md;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fallback for sidebar if user config has no _sidebar.md
    location = /_sidebar.md {
        root /share/aerial-config/docs;
        types { text/markdown md; }
        try_files /_sidebar.md /usr/share/nginx/html/fallback/_sidebar.md =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fallback for 404 page if user config has no _404.md
    location = /_404.md {
        root /share/aerial-config/docs;
        types { text/markdown md; }
        try_files /_404.md /usr/share/nginx/html/fallback/_404.md;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Markdown & Static Document Content from user volume mount
    location / {
        root /share/aerial-config/docs;
        types {
            text/markdown md;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/webp webp;
            image/gif gif;
            application/json json;
            text/css css;
            application/javascript js;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
