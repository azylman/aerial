services:
  # ----------------------------------------------------------------------------
  # 0. Persistence Layer: PostgreSQL with pgvector
  #    Persistent relational storage, CAS task queues, and vector memory.
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aerial-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      autoheal: "true"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aerial}
      - POSTGRES_USER=${POSTGRES_USER:-aerial}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aerial_secure_pass}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - aerial-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aerial} -d $${POSTGRES_DB:-aerial} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 1s

  # ----------------------------------------------------------------------------
  # 1. Execution Brain: Aerial Brain
  #    Runs headless Antigravity CLI agent prompts with PostgreSQL & pgvector memory,
  #    built-in Discord Gateway funnel with continuous typing indicator refresh,
  #    and connects to remote MCP network servers.
  # ----------------------------------------------------------------------------
  brain:
    image: ghcr.io/azylman/aerial-brain:latest
    build:
      context: .
      dockerfile: brain/Dockerfile
    container_name: aerial-brain
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      autoheal: "true"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD:-aerial_secure_pass}@postgres:5432/${POSTGRES_DB:-aerial}?sslmode=disable}
      - GEMINI_HARNESS_API_KEY=${GEMINI_HARNESS_API_KEY:-${GEMINI_API_KEY}}
      - AGY_GEMINI_API_KEY=${AGY_GEMINI_API_KEY}
      - AGY_MODEL=${AGY_MODEL:-}
      - GITHUB_PAT=${GITHUB_PAT}
      - HA_TOKEN=${HA_TOKEN}
      - AERIAL_CONFIG_REPO_URL=${AERIAL_CONFIG_REPO_URL}
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - GIT_TERMINAL_PROMPT=0
      - GOCACHE=${GOCACHE:-/data/cache/go-build}
      - GOPATH=${GOPATH:-/data/cache/go}
      - GOMODCACHE=${GOMODCACHE:-/data/cache/go/pkg/mod}
      - GOLANGCI_LINT_CACHE=${GOLANGCI_LINT_CACHE:-/data/cache/golangci-lint}
      - OPENOBSERVE_URL=${OPENOBSERVE_URL:-http://host.docker.internal:5080/openobserve}
      - OPENOBSERVE_ORG=${OPENOBSERVE_ORG:-default}
      - OPENOBSERVE_ROOT_USER_EMAIL=${OPENOBSERVE_ROOT_USER_EMAIL:-admin@aerial.local}
      - OPENOBSERVE_ROOT_USER_PASSWORD=${OPENOBSERVE_ROOT_USER_PASSWORD:-Aerial!Logs2026#}
    shm_size: '512mb'
    volumes:
      - aerial-brain-data:/data
      - aerial-brain-gemini:/root/.gemini
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}:/share/aerial:ro
    ports:
      - "${AERIAL_BRAIN_HOST_PORT:-8088}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 1b. Hangar Sidecar: Aerial Hangar
  #     Performs automated, single-flight Git synchronization and OCI container
  #     reconciliation for live services. Holds write volume mounts to prevent
  #     unpushed commits from ever touching the execution brain.
  # ----------------------------------------------------------------------------
  hangar:
    image: ghcr.io/azylman/aerial-hangar:latest
    build:
      context: .
      dockerfile: sidecars/hangar/Dockerfile
    container_name: aerial-hangar
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      - PORT=8080
      - GITHUB_PAT=${GITHUB_PAT}
      - AERIAL_CONFIG_REPO_URL=${AERIAL_CONFIG_REPO_URL}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SYNC_INTERVAL=60s
      - SYNC_REPOS=/share/aerial-config,/share/aerial
      - NOMAD_ADDR=${NOMAD_ADDR:-http://host.docker.internal:4646}
      - NOMAD_TOKEN=${NOMAD_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:rw
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}:/share/aerial:rw
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HANGAR_HOST_PORT:-8087}:8080"
    networks:
      aerial-net:
        aliases:
          - hangar
          - aerial-hangar
          - gitsync
          - aerial-gitsync
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ----------------------------------------------------------------------------
  # 2. Container Auto-Healing: Autoheal
  #    Monitors Docker healthchecks and restarts unhealthy containers automatically.
  # ----------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: aerial-autoheal
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
      - DOCKER_API_VERSION=1.45
    networks:
      - aerial-net



  # ----------------------------------------------------------------------------
  # 8. Local LLM / Embeddings: Ollama Service
  #    Provides local AI models & embedding generations with persistent storage.
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aerial-ollama
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - aerial-ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - aerial-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        /bin/ollama serve &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        (
          until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
          /bin/ollama pull all-minilm
        ) &
        wait $$pid
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
      start_interval: 2s





  # ----------------------------------------------------------------------------
  # 21. Cluster Orchestrator & Local Worker: HashiCorp Nomad
  #     Dedicated single-node control plane and local HAOS client node.
  # ----------------------------------------------------------------------------
  nomad-server:
    image: hashicorp/nomad:1.8.4
    container_name: aerial-nomad-server
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - NOMAD_SKIP_DOCKER_IMAGE_WARN=1
    command: ["agent", "-config=/nomad/config/nomad.hcl"]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/data/nomad/client:/mnt/data/nomad/client
      - aerial-nomad-server-data:/nomad/data
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/nomad/nomad.hcl:/nomad/config/nomad.hcl:ro
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "nomad server members && nomad node status -self || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

networks:
  aerial-net:
    name: aerial-net
    driver: bridge

volumes:
  aerial-brain-data:
    name: aerial-brain-data
  aerial-brain-gemini:
    name: aerial-brain-gemini
  aerial-ollama-data:
    name: aerial-ollama-data
  aerial-agentsview-data:
    name: aerial-agentsview-data
  aerial-postgres-data:
    name: aerial-postgres-data
  aerial-victoriametrics-data:
    name: aerial-victoriametrics-data
  aerial-openobserve-data:
    name: aerial-openobserve-data
  aerial-vector-data:
    name: aerial-vector-data
  aerial-nomad-server-data:
    name: aerial-nomad-server-data



