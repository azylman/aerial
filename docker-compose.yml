services:
  # ----------------------------------------------------------------------------
  # 0. Persistence Layer: PostgreSQL with pgvector
  #    Persistent relational storage, CAS task queues, and vector memory.
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aerial-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      autoheal: "true"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aerial}
      - POSTGRES_USER=${POSTGRES_USER:-aerial}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aerial_secure_pass}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - aerial-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aerial} -d $${POSTGRES_DB:-aerial} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 1. Execution Brain: Aerial Brain
  #    Runs headless Antigravity CLI agent prompts with PostgreSQL & pgvector memory,
  #    built-in Discord Gateway funnel with continuous typing indicator refresh,
  #    and connects to remote MCP network servers.
  # ----------------------------------------------------------------------------
  brain:
    image: ghcr.io/azylman/aerial-brain:latest
    build:
      context: .
      dockerfile: brain/Dockerfile
    container_name: aerial-brain
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      autoheal: "true"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD:-aerial_secure_pass}@postgres:5432/${POSTGRES_DB:-aerial}?sslmode=disable}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGY_MODEL=${AGY_MODEL:-Claude Opus 4.6 (Thinking)}
      - GITHUB_PAT=${GITHUB_PAT}
      - HA_TOKEN=${HA_TOKEN}
      - AERIAL_CONFIG_REPO_URL=${AERIAL_CONFIG_REPO_URL}
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - GIT_TERMINAL_PROMPT=0
    shm_size: '512mb'
    volumes:
      - aerial-brain-data:/data
      - aerial-brain-gemini:/root/.gemini
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}:/share/aerial:ro
    ports:
      - "${AERIAL_BRAIN_HOST_PORT:-8088}:8080"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      scheduler-mcp:
        condition: service_healthy
      docker-mcp:
        condition: service_started
      github-mcp:
        condition: service_started
      discord-mcp:
        condition: service_started
      victoriametrics-mcp:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 1b. Hangar Sidecar: Aerial Hangar
  #     Performs automated, single-flight Git synchronization and OCI container
  #     reconciliation for live services. Holds write volume mounts to prevent
  #     unpushed commits from ever touching the execution brain.
  # ----------------------------------------------------------------------------
  hangar:
    image: ghcr.io/azylman/aerial-hangar:latest
    build:
      context: .
      dockerfile: sidecars/hangar/Dockerfile
    container_name: aerial-hangar
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      - PORT=8080
      - GITHUB_PAT=${GITHUB_PAT}
      - AERIAL_CONFIG_REPO_URL=${AERIAL_CONFIG_REPO_URL}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SYNC_INTERVAL=60s
      - SYNC_REPOS=/share/aerial-config,/share/aerial
    volumes:
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:rw
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}:/share/aerial:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. Container Auto-Healing: Autoheal
  #    Monitors Docker healthchecks and restarts unhealthy containers automatically.
  # ----------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: aerial-autoheal
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
      - DOCKER_API_VERSION=1.45
    networks:
      - aerial-net

  # ----------------------------------------------------------------------------
  # 4. Outbound MCP: Scheduler MCP Server
  #    Provides persistent schedule registration & management tools over HTTP.
  # ----------------------------------------------------------------------------
  scheduler-mcp:
    image: ghcr.io/azylman/aerial-scheduler-mcp:latest
    build: ./scheduler-mcp
    container_name: aerial-scheduler-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD:-aerial_secure_pass}@postgres:5432/${POSTGRES_DB:-aerial}?sslmode=disable}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
    ports:
      - "${SCHEDULER_MCP_HOST_PORT:-4005}:8080"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. Outbound MCP: Discord MCP Server
  #    Provides Discord tools (send message, create thread, read history) over HTTP.
  # ----------------------------------------------------------------------------
  discord-mcp:
    image: ghcr.io/azylman/aerial-discord-mcp:latest
    build: ./discord-mcp
    container_name: aerial-discord-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      - PORT=4001
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    ports:
      - "${DISCORD_MCP_HOST_PORT:-4001}:4001"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ----------------------------------------------------------------------------
  # 6. Outbound MCP: Docker Host MCP Server
  #    Wraps the official mcp/docker image with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  docker-mcp:
    image: ghcr.io/azylman/aerial-docker-mcp:latest
    build: ./docker-mcp
    container_name: aerial-docker-mcp
    restart: unless-stopped
    init: true
    labels:
      autoheal: "true"
    environment:
      - PORT=4002
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DOCKER_MCP_HOST_PORT:-4002}:4002"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X OPTIONS http://127.0.0.1:4002/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ----------------------------------------------------------------------------
  # 7. Outbound MCP: GitHub MCP Server
  #    Wraps the official GitHub MCP server with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  github-mcp:
    image: ghcr.io/azylman/aerial-github-mcp:latest
    build: ./github-mcp
    container_name: aerial-github-mcp
    restart: unless-stopped
    init: true
    labels:
      autoheal: "true"
    environment:
      - PORT=4003
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
    ports:
      - "${GITHUB_MCP_HOST_PORT:-4003}:4003"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X OPTIONS http://127.0.0.1:4003/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ----------------------------------------------------------------------------
  # 8. Local LLM / Embeddings: Ollama Service
  #    Provides local AI models & embedding generations with persistent storage.
  # ----------------------------------------------------------------------------
  ollama:
    image: ghcr.io/azylman/aerial-ollama:latest
    build: ./docker/ollama
    container_name: aerial-ollama
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - aerial-ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 180s

  # ----------------------------------------------------------------------------
  # 9. Observability & Visualization: Agentsview Web Dashboard
  #    Local-first web UI for searching, analyzing, and visually inspecting
  #    Antigravity agent transcripts and session traces.
  # ----------------------------------------------------------------------------
  agentsview:
    image: ghcr.io/azylman/agentsview:latest
    container_name: aerial-agentsview
    restart: unless-stopped
    labels:
      autoheal: "true"
      homepage.group: "Aerial AI & Mission Control"
      homepage.name: "AgentsView"
      homepage.icon: "terminal.png"
      homepage.href: "/agentsview/"
      homepage.description: "Live Agent Session Transcripts"
    environment:
      - AGENTSVIEW_DATA_DIR=/agentsview-data
    command:
      - "--host=0.0.0.0"
      - "--base-path=/agentsview"
      - "--public-origin=${AGENTSVIEW_PUBLIC_ORIGINS:-http://localhost:8089,http://127.0.0.1:8089}"
      - "--public-url=${AGENTSVIEW_PUBLIC_URL:-http://localhost:8089}"
    volumes:
      - aerial-agentsview-data:/agentsview-data
      - aerial-brain-data:/data:ro
      - aerial-brain-gemini:/root/.gemini:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/agentsview/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 10. Core Status Dashboard: Aerial Status Microservice
  #     Monitors Docker container health and serves Cyberpunk status HUD.
  # ----------------------------------------------------------------------------
  dashboard:
    image: ghcr.io/azylman/aerial-dashboard:latest
    build: ./dashboard
    container_name: aerial-dashboard
    restart: unless-stopped
    labels:
      autoheal: "true"
      homepage.group: "Aerial AI & Mission Control"
      homepage.name: "Aerial Command HUD"
      homepage.icon: "/dashboard/apple-touch-icon.png"
      homepage.href: "/dashboard/"
      homepage.description: "Autonomous Agent Mission Control"
      homepage.widget.type: "customapi"
      homepage.widget.url: "http://aerial-dashboard:8080/api/status"
      homepage.widget.mappings[0].field: "active_tasks_count"
      homepage.widget.mappings[0].label: "Active Tasks"
      homepage.widget.mappings[1].field: "cluster_status"
      homepage.widget.mappings[1].label: "Cluster Status"
      homepage.widget.mappings[2].field: "ongoing_deploy"
      homepage.widget.mappings[2].label: "Ongoing Deploy"
    environment:
      - PORT=8080
      - BRAIN_URL=http://brain:8080
      - HANGAR_URL=http://hangar:8080
      - GITSYNC_URL=http://hangar:8080
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_REPO=${GITHUB_REPO:-azylman/aerial}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 11. Documentation Engine: Aerial Docs v1.0.0 (Docsify + Mermaid.js)
  #     Renders user markdown documentation and Mermaid diagrams from config repo.
  # ----------------------------------------------------------------------------
  docs:
    image: ghcr.io/azylman/aerial-docs:latest
    build: ./docs-service
    container_name: aerial-docs
    restart: unless-stopped
    labels:
      autoheal: "true"
      homepage.group: "Aerial AI & Mission Control"
      homepage.name: "System Docs"
      homepage.icon: "docsify.png"
      homepage.href: "/docs/"
      homepage.description: "Architecture Specs & Runbooks"
    volumes:
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/docs-service/app:/usr/share/nginx/html:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 11.1 Root Landing Portal: Aerial Homepage (Gundam Cyberpunk HUD)
  #      Out-of-the-box landing gateway with auto-discovered core services.
  # ----------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: aerial-homepage
    restart: unless-stopped
    stop_grace_period: 15s
    labels:
      autoheal: "true"
    environment:
      - PORT=3000
      - HOMEPAGE_ALLOWED_HOSTS=*
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/homepage:/app/core-homepage:ro
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
    entrypoint:
      - /bin/sh
      - /app/core-homepage/entrypoint.sh
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 12. Edge Reverse Proxy Gateway: Aerial Proxy Gateway
  #     Routes traffic for / (status dashboard), /docs (docsify), and /agentsview (agentsview).
  # ----------------------------------------------------------------------------
  proxy:
    image: ghcr.io/azylman/aerial-proxy:latest
    build: ./proxy
    container_name: aerial-proxy
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    labels:
      autoheal: "true"
    volumes:
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/proxy/grafana-cyberpunk.css:/etc/nginx/grafana-cyberpunk.css:ro
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/proxy/agentsview-cyberpunk.css:/etc/nginx/agentsview-cyberpunk.css:ro
    ports:
      - "${AGENTSVIEW_HOST_PORT:-8089}:80"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      dashboard:
        condition: service_healthy
      docs:
        condition: service_healthy
      agentsview:
        condition: service_healthy
      grafana:
        condition: service_healthy
      homepage:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 13. Observability: cAdvisor Container Metrics Collector
  #     Gathers per-container CPU, memory, network, and disk telemetry.
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aerial-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=percpu,sched,tcp,udp,advtcp,process"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 14. Observability: Node Exporter Host Telemetry
  #     Gathers host CPU loads, memory, storage, thermals, and network metrics.
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: aerial-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 15. Observability: VictoriaMetrics Single-Node TSDB
  #     Lightweight time-series database with long-term retention & downsampling.
  # ----------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: aerial-victoriametrics
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-promscrape.config=/share/aerial/victoriametrics/scrape.yml"
      - "-promscrape.configCheckInterval=15s"
      - "-retentionPeriod=${VICTORIAMETRICS_RETENTION_PERIOD:-5y}"
    environment:
      - HA_METRICS_TOKEN=${HA_METRICS_TOKEN:-}
    volumes:
      - aerial-victoriametrics-data:/victoria-metrics-data
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}:/share/aerial:ro
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      cadvisor:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      postgres-exporter:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 16. Observability: Grafana Visual Dashboards
  #     Serves system HUD & container metrics with PostgreSQL persistent backend.
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: aerial-grafana
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
      homepage.group: "Observability"
      homepage.name: "Grafana Telemetry"
      homepage.icon: "grafana.png"
      homepage.href: "/grafana/"
      homepage.description: "Timeseries & Container Metrics"
      homepage.widget.type: "grafana"
      homepage.widget.version: "2"
      homepage.widget.url: "http://aerial-grafana:3000"
      homepage.widget.username: "${GRAFANA_ADMIN_USER:-admin}"
      homepage.widget.password: "${GRAFANA_ADMIN_PASSWORD:-aerial_metrics_pass}"
    environment:
      - GF_PATHS_PROVISIONING=/share/aerial/grafana/provisioning
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=${POSTGRES_DB:-aerial}
      - GF_DATABASE_USER=${POSTGRES_USER:-aerial}
      - GF_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-aerial_secure_pass}
      - GF_DATABASE_SSL_MODE=disable
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-aerial_metrics_pass}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_DISABLE_SIGNOUT_MENU=true
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}:/share/aerial:ro
      - ${AERIAL_HOST_CONFIG_DIR:-${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}}:/share/aerial-config:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      quickwit:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 17. Observability: PostgreSQL Metrics Exporter
  #     Gathers database connection pools, locks, query stats, and buffer metrics.
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: aerial-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD:-aerial_secure_pass}@postgres:5432/${POSTGRES_DB:-aerial}?sslmode=disable
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=true
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9187/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 18. Outbound MCP: VictoriaMetrics MCP Server
  #     Exposes VictoriaMetrics TSDB metrics querying, rule checks, and telemetry
  #     inspection tools to Aerial agent prompts over Streamable HTTP.
  # ----------------------------------------------------------------------------
  victoriametrics-mcp:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
    container_name: aerial-victoriametrics-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      - MCP_SERVER_MODE=http
      - MCP_LISTEN_ADDR=:4004
      - VM_INSTANCE_ENTRYPOINT=http://victoriametrics:8428
      - VM_INSTANCE_TYPE=single
      - MCP_DISABLED_TOOLS=documentation,export,metric_relabel_debug
    ports:
      - "${VICTORIAMETRICS_MCP_HOST_PORT:-127.0.0.1:4044}:4004"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4004/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      victoriametrics:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 19. Observability: Quickwit Distributed Log Search Engine
  #     Sub-second full-text indexing with native Tantivy search and Elasticsearch compatibility.
  # ----------------------------------------------------------------------------
  quickwit:
    image: quickwit/quickwit:v0.8.2
    container_name: aerial-quickwit
    restart: unless-stopped
    stop_grace_period: 20s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
      homepage.group: "Observability"
      homepage.name: "Quickwit Logs"
      homepage.icon: "quickwit.png"
      homepage.description: "Full-Text Log Search Engine"
    entrypoint: ["/bin/sh", "/quickwit/config/entrypoint.sh"]
    environment:
      - NO_COLOR=1
      - QW_CONFIG=/quickwit/config/quickwit.yaml
    volumes:
      - aerial-quickwit-data:/quickwit/qwdata
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/quickwit:/quickwit/config:ro
    ports:
      - "${QUICKWIT_HOST_PORT:-7280}:7280"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "quickwit index list --endpoint http://127.0.0.1:7280 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 20. Observability: Vector Log Shipper & Transformation Pipeline
  #     Scrapes Docker container stdout/stderr, normalizes logs via VRL, and ships to Quickwit.
  # ----------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.40.0-alpine
    container_name: aerial-vector
    restart: unless-stopped
    stop_grace_period: 15s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
      homepage.group: "Observability"
      homepage.name: "Vector Agent"
      homepage.icon: "vector.png"
      homepage.description: "High-Performance Observability Router"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - aerial-vector-data:/var/lib/vector
      - ${AERIAL_HOST_PROJECT_DIR:-${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}}/vector/vector.yaml:/etc/vector/vector.yaml:ro
    ports:
      - "${VECTOR_API_PORT:-8686}:8686"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8686/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      quickwit:
        condition: service_healthy

networks:
  aerial-net:
    name: aerial-net
    driver: bridge

volumes:
  aerial-brain-data:
    name: aerial-brain-data
  aerial-brain-gemini:
    name: aerial-brain-gemini
  aerial-ollama-data:
    name: aerial-ollama-data
  aerial-agentsview-data:
    name: aerial-agentsview-data
  aerial-postgres-data:
    name: aerial-postgres-data
  aerial-victoriametrics-data:
    name: aerial-victoriametrics-data
  aerial-quickwit-data:
    name: aerial-quickwit-data
  aerial-vector-data:
    name: aerial-vector-data



