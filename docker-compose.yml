# ----------------------------------------------------------------------------
# Optional External Configuration Overrides (Decoupled from Monorepo)
# Evaluated natively on the host when executing docker compose
# ----------------------------------------------------------------------------
include:
  - path: "${AERIAL_CONFIG_DIR:-../aerial-config}/docker-compose.override.yml"

services:
  # ----------------------------------------------------------------------------
  # 0. Persistence Layer: PostgreSQL with pgvector
  #    Persistent relational storage, CAS task queues, and vector memory.
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aerial-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aerial}
      - POSTGRES_USER=${POSTGRES_USER:-aerial}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aerial_secure_pass}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - aerial-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aerial} -d $${POSTGRES_DB:-aerial} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 1. Execution Brain: Aerial Brain
  #    Runs headless Antigravity CLI agent prompts with PostgreSQL & pgvector memory,
  #    built-in Discord Gateway funnel with continuous typing indicator refresh,
  #    and connects to remote MCP network servers.
  # ----------------------------------------------------------------------------
  brain:
    image: ghcr.io/azylman/aerial-brain:latest
    build:
      context: .
      dockerfile: brain/Dockerfile
    container_name: aerial-brain
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD:-aerial_secure_pass}@postgres:5432/${POSTGRES_DB:-aerial}?sslmode=disable}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGY_MODEL=${AGY_MODEL:-Gemini 3.6 Flash (Low)}
      - TIMEOUT_MINUTES=${TIMEOUT_MINUTES:-15}
      - GITHUB_PAT=${GITHUB_PAT}
      - HA_TOKEN=${HA_TOKEN}
      - AERIAL_CONFIG_REPO_URL=${AERIAL_CONFIG_REPO_URL}
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - GIT_TERMINAL_PROMPT=0
    shm_size: '512mb'
    volumes:
      - aerial-brain-data:/data
      - aerial-brain-gemini:/root/.gemini
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}:/share/aerial-config:ro
      - ${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}:/share/aerial:ro
    ports:
      - "${AERIAL_BRAIN_HOST_PORT:-8088}:8080"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      gitsync:
        condition: service_healthy
      scheduler-mcp:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 1b. GitSync Sidecar: Aerial GitSync
  #     Performs automated, single-flight Git synchronization for live repositories
  #     and exposes on-demand sync webhook. Holds write volume mounts to prevent
  #     unpushed commits from ever touching the execution brain.
  # ----------------------------------------------------------------------------
  gitsync:
    image: ghcr.io/azylman/aerial-gitsync:latest
    build:
      context: .
      dockerfile: sidecars/gitsync/Dockerfile
    container_name: aerial-gitsync
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=8080
      - GITHUB_PAT=${GITHUB_PAT}
      - AERIAL_CONFIG_REPO_URL=${AERIAL_CONFIG_REPO_URL}
      - SYNC_INTERVAL=60s
      - SYNC_REPOS=/share/aerial-config,/share/aerial
    volumes:
      - ${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}:/share/aerial-config:rw
      - ${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}:/share/aerial:rw
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. Automated Updates: Watchtower
  #    Automatically monitors GHCR container images and performs rolling restarts.
  # ----------------------------------------------------------------------------
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: aerial-watchtower
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_SELF=false
      - WATCHTOWER_ROLLING_RESTART=false
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.45
    networks:
      - aerial-net

  # ----------------------------------------------------------------------------
  # 3. Container Auto-Healing: Autoheal
  #    Monitors Docker healthchecks and restarts unhealthy containers automatically.
  # ----------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: aerial-autoheal
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
      - DOCKER_API_VERSION=1.45
    networks:
      - aerial-net

  # ----------------------------------------------------------------------------
  # 4. Outbound MCP: Scheduler MCP Server
  #    Provides persistent schedule registration & management tools over HTTP.
  # ----------------------------------------------------------------------------
  scheduler-mcp:
    image: ghcr.io/azylman/aerial-scheduler-mcp:latest
    build: ./scheduler-mcp
    container_name: aerial-scheduler-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD:-aerial_secure_pass}@postgres:5432/${POSTGRES_DB:-aerial}?sslmode=disable}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. Outbound MCP: Discord MCP Server
  #    Provides Discord tools (send message, create thread, read history) over HTTP.
  # ----------------------------------------------------------------------------
  discord-mcp:
    image: ghcr.io/azylman/aerial-discord-mcp:latest
    build: ./discord-mcp
    container_name: aerial-discord-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=4001
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    ports:
      - "${DISCORD_MCP_HOST_PORT:-4001}:4001"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 6. Outbound MCP: Docker Host MCP Server
  #    Wraps the official mcp/docker image with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  docker-mcp:
    image: ghcr.io/azylman/aerial-docker-mcp:latest
    build: ./docker-mcp
    container_name: aerial-docker-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=4002
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DOCKER_MCP_HOST_PORT:-4002}:4002"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 7. Outbound MCP: GitHub MCP Server
  #    Wraps the official GitHub MCP server with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  github-mcp:
    image: ghcr.io/azylman/aerial-github-mcp:latest
    build: ./github-mcp
    container_name: aerial-github-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=4003
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${GITHUB_MCP_HOST_PORT:-4003}:4003"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4003 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 8. Local LLM / Embeddings: Ollama Service
  #    Provides local AI models & embedding generations with persistent storage.
  # ----------------------------------------------------------------------------
  ollama:
    image: ghcr.io/azylman/aerial-ollama:latest
    build: ./docker/ollama
    container_name: aerial-ollama
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - aerial-ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 180s

  # ----------------------------------------------------------------------------
  # 9. Observability & Visualization: Agentsview Web Dashboard
  #    Local-first web UI for searching, analyzing, and visually inspecting
  #    Antigravity agent transcripts and session traces.
  # ----------------------------------------------------------------------------
  agentsview:
    image: ghcr.io/azylman/agentsview:latest
    container_name: aerial-agentsview
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - AGENTSVIEW_DATA_DIR=/agentsview-data
    command:
      - "--host=0.0.0.0"
      - "--base-path=/conversations"
      - "--public-origin=${AGENTSVIEW_PUBLIC_ORIGINS:-http://192.168.1.14:8089,http://192.168.1.14,https://aerial.zylman.com,http://aerial.zylman.com}"
      - "--public-url=${AGENTSVIEW_PUBLIC_URL:-https://aerial.zylman.com}"
    volumes:
      - aerial-agentsview-data:/agentsview-data
      - aerial-brain-data:/data:ro
      - aerial-brain-gemini:/root/.gemini:ro
    networks:
      - aerial-net

  # ----------------------------------------------------------------------------
  # 10. Core Status Dashboard: Aerial Status Microservice
  #     Monitors Docker container health and serves Cyberpunk status HUD.
  # ----------------------------------------------------------------------------
  dashboard:
    image: ghcr.io/azylman/aerial-dashboard:latest
    build: ./dashboard
    container_name: aerial-dashboard
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=8080
      - BRAIN_URL=http://brain:8080
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_REPO=${GITHUB_REPO:-azylman/aerial}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 11. Documentation Engine: Aerial Docs v1.0.0 (Docsify + Mermaid.js)
  #     Renders user markdown documentation and Mermaid diagrams from config repo.
  # ----------------------------------------------------------------------------
  docs:
    image: ghcr.io/azylman/aerial-docs:latest
    build: ./docs-service
    container_name: aerial-docs
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ${AERIAL_CONFIG_DIR:-/mnt/data/supervisor/share/aerial-config}:/share/aerial-config:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 12. Edge Reverse Proxy Gateway: Aerial Proxy Gateway
  #     Routes traffic for / (status dashboard), /docs (docsify), and /conversations (agentsview).
  # ----------------------------------------------------------------------------
  proxy:
    image: ghcr.io/azylman/aerial-proxy:latest
    build: ./proxy
    container_name: aerial-proxy
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${AGENTSVIEW_HOST_PORT:-8089}:80"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      dashboard:
        condition: service_healthy
      docs:
        condition: service_healthy
      agentsview:
        condition: service_started
      grafana:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 13. Observability: cAdvisor Container Metrics Collector
  #     Gathers per-container CPU, memory, network, and disk telemetry.
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aerial-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=percpu,sched,tcp,udp,advtcp,process"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 14. Observability: Node Exporter Host Telemetry
  #     Gathers host CPU loads, memory, storage, thermals, and network metrics.
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: aerial-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 15. Observability: VictoriaMetrics Single-Node TSDB
  #     Lightweight time-series database with long-term retention & downsampling.
  # ----------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0-enterprise
    container_name: aerial-victoriametrics
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-promscrape.configCheckInterval=15s"
      - "-retentionPeriod=${VICTORIAMETRICS_RETENTION_PERIOD:-5y}"
      - "-downsampling.period=${VICTORIAMETRICS_DOWNSAMPLING_PERIOD:-30d:5m,180d:1h}"
    volumes:
      - aerial-victoriametrics-data:/victoria-metrics-data
      - ${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      cadvisor:
        condition: service_healthy
      node-exporter:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 16. Observability: Grafana Visual Dashboards
  #     Serves system HUD & container metrics with PostgreSQL persistent backend.
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: aerial-grafana
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=${POSTGRES_DB:-aerial}
      - GF_DATABASE_USER=${POSTGRES_USER:-aerial}
      - GF_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-aerial_secure_pass}
      - GF_DATABASE_SSL_MODE=disable
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-aerial_metrics_pass}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - ${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy

networks:
  aerial-net:
    name: aerial-net
    driver: bridge

volumes:
  aerial-brain-data:
    name: aerial-brain-data
  aerial-brain-gemini:
    name: aerial-brain-gemini
  aerial-ollama-data:
    name: aerial-ollama-data
  aerial-agentsview-data:
    name: aerial-agentsview-data
  aerial-postgres-data:
    name: aerial-postgres-data
  aerial-victoriametrics-data:
    name: aerial-victoriametrics-data



