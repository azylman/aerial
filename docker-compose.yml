services:
  # ----------------------------------------------------------------------------
  # 1. Execution Brain: Aerial Brain
  #    Runs headless Antigravity CLI agent prompts with multi-turn SQLite memory,
  #    built-in Discord Gateway funnel with continuous typing indicator refresh,
  #    and connects to remote MCP network servers.
  # ----------------------------------------------------------------------------
  brain:
    image: ghcr.io/azylman/aerial-brain:latest
    build:
      context: .
      dockerfile: brain/Dockerfile
    container_name: aerial-brain
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGY_MODEL=${AGY_MODEL:-Gemini 3.6 Flash (Low)}
      - TIMEOUT_MINUTES=${TIMEOUT_MINUTES:-15}
      - GITHUB_PAT=${GITHUB_PAT}
      - HA_TOKEN=${HA_TOKEN}
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
    volumes:
      - aerial-brain-data:/data
      - aerial-brain-gemini:/root/.gemini
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AERIAL_PROJECT_DIR:-/mnt/data/supervisor/share/aerial}:/share/aerial
    ports:
      - "${AERIAL_BRAIN_HOST_PORT:-8088}:8080"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      scheduler-mcp:
        condition: service_healthy
      discord-mcp:
        condition: service_healthy
      docker-mcp:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Automated Updates: Watchtower
  #    Automatically monitors GHCR container images and performs rolling restarts.
  # ----------------------------------------------------------------------------
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: aerial-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_SELF=false
      - WATCHTOWER_ROLLING_RESTART=false
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.45
    networks:
      - aerial-net

  # ----------------------------------------------------------------------------
  # 3. Container Auto-Healing: Autoheal
  #    Monitors Docker healthchecks and restarts unhealthy containers automatically.
  # ----------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: aerial-autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
      - DOCKER_API_VERSION=1.45
    networks:
      - aerial-net

  # ----------------------------------------------------------------------------
  # 4. Outbound MCP: Scheduler MCP Server
  #    Provides persistent schedule registration & management tools over HTTP.
  # ----------------------------------------------------------------------------
  scheduler-mcp:
    image: ghcr.io/azylman/aerial-scheduler-mcp:latest
    build: ./scheduler-mcp
    container_name: aerial-scheduler-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-America/Los_Angeles}
      - TZ=${DEFAULT_TIMEZONE:-America/Los_Angeles}
    volumes:
      - aerial-brain-data:/data
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 5. Outbound MCP: Discord MCP Server
  #    Provides Discord tools (send message, create thread, read history) over HTTP.
  # ----------------------------------------------------------------------------
  discord-mcp:
    image: ghcr.io/azylman/aerial-discord-mcp:latest
    build: ./discord-mcp
    container_name: aerial-discord-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=4001
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    ports:
      - "${DISCORD_MCP_HOST_PORT:-4001}:4001"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 6. Outbound MCP: Docker Host MCP Server
  #    Wraps the official mcp/docker image with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  docker-mcp:
    image: ghcr.io/azylman/aerial-docker-mcp:latest
    build: ./docker-mcp
    container_name: aerial-docker-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=4002
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DOCKER_MCP_HOST_PORT:-4002}:4002"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 7. Outbound MCP: GitHub MCP Server
  #    Wraps the official GitHub MCP server with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  github-mcp:
    image: ghcr.io/azylman/aerial-github-mcp:latest
    build: ./github-mcp
    container_name: aerial-github-mcp
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      - PORT=4003
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${GITHUB_MCP_HOST_PORT:-4003}:4003"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4003 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 8. Local LLM / Embeddings: Ollama Service
  #    Provides local AI models & embedding generations with persistent storage.
  # ----------------------------------------------------------------------------
  ollama:
    image: ghcr.io/azylman/aerial-ollama:latest
    build: ./docker/ollama
    container_name: aerial-ollama
    restart: unless-stopped
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - aerial-ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 180s

  # ----------------------------------------------------------------------------
  # 9. Observability & Visualization: Agentsview Web Dashboard
  #    Local-first web UI for searching, analyzing, and visually inspecting
  #    Antigravity agent transcripts and session traces.
  # ----------------------------------------------------------------------------
  agentsview:
    image: ghcr.io/kenn-io/agentsview:latest
    container_name: aerial-agentsview
    restart: unless-stopped
    command:
      - "--host=0.0.0.0"
      - "--public-origin=${AGENTSVIEW_PUBLIC_ORIGINS:-http://192.168.1.14:8089,http://192.168.1.14,https://aerial.zylman.com,http://aerial.zylman.com}"
      - "--public-url=${AGENTSVIEW_PUBLIC_URL:-https://aerial.zylman.com}"
    ports:
      - "${AGENTSVIEW_HOST_PORT:-8089}:8080"
    volumes:
      - aerial-agentsview-data:/data
      - aerial-brain-gemini:/root/.gemini:ro
    networks:
      - aerial-net

networks:
  aerial-net:
    name: aerial-net
    driver: bridge

volumes:
  aerial-brain-data:
    name: aerial-brain-data
  aerial-brain-gemini:
    name: aerial-brain-gemini
  aerial-ollama-data:
    name: aerial-ollama-data
  aerial-agentsview-data:
    name: aerial-agentsview-data


