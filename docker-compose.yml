services:
  # ----------------------------------------------------------------------------
  # 1. Shared Repository Volume Bootstrap: nomad-init
  #    Seeds /share/aerial in the aerial-share named volume on cold start if
  #    nomad.hcl is not yet present on disk.
  # ----------------------------------------------------------------------------
  nomad-init:
    image: alpine/git:2.47.2
    container_name: aerial-nomad-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /share/aerial/nomad/nomad.hcl ]; then
          rm -rf /share/aerial
          git clone --depth 50 -b main https://github.com/azylman/aerial.git /share/aerial
        fi
    volumes:
      - aerial-share:/share

  # ----------------------------------------------------------------------------
  # 2. Cluster Orchestrator & Local Worker: HashiCorp Nomad
  #    Dedicated single-node control plane and local HAOS client node.
  # ----------------------------------------------------------------------------
  nomad-server:
    image: hashicorp/nomad:2.0.7
    container_name: aerial-nomad-server
    restart: unless-stopped
    network_mode: host
    privileged: true
    depends_on:
      nomad-init:
        condition: service_completed_successfully
    environment:
      - NOMAD_SKIP_DOCKER_IMAGE_WARN=1
    command: ["agent", "-config=/share/aerial/nomad"]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/data/nomad/client:/mnt/data/nomad/client
      - aerial-nomad-server-data:/nomad/data
      - aerial-share:/share:ro
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "nomad server members && nomad node status -self || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

networks:
  aerial-net:
    name: aerial-net
    driver: bridge

volumes:
  aerial-share:
    name: aerial-share
  aerial-brain-data:
    name: aerial-brain-data
  aerial-brain-gemini:
    name: aerial-brain-gemini
  aerial-ollama-data:
    name: aerial-ollama-data
  aerial-agentsview-data:
    name: aerial-agentsview-data
  aerial-postgres-data:
    name: aerial-postgres-data
  aerial-postgres-18-data:
    name: aerial-postgres-18-data
  aerial-victoriametrics-data:
    name: aerial-victoriametrics-data
  aerial-openobserve-data:
    name: aerial-openobserve-data
  aerial-vector-data:
    name: aerial-vector-data
  aerial-nomad-server-data:
    name: aerial-nomad-server-data
