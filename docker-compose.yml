services:
  # ----------------------------------------------------------------------------
  # 1. Inbound Event Gateway: Discord Funnel
  #    Connects to Discord Gateway and forwards qualifying mentions/threads
  #    to Aerial Brain.
  # ----------------------------------------------------------------------------
  discord-funnel:
    build: ./discord-funnel
    container_name: aerial-discord-funnel
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - TARGET_URL=http://brain:8080/api/prompt
      - HEALTH_PORT=8085
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      brain:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Execution Brain: Aerial Brain
  #    Runs headless Antigravity CLI agent prompts with multi-turn SQLite memory
  #    and connects to remote MCP network servers.
  # ----------------------------------------------------------------------------
  brain:
    build: ./brain
    container_name: aerial-brain
    restart: unless-stopped
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGY_MODEL=${AGY_MODEL:-Gemini 3.6 Flash (Low)}
      - TIMEOUT_MINUTES=${TIMEOUT_MINUTES:-15}
      - GITHUB_PAT=${GITHUB_PAT}
      - HA_TOKEN=${HA_TOKEN}
    volumes:
      - aerial-brain-data:/data
      - aerial-brain-gemini:/root/.gemini
    ports:
      - "${AERIAL_BRAIN_HOST_PORT:-8088}:8080"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      discord-mcp:
        condition: service_healthy
      docker-mcp:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Outbound MCP: Discord MCP Server
  #    Provides Discord tools (send message, create thread, read history) over HTTP.
  # ----------------------------------------------------------------------------
  discord-mcp:
    build: ./discord-mcp
    container_name: aerial-discord-mcp
    restart: unless-stopped
    environment:
      - PORT=4001
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    ports:
      - "${DISCORD_MCP_HOST_PORT:-4001}:4001"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. Outbound MCP: Docker Host MCP Server
  #    Wraps the official mcp/docker image with supergateway translation proxy.
  # ----------------------------------------------------------------------------
  docker-mcp:
    build: ./docker-mcp
    container_name: aerial-docker-mcp
    restart: unless-stopped
    environment:
      - PORT=4002
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DOCKER_MCP_HOST_PORT:-4002}:4002"
    networks:
      - aerial-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4002 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 5. Observability & Visualization: Agentsview Web Dashboard
  #    Local-first web UI for searching, analyzing, and visually inspecting
  #    Antigravity agent transcripts and session traces.
  # ----------------------------------------------------------------------------
  agentsview:
    image: ghcr.io/kenn-io/agentsview:latest
    container_name: aerial-agentsview
    restart: unless-stopped
    ports:
      - "${AGENTSVIEW_HOST_PORT:-8089}:8080"
    volumes:
      - aerial-agentsview-data:/data
      - aerial-brain-gemini:/root/.gemini:ro
    networks:
      - aerial-net

networks:
  aerial-net:
    name: aerial-net
    driver: bridge

volumes:
  aerial-brain-data:
    name: aerial-brain-data
  aerial-brain-gemini:
    name: aerial-brain-gemini
  aerial-agentsview-data:
    name: aerial-agentsview-data
