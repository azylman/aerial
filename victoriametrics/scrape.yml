global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_config_files:
  - "/share/aerial-config/victoriametrics/*.yml"
  - "/share/aerial-config/victoriametrics/*.yaml"

scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "victoriametrics"
    static_configs:
      - targets: ["localhost:8428"]

  - job_name: "aerial-brain"
    static_configs:
      - targets: ["brain:8080"]

  - job_name: "aerial-gitsync"
    static_configs:
      - targets: ["gitsync:8080"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
