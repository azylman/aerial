global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_config_files:
  - "/share/aerial-config/victoriametrics/*.yml"
  - "/share/aerial-config/victoriametrics/*.yaml"

scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets: ["127.0.0.1:8083"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "victoriametrics"
    static_configs:
      - targets: ["127.0.0.1:8428"]

  - job_name: "aerial-brain"
    static_configs:
      - targets: ["127.0.0.1:8088"]

  - job_name: "aerial-hangar"
    static_configs:
      - targets: ["127.0.0.1:8087"]

  - job_name: "postgres"
    static_configs:
      - targets: ["127.0.0.1:9187"]
