# ==============================================================================
# Aerial Configuration (config.yaml)
# ==============================================================================

# LLM Model Name used by Antigravity CLI (e.g. gemini-2.5-flash, gemini-2.5-pro)
model: gemini-2.5-flash

# Timeout per conversational turn in minutes
timeout_minutes: 15

# Timezone for scheduled cron routines and timestamp rendering
timezone: America/Los_Angeles

# Discord system channel name or snowflake ID for startup and error alerts
system_channel: aerial-dev

# ------------------------------------------------------------------------------
# Administrator Allowlist
# ------------------------------------------------------------------------------
# List of Discord user Snowflake IDs who are authorized to perform system-level
# changes (modifying SYSTEM.md, AGENTS.md, config.yaml, Docker containers, crons).
# Messages from these users are tagged with is_admin: true.
admin_users:
  - 1542035925603713086 # Primary Admin
  # - 987654321098765432 # Secondary Admin

# ------------------------------------------------------------------------------
# Channel Policies
# ------------------------------------------------------------------------------
# Configure interaction mode and behavior per Discord channel.
# Lookup order: Channel Snowflake ID -> Channel Name (without '#') -> default.
#
# Available Modes:
#   - threads: Non-thread messages spawn/route to a Discord thread (default).
#   - channel: Messages are evaluated directly in-channel without threads using a Two-Tier Wake model:
#       * Tier 1 (Direct Wake): Mentions (@Aerial), replies to Aerial, and keywords wake immediately.
#       * Tier 2 (Ambient Relevance Scorer): Unaddressed messages are scored (0.0 - 1.0) with recent context.
#       * Lookback Logging: Ambient messages below threshold are silently recorded in the session transcript
#         so Aerial has full conversational lookback when woken.
#   - ignore (or disabled): Channel is completely ignored by Aerial.
#
# Available Typing Indicator Options:
#   - always: Send typing indicator on every evaluated turn (default for threads).
#   - on_mention: Only send typing indicator when the bot is mentioned/replied to (default for channel).
#   - never: Never send typing indicator.
#
# Ambient Wake & Classification (for mode: channel):
#   - ambient_wake_threshold: Confidence score threshold (0.0 to 1.0) for ambient messages to wake Aerial (default: 0.80).
#   - ambient_wake_prompt: Custom criteria/prompt directive for the ambient relevance classifier in this channel.
#   - ignore_bots: Ignore messages from bot users (default: true). Set to false to allow peer bot interactions.
#
# Session Rotation:
#   - max_session_turns: Number of turns before rotating internal conversation ID (default: 50).
#
# Whitelisting / Default-Deny:
#   You can set default.mode: ignore to have Aerial ignore all channels in the
#   server by default, and only respond in explicitly declared channels.
#
# Per-Channel Instructions (Convention Auto-Discovery):
#   To customize Aerial's instructions or persona for a specific channel, place a
#   Markdown file at channels/<channel-name>.md in your config repository (e.g.
#   channels/general.md or channels/dev-alerts.md). Aerial automatically auto-discovers
#   these files by convention (no path needed in config.yaml). For conversations in
#   Discord threads, instructions from the parent channel are automatically inherited.
channels:
  # The 'default' block is REQUIRED and acts as the fallback for all channels.
  default:
    mode: threads
    typing_indicator: always
    ignore_bots: true
    ambient_wake_threshold: 0.80

  # Example channel-specific override for in-channel direct & ambient interaction:
  general:
    mode: channel
    typing_indicator: on_mention
    ignore_bots: true
    ambient_wake_threshold: 0.80
    ambient_wake_prompt: "Determine whether the target message is relevant to Aerial and warrants Aerial waking up and responding, based on the recent channel context."
    max_session_turns: 50

  # Example channel with custom wake prompt:
  dev-alerts:
    mode: channel
    typing_indicator: on_mention
    ignore_bots: false # Allow alerts from bot integrations
    ambient_wake_threshold: 0.70
    ambient_wake_prompt: "Only wake up and respond if the user is asking about Kubernetes deployments, CI/CD pipeline failures, or production outages."

  # Example channel-specific override to completely ignore a channel:
  memes:
    mode: ignore

# ------------------------------------------------------------------------------
# GitSync Configuration
# ------------------------------------------------------------------------------
git_sync:
  enabled: true
  interval: 1m
  config_repo_url: https://github.com/your-username/aerial-config
  repositories:
    - /share/aerial-config
    - /share/aerial

# ------------------------------------------------------------------------------
# Semantic Memory & Fact Extraction
# ------------------------------------------------------------------------------
memory:
  fact_extraction:
    enabled: true
    interval: 6h

# ------------------------------------------------------------------------------
# Custom MCP Servers
# ------------------------------------------------------------------------------
# Additional MCP servers to merge into ~/.gemini/config/mcp_config.json
mcp_servers: {}
