# ==============================================================================
# Aerial Configuration (config.yaml)
# ==============================================================================

# LLM Model Name used by Antigravity CLI (e.g. gemini-2.5-flash, gemini-2.5-pro)
model: gemini-2.5-flash

# Timezone for scheduled cron routines and timestamp rendering
timezone: America/Los_Angeles

# Discord system channel name or snowflake ID for startup and error alerts
system_channel: aerial-dev

# Optional Local/Edge Classifier Endpoint (Ollama)
# When specified, ambient triage calls route to this Ollama instance.
# If omitted or empty, ambient triage uses cloud low_effort_model via Agy.
# classifier_url: http://192.168.1.70:11434
# classifier_model: qwen2.5:3b # Defaults to qwen2.5:3b if classifier_url is set but model is omitted

# Optional Local/Edge Thread Title Summarization Endpoint (Ollama)
# When specified, thread titling calls route to this endpoint (runs in ~300ms locally).
# If omitted, falls back to classifier_url if set, else uses cloud low_effort_model.
# thread_title_url: http://192.168.1.70:11434
# thread_title_model: qwen2.5:3b # Defaults to qwen2.5:3b if thread_title_url is set

# ------------------------------------------------------------------------------
# Administrator Allowlist
# ------------------------------------------------------------------------------
# List of Discord user Snowflake IDs who are authorized to perform system-level
# changes (modifying GEMINI.md, AGENTS.md, config.yaml, Docker containers, crons).
# Messages from these users are tagged with is_admin: true.
admin_users:
  - 123456789012345678 # Primary Admin
  # - 987654321098765432 # Secondary Admin

# ------------------------------------------------------------------------------
# Channel Policies
# ------------------------------------------------------------------------------
# Configure interaction mode and behavior per Discord channel.
# Lookup order: Channel Snowflake ID -> Channel Name (without '#') -> default.
#
# Available Modes:
#   - threads: Non-thread messages spawn/route to a Discord thread (default).
#   - channel: Messages are evaluated directly in-channel without threads.
#   - ignore (or disabled): Channel is completely ignored by Aerial.
#
# Available Wake Modes (for interaction sensitivity):
#   - mention (or mentions, direct): Only wake up when explicitly @mentioned (<@botID> / @Aerial)
#     or directly replied to. Bare plaintext keywords ("aerial", "gundam") and LLM classifier are bypassed.
#     Ambient channel chatter is silently recorded in the session transcript for full conversational lookback.
#   - classifier (or ambient): Direct mentions, replies, keywords, AND ambient relevance scoring (default for mode: channel).
#   - all (or always): Respond to every message (default for mode: threads inside a thread).
#
# Ambient Wake & Classification (for wake_mode: classifier):
#   - ambient_wake_threshold: Confidence score threshold (0.0 to 1.0) for ambient messages to wake Aerial (default: 0.80).
#   - ignore_bots: Ignore messages from bot users (default: true). Set to false to allow peer bot interactions.
#
# Whitelisting / Default-Deny:
#   You can set default.mode: ignore to have Aerial ignore all channels in the
#   server by default, and only respond in explicitly declared channels.
#
# Per-Channel Instructions (Convention Auto-Discovery):
#   To customize Aerial's instructions or persona for a specific channel, place a
#   Markdown file at channels/<channel-name>.md in your config repository (e.g.
#   channels/general.md or channels/dev-alerts.md). Aerial automatically auto-discovers
#   these files by convention (no path needed in config.yaml). For conversations in
#   Discord threads, instructions from the parent channel are automatically inherited.
channels:
  # The 'default' block is REQUIRED and acts as the fallback for all channels.
  default:
    mode: threads
    ignore_bots: true
    ambient_wake_threshold: 0.80

  # Example channel-specific override for in-channel direct & ambient interaction with classifier:
  general:
    mode: channel
    wake_mode: classifier
    ignore_bots: true
    ambient_wake_threshold: 0.80

  # Example channel with mention-only wake (listens ambiently, responds ONLY on explicit @mention or direct reply):
  lounge:
    mode: channel
    wake_mode: mention
    ignore_bots: false

  # Example channel with custom wake threshold:
  dev-alerts:
    mode: channel
    wake_mode: classifier
    ignore_bots: false # Allow alerts from bot integrations
    ambient_wake_threshold: 0.70

  # Example channel-specific override to completely ignore a channel:
  memes:
    mode: ignore

# ------------------------------------------------------------------------------
# Voice Interface Configuration
# ------------------------------------------------------------------------------
# Configures the voice process pool engine, model override, and pre-warmed sessions.
#
# Available Engines:
#   - agy: Uses the local Antigravity CLI daemon process pool (default).
#   - gemini_api: Direct Gemini Live/REST API calls with SSE streaming (~200ms latency).
#     Requires HARNESS_API_KEY or API_KEY to be set in environment or config.
#
voice:
  engine: agy # or gemini_api
  # model: gemini-2.5-flash # Optional model override for voice turns (defaults to low_effort_model)
  # prewarmed_targets:
  #   - kiosk
  #   - dock

# ------------------------------------------------------------------------------
# Custom MCP Servers
# ------------------------------------------------------------------------------
# Additional MCP servers to merge into target-partitioned mcp_config.json:
#   - common: Loaded across all targets (Discord, Voice, and sidecars).
#   - discord: Loaded only for primary Discord bot interactions.
#   - voice: Loaded for voice device interactions (e.g. Home Assistant ha-mcp).
#   - ephemeral: Loaded for transient lightweight turns.
#
mcp_servers:
  # common:
  #   ha-mcp:
  #     serverUrl: "http://homeassistant:8123/api/webhook/..."
  # voice:
  #   ha-mcp:
  #     serverUrl: "http://homeassistant:8123/api/webhook/..."


# ------------------------------------------------------------------------------
# Dashboard Configuration
# ------------------------------------------------------------------------------
# Configures CI and pipeline monitoring in the Aerial Command HUD (aerial-dashboard).
dashboard:
  # Repositories to monitor in the CI pipeline fanout.
  # When configured, the poller checks GitHub Actions runs across all declared repos.
  github_repos:
    - your-org/aerial
    # - your-org/aerial-sidecars
    # - your-org/aerial-config

