review_guidelines = """
Repository Scope: azylman/aerial (Aerial Core Engine Monorepo — Go 1.27 microservices, k3s/Flux CD Kubernetes manifests (k8s/*.yaml), and Docker images).
Repo-Specific Invariants (appended to global Aerial cluster guidelines in ~/.roborev/config.toml):
1. Zero Personal Data & Sensitive Identifiers: Never allow personal names, Discord handles, home addresses, or private entity IDs in this generic open-source engine repository.
2. Hermetic Storage & Runner Tests: Unit tests must never write to shared host paths (/data, /share) or execute live agy/shell subprocesses or raw POSIX signal broadcasts.
3. Restate Durable Workflows & Virtual Objects: All external I/O and non-determinism must execute inside restate.Run passing strictly the inner RunContext. Replayable code must never use unjournaled time/UUID/map-order or raw goroutines/channels/select. Exclusive handlers must never block across sleeps or backoffs. In Vanadis, failed is a recoverable pause state—never call restate.ClearAll on failed builds.
4. Canonical Go Service Layout (L0 -> L3): Root package main (services/<svc>, mcp/<srv>) is capped at 3 files (main.go, main_test.go, goleak_test.go) for bootstrap/wiring only; domain packages live under internal/* ordered strictly L0 (internal/config, internal/model — zero sibling internal/* or pgx imports) -> L1 (internal/store, outbound clients) -> L2 (internal/mcp, internal/tools, internal/service, internal/ticker) -> L3 (internal/server, internal/router). Horizontal grab-bag filenames (pure.go, helpers.go, utils.go, common.go, types.go, frozen.go, *_part[0-9]*_test.go) and func(...) fields inside []struct{...} test tables are prohibited.
"""
