agent = "gemini"
review_agent = "gemini"
review_reasoning = "thorough"
default_branch = "main"

exclude_patterns = [
  "*.sum",
  "*.lock",
  "package-lock.json",
  "brain/pkg/db/migrations/*.sql"
]

review_guidelines = """
Repository Scope: azylman/aerial (Aerial Core Engine Monorepo — Go 1.27 microservices, HashiCorp Nomad job specifications, and Docker images).
Repo-Specific Invariants (appended to global Aerial cluster guidelines in ~/.roborev/config.toml):
1. Zero Personal Data & Sensitive Identifiers: Never allow personal names, Discord handles, home addresses, or private entity IDs in this generic open-source engine repository.
2. Hermetic Storage & Runner Tests: Unit tests must never write to shared host paths (/data, /share) or execute live agy/shell subprocesses or raw POSIX signal broadcasts.
"""

[ci]
agents = ["gemini"]
review_types = ["default"]
reasoning = "thorough"
min_severity = "medium"
upsert_comments = true
