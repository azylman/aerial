apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: gateway-api
  namespace: flux-system
spec:
  ignore: |
    /*
    !/config/crd/
  interval: 24h
  ref:
    tag: v1.7.0
  url: https://github.com/kubernetes-sigs/gateway-api.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: gateway-api-crds
  namespace: flux-system
spec:
  force: false
  interval: 1h
  path: ./config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
  timeout: 2m
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: cnpg-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: cnpg
  namespace: cnpg-system
spec:
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      version: 0.29.1
  install:
    crds: CreateReplace
  interval: 30m
  upgrade:
    crds: CreateReplace
  values:
    # The control-plane node runs CI next to the API server; under load,
    # lease renewals miss the 10s default deadline and the operator restarts,
    # taking its admission webhook down mid-reconcile.
    additionalArgs:
      - --leader-lease-duration=60
      - --leader-renew-deadline=40
---
