apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ngf-snippets-rbac
rules:
  - apiGroups:
      - gateway.nginx.org
    resources:
      - snippetsfilters
      - snippetspolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.nginx.org
    resources:
      - snippetsfilters/status
      - snippetspolicies/status
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ngf-snippets-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ngf-snippets-rbac
subjects:
  - kind: ServiceAccount
    name: ngf-nginx-gateway-fabric
    namespace: nginx-gateway
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: ngf-proxy-config
  namespace: default
spec:
  telemetry:
    exporter:
      endpoint: victoriatraces.default.svc.cluster.local:4317
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: edge-gateway-proxy-config
  namespace: default
spec:
  kubernetes:
    service:
      type: ClusterIP
  telemetry:
    exporter:
      endpoint: victoriatraces.default.svc.cluster.local:4317
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: edge-gateway-proxy-config
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http-edge
      port: 4021
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aerial-lan-http-redirect-route
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-gateway
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /console/
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /console
    - filters:
        - requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /console/
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /dashboard
    - filters:
        - requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /grafana
    - filters:
        - requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /agentsview/
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /agentsview
    - filters:
        - requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /docs/
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /docs
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aerial-lan-http-route
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-gateway
      sectionName: http
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: console
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /console/
    - backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /grafana/
    - backendRefs:
        - group: ""
          kind: Service
          name: agentsview
          port: 8080
          weight: 1
      filters:
        - urlRewrite:
            hostname: localhost
          type: URLRewrite
      matches:
        - path:
            type: PathPrefix
            value: /agentsview/
    - backendRefs:
        - group: ""
          kind: Service
          name: agentsview
          port: 8080
          weight: 1
      filters:
        - urlRewrite:
            hostname: localhost
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /agentsview/assets/
          type: URLRewrite
      matches:
        - path:
            type: PathPrefix
            value: /assets/
    - backendRefs:
        - group: ""
          kind: Service
          name: docs
          port: 8080
          weight: 1
      filters:
        - urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
          type: URLRewrite
      matches:
        - path:
            type: PathPrefix
            value: /docs/
    - backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.nginx.org/v1alpha2
kind: ObservabilityPolicy
metadata:
  name: gateway-tracing
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aerial-lan-http-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aerial-lan-http-redirect-route
  tracing:
    context: propagate
    ratio: 100
    strategy: ratio
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-gateway-netpol
  namespace: default
spec:
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - synapse
                  - docs
                  - eri
                  - kernel-browser
                  - homepage
                  - console
                  - agentsview
                  - grafana
                  - aura-farming
                  - vision
                  - gatus
    - ports:
        - port: 4317
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoriatraces
    - ports:
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 4021
          protocol: TCP
    - ports:
        - port: 8081
          protocol: TCP
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: edge-gateway
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-netpol
  namespace: default
spec:
  egress:
    - ports:
        - port: 4021
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: edge-gateway
    - ports:
        - port: 443
          protocol: TCP
        - port: 7844
          protocol: UDP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
    - Egress
