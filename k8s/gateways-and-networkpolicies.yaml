apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-gateway-netpol
  namespace: default
spec:
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - synapse
                  - docs
                  - eri
                  - kernel-browser
    - ports:
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - port: 4021
          protocol: TCP
    - ports:
        - port: 8081
          protocol: TCP
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: edge-gateway
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-netpol
  namespace: default
spec:
  egress:
    - ports:
        - port: 4021
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: edge-gateway
    - ports:
        - port: 443
          protocol: TCP
        - port: 7844
          protocol: UDP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
    - Egress
---
