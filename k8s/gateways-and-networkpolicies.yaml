apiVersion: gateway.nginx.org/v1alpha1
kind: NginxProxy
metadata:
  name: ngf-proxy-config
  namespace: default
spec:
  telemetry:
    exporter:
      endpoint: "http://openobserve.default.svc.cluster.local:5080"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: zylman-wildcard-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
    - name: http-edge
      protocol: HTTP
      port: 4021
---
# HTTP :80 aerial.lan -> 301 https://aerial.zylman.com
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lan-redirect-route
  namespace: default
spec:
  parentRefs:
    - name: lan-gateway
      sectionName: http
  hostnames:
    - "aerial.lan"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: "aerial.zylman.com"
            statusCode: 301
---
# lan-gateway serves ONLY 8 Homepage web UIs + home-assistant + kernel-browser
apiVersion: gateway.networking.k8s.io/v1
