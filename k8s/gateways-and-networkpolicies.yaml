apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ngf-snippets-rbac
rules:
  - apiGroups:
      - gateway.nginx.org
    resources:
      - snippetsfilters
      - snippetspolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.nginx.org
    resources:
      - snippetsfilters/status
      - snippetspolicies/status
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ngf-snippets-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ngf-snippets-rbac
subjects:
  - kind: ServiceAccount
    name: ngf-nginx-gateway-fabric
    namespace: nginx-gateway
---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: gatus-status-subfilter
  namespace: default
spec:
  snippets:
    - context: http.server.location
      value: |
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/css application/javascript text/javascript application/json application/manifest+json;
        sub_filter_once off;
        sub_filter 'src="/js/' 'src="/status/js/';
        sub_filter 'href="/css/' 'href="/status/css/';
        sub_filter 'href="/manifest.json"' 'href="/status/manifest.json"';
        sub_filter 'href="/favicon' 'href="/status/favicon';
        sub_filter 'href="/apple-touch-icon' 'href="/status/apple-touch-icon';
        sub_filter 's.p="/"' 's.p="/status/"';
        sub_filter 'history:(0,i.PO)("/")' 'history:(0,i.PO)("/status/")';
        sub_filter 'serverUrl:{type:String,default:".."}' 'serverUrl:{type:String,default:"/status"}';
        sub_filter 'endpoint:"/api/v1/' 'endpoint:"/status/api/v1/';
        sub_filter '"/api/v1/' '"/status/api/v1/';
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: ngf-proxy-config
  namespace: default
spec:
  telemetry:
    exporter:
      endpoint: openobserve.default.svc.cluster.local:5080
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: edge-gateway-proxy-config
  namespace: default
spec:
  kubernetes:
    service:
      type: ClusterIP
  telemetry:
    exporter:
      endpoint: openobserve.default.svc.cluster.local:5080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http
      port: 80
      protocol: HTTP
    - allowedRoutes:
        namespaces:
          from: Same
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: zylman-wildcard-tls
        mode: Terminate
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: edge-gateway-proxy-config
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http-edge
      port: 4021
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lan-redirect-route
  namespace: default
