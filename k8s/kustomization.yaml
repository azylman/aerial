apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces-and-coredns.yaml
  - operators-and-storage.yaml
  - gateways-and-networkpolicies.yaml
  - core-services.yaml
  - observability-and-mcp.yaml

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

configMapGenerator:
  - name: homepage-core-scripts
    namespace: default
    files:
      - ../services/homepage/entrypoint.sh
      - ../services/homepage/prepare-config.js
      - ../services/homepage/lib/merge.js
  - name: homepage-core-config
    namespace: default
    files:
      - ../services/homepage/config/bookmarks.yaml
      - ../services/homepage/config/docker.yaml
      - ../services/homepage/config/services.yaml
      - ../services/homepage/config/settings.yaml
      - ../services/homepage/config/widgets.yaml
      - ../services/homepage/config/custom.css
      - ../services/homepage/config/custom.js
      - ../web/theme/aerial-tokens.css
      - ../web/theme/aerial-theme.js

