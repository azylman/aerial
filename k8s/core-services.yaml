apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: eri
  name: eri
  namespace: default
spec:
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eri
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eri
    spec:
      containers:
        - env:
            - name: PORT
              value: "8080"
            - name: GEMINI_HOME_DIR
              value: /data
            - name: DATA_DIR
              value: /data
            - name: ERI_URL
              value: http://eri.aerial
            - name: HARO_URL
              value: http://haro.aerial
            - name: AERIAL_INTERNAL_ERI_URL
              value: http://127.0.0.1:8080
            - name: GIT_TERMINAL_PROMPT
              value: "0"
          envFrom:
            - secretRef:
                name: shared-secrets
          image: ghcr.io/azylman/aerial-eri:${TAG_AERIAL_ERI:=latest}
          imagePullPolicy: Always
          name: eri
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - mountPath: /share
              name: share
            - mountPath: /data
              name: brain-data
            - mountPath: /local/antigravity-oauth-token
              name: oauth-token
              readOnly: true
              subPath: antigravity-oauth-token
      initContainers:
        - args:
            - --repo=https://github.com/azylman/aerial.git
            - --ref=main
            - --root=/share/.sync/aerial
            - --link=/share/aerial
            - --period=10s
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: shared-secrets
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
        - args:
            - --repo=https://github.com/azylman/aerial-config.git
            - --ref=main
            - --root=/share/.sync/aerial-config
            - --link=/share/aerial-config
            - --period=10s
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: shared-secrets
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial-config
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial-config
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
      nodeSelector:
        compute-tier: performance
        kubernetes.io/hostname: calibarn
      securityContext:
        fsGroup: 65533
      shareProcessNamespace: true
      volumes:
        - emptyDir: {}
          name: share
        - hostPath:
            path: /var/lib/docker/volumes/aerial-brain-data/_data
            type: Directory
          name: brain-data
        - name: oauth-token
          secret:
            defaultMode: 384
            items:
              - key: ANTIGRAVITY_OAUTH_TOKEN
                path: antigravity-oauth-token
            optional: true
            secretName: shared-secrets
---
