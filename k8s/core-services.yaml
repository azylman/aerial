apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerial-dashboard-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aerial-dashboard-reader-binding
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: aerial-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
---
# 1. ERI Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eri
  namespace: default
  labels:
    app.kubernetes.io/name: eri
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eri
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eri
    spec:
      shareProcessNamespace: true
      nodeSelector:
        compute-tier: performance
      initContainers:
        - name: git-sync-aerial
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          restartPolicy: Always
          args:
            - "--repo=https://github.com/azylman/aerial.git"
            - "--ref=main"
            - "--root=/share/aerial"
            - "--period=10s"
            - "--link=current"
            - "--exechook-command=kill -HUP 1"
          volumeMounts:
            - name: share-aerial
              mountPath: /share/aerial
        - name: git-sync-aerial-config
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          restartPolicy: Always
          args:
            - "--repo=https://github.com/azylman/aerial-config.git"
            - "--ref=main"
            - "--root=/share/aerial-config"
            - "--period=10s"
            - "--link=current"
            - "--exechook-command=kill -HUP 1"
          volumeMounts:
            - name: share-aerial-config
              mountPath: /share/aerial-config
      containers:
        - name: eri
          image: ghcr.io/azylman/aerial-eri:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: shared-secrets
          env:
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: share-aerial
              mountPath: /share/aerial
            - name: share-aerial-config
              mountPath: /share/aerial-config
            - name: brain-data
              mountPath: /data
      volumes:
        - name: share-aerial
          emptyDir: {}
        - name: share-aerial-config
          emptyDir: {}
        - name: brain-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eri
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: eri
---
