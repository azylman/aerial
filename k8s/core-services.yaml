apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: db-migrate
  name: db-migrate
  namespace: default
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      containers:
        - args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - postgres://aerial:$(POSTGRES_PASSWORD)@postgres:5432/aerial?sslmode=disable
            - --revisions-schema
            - sidecars
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: shared-secrets
          image: ghcr.io/azylman/aerial-sidecar-migrator:${TAG_AERIAL_SIDECAR_MIGRATOR:=latest}
          imagePullPolicy: Always
          name: migrate-sidecars
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - postgres://aerial:$(POSTGRES_PASSWORD)@postgres:5432/aerial?sslmode=disable
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: shared-secrets
          image: ghcr.io/azylman/aerial-migrator:${TAG_AERIAL_MIGRATOR:=latest}
          imagePullPolicy: Always
          name: migrate-core
      restartPolicy: OnFailure
