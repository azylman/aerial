              value: "true"
            - name: GF_LOG_MODE
              value: console
            - name: GF_LOG_CONSOLE_FORMAT
              value: json
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: victoriametrics-logs-datasource@0.34.0
          image: grafana/grafana:13.3.0
          name: grafana
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
