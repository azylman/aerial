apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: default
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [OUTPUT]
        Name          http
        Match         kube.*
        Host          openobserve.default.svc.cluster.local
        Port          5080
        URI           /api/default/docker_logs/_json
        Format        json
        Header        Content-Type application/json
        http_user     root@example.com
        http_passwd   ComplexPassword123#
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: default
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit-sa
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2.4
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read-binding
subjects:
  - kind: ServiceAccount
    name: fluent-bit-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: fluent-bit-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: default
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.12.1
          args:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host/root"
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  selector:
    app.kubernetes.io/name: node-exporter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: default
data:
  anomaly-rules.yml: |
    groups:
      - name: aerial_anomaly_detection
        interval: 30s
        rules:
          - record: aerial_anomaly_score:host_cpu
            expr: |
              (
                max(1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100
                - median_over_time((max(1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100)[2h])
              ) / (1.4826 * mad_over_time((max(1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100)[2h]) + 1.0)
          - record: aerial_anomaly_score:postgres_deadlocks
            expr: |
              (
                sum(increase(pg_stat_database_deadlocks{datname!~"template.*"}[1h]))
                - median_over_time((sum(increase(pg_stat_database_deadlocks{datname!~"template.*"}[1h])))[6h])
              ) / (1.4826 * mad_over_time((sum(increase(pg_stat_database_deadlocks{datname!~"template.*"}[1h])))[6h]) + 0.1)
          - record: aerial_anomaly_score:eri_runner_errors
            expr: |
              (
                sum(rate(aerial_brain_runner_errors_total[5m])) * 60
                - median_over_time((sum(rate(aerial_brain_runner_errors_total[5m])) * 60)[2h])
              ) / (1.4826 * mad_over_time((sum(rate(aerial_brain_runner_errors_total[5m])) * 60)[2h]) + 0.1)
          - record: aerial_anomaly_score:zscore
            expr: |
              zscore_over_time(aerial_brain_runner_errors_total[2h])
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: default
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.155.0
          args:
            - "-httpListenAddr=:8428"
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod=5y"
            - "-loggerFormat=json"
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: storage
              mountPath: /victoria-metrics-data
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8428
      targetPort: 8428
  selector:
    app.kubernetes.io/name: victoriametrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: default
  labels:
    app.kubernetes.io/name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.155.0
          args:
            - "-rule=/etc/vmalert/rules/*.yml"
            - "-datasource.url=http://victoriametrics:8428"
            - "-remoteWrite.url=http://victoriametrics:8428"
            - "-evaluationInterval=30s"
            - "-loggerFormat=json"
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: default
spec:
  type: ClusterIP
  ports:
