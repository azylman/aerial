apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: docket-mcp
  name: docket-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docket-mcp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docket-mcp
    spec:
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              until psql -h postgres -U aerial -d docket -tc "SELECT to_regclass('public.tasks')" | grep -q tasks; do sleep 2; done && psql -h postgres -U aerial -d docket -v ON_ERROR_STOP=1 -f /config/docket-schema.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-aerial-role
          image: ghcr.io/cloudnative-pg/postgresql:19-system-trixie@sha256:789b58fff514c28a42844962951c0556cedecaa8d3f35678bc86162fddad9f18
          name: init-docket-schema
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /config/docket-schema.sql
              name: config
              subPath: docket-schema.sql
      containers:
        - env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),service.version=${TAG_AERIAL_DOCKET_MCP:=latest}
            - name: PORT
              value: "8080"
            - name: CONFIG_PATH
              value: /config/config.yaml
            - name: POSTGRES_DB
              value: "docket"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-aerial-role
          image: ghcr.io/azylman/aerial-docket-mcp:${TAG_AERIAL_DOCKET_MCP:=latest}
          name: docket-mcp
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - mountPath: /config/tracing
              name: tracing-config
              readOnly: true
            - mountPath: /config/config.yaml
              name: config
              subPath: docket-mcp.yaml
            - mountPath: /local/config.yaml
              name: config
              subPath: docket-mcp.yaml
            - mountPath: /config/docket-schema.sql
              name: config
              subPath: docket-schema.sql
      volumes:
        - configMap:
            name: tracing-config
            optional: true
          name: tracing-config
        - configMap:
            defaultMode: 420
            name: mcp-configs
          name: config
