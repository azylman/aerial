apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerial-kubernetes-mcp
# Read-only by design for git-managed specs: cluster state changes go through git
# and Flux. Scoped write operations are limited to deleting pods/jobs (so their
# controller or Flux recreates them cleanly from git) and updating aerial-image-tags
# + triggering Flux reconciliation in flux-system (via Role/aerial-kubernetes-mcp-flux).
# pods/exec and batch/jobs creation/patching are granted only in the default namespace
# (via Role/aerial-kubernetes-mcp-exec) for live in-pod diagnostics and CronJob reruns.
# Secrets, serviceaccounts/token, nodes/proxy and all RBAC resources are excluded on
# purpose to prevent credential reads and privilege escalation.
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - namespaces
      - nodes
      - serviceaccounts
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - controllerrevisions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - delete
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - referencegrants
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - helmrepositories
      - ocirepositories
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.victoriametrics.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - restate.dev
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - external-secrets.io
      - generators.external-secrets.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aerial-kubernetes-mcp-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aerial-kubernetes-mcp
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-sa
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aerial-kubernetes-mcp-flux
  namespace: flux-system
rules:
  - apiGroups:
      - ""
    resourceNames:
      - aerial-image-tags
    resources:
      - configmaps
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aerial-kubernetes-mcp-flux-binding
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aerial-kubernetes-mcp-flux
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-sa
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aerial-kubernetes-mcp-exec
  namespace: default
# In-pod diagnostics (ps, reading generated runtime config files) and ad-hoc batch Job
# creation/reruns for workloads in the default namespace only. create covers SPDY and
# websocket exec; get covers clusters that still authorize websocket upgrades with get.
rules:
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aerial-kubernetes-mcp-exec-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aerial-kubernetes-mcp-exec
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-sa
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: kubernetes-mcp
  name: kubernetes-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
    spec:
      containers:
        - args:
            - --config
            - /etc/kubernetes-mcp-server/config.toml
          image: quay.io/containers/kubernetes_mcp_server:latest
          imagePullPolicy: Always
          name: kubernetes-mcp-server
          ports:
            - containerPort: 8080
              name: mcp
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/kubernetes-mcp-server/config.toml
              name: config
              subPath: kubernetes-mcp.toml
              readOnly: true
      serviceAccountName: kubernetes-mcp-sa
      volumes:
        - configMap:
            defaultMode: 420
            name: mcp-configs
          name: config
