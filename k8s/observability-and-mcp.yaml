apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kubernetes-services
  namespace: default
spec:
  # Generic opt-in scrape for any Service in default carrying prometheus.io/*
  # annotations. Discovery is per endpoint, so every backing pod is its own
  # target at podIP:<prometheus.io/port> (a draining pod and its replacement
  # are separate series instead of one load-balanced, flapping target).
  # prometheus.io/port names the pod's target (container) port, not the
  # Service port. Services that expose the same target port under several
  # Service ports produce identical targets that vmagent collapses into one
  # (see promscrape.suppressDuplicateScrapeTargetErrors on the VMSingle).
  # job = prometheus.io/job if set, else the Service name; instance = pod name.
  discoveryRole: endpointslices
  namespaceSelector:
    matchNames:
      - default
  selector: {}
  endpoints:
    - interval: 15s
      relabelConfigs:
        - action: keep
          regex: "true"
          sourceLabels:
            - __meta_kubernetes_service_annotation_prometheus_io_scrape
        - action: keep_if_equal
          sourceLabels:
            - __meta_kubernetes_endpointslice_port
            - __meta_kubernetes_service_annotation_prometheus_io_port
        - action: replace
          regex: (.+)
          sourceLabels:
            - __meta_kubernetes_service_annotation_prometheus_io_path
          targetLabel: __metrics_path__
        - action: replace
          sourceLabels:
            - __meta_kubernetes_service_name
          targetLabel: job
        - action: replace
          regex: (.+)
          sourceLabels:
            - __meta_kubernetes_service_annotation_prometheus_io_job
          targetLabel: job
        - action: replace
          regex: (.+)
          sourceLabels:
            - __meta_kubernetes_pod_name
          targetLabel: instance
        - action: labelmap
          regex: __meta_kubernetes_service_annotation_prometheus_io_label_(.+)
