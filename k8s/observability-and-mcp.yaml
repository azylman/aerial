kind: ConfigMap
metadata:
  name: mcp-configs
  namespace: default
---
apiVersion: v1
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        storage.path              /var/log/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.max_chunks_up     128
        storage.backlog.mem_limit 50M

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        storage.type      filesystem

    [INPUT]
        Name              systemd
        Tag               node.journal
        Path              /var/log/journal
        DB                /var/log/flb_journal.db
        Read_From_Tail    On
        Strip_Underscores On
        Mem_Buf_Limit     50MB
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [FILTER]
        Name    lua
        Match   *
        script  /fluent-bit/etc/redact.lua
        call    redact

    [OUTPUT]
        Name                     http
        Match                    kube.*
        Host                     victorialogs.default.svc.cluster.local
        Port                     9428
        URI                      /insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.container_name&_msg_field=log,msg,message,MESSAGE&_time_field=date
        Format                   json_lines
        Json_date_key            date
        Json_date_format         iso8601
        Compress                 gzip
        Retry_Limit              no_limits
        storage.total_limit_size 5G

    [OUTPUT]
        Name                     http
        Match                    node.*
        Host                     victorialogs.default.svc.cluster.local
        Port                     9428
        URI                      /insert/jsonline?_stream_fields=SYSLOG_IDENTIFIER&_msg_field=MESSAGE,log,msg,message&_time_field=date
        Format                   json_lines
        Json_date_key            date
        Json_date_format         iso8601
        Compress                 gzip
        Retry_Limit              no_limits
        storage.total_limit_size 1G
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
  redact.lua: |
    -- Exact-value secret redaction. /redact/values holds every Infisical secret
    -- value, NUL-terminated, written by the redact-values initContainer.
    -- Never print values from this script: counts only.
    local find, sub, gsub = string.find, string.sub, string.gsub
    local MASK = "[REDACTED]"
    local JSON_SECRET_KEYS = { "token", "access_token", "refresh_token", "client_secret", "password", "private_key" }
    local JSON_UNESCAPE = { ["\\"] = "\\", ['"'] = '"', ["/"] = "/", n = "\n" }

    local targets = {}
    local seen = {}

    local function add(v)
      if v ~= "" and not seen[v] then
        seen[v] = true
        targets[#targets + 1] = v
      end
    end

    local function trim_newline(v)
      return (gsub(v, "\r?\n$", "", 1))
    end

    -- Each line of a PEM body, minus the armor lines.
    local function add_pem_lines(v)
      for line in string.gmatch(v .. "\n", "([^\n]*)\n") do
        line = gsub(line, "\r$", "")
        if line ~= "" and not find(line, "-----BEGIN", 1, true) and not find(line, "-----END", 1, true) then
          add(line)
        end
      end
    end

    -- Register a secret plus its JSON-escaped spelling, which is how it appears
    -- when a log line embeds it inside a JSON string that was not merged.
    local function add_secret(v)
      add(v)
      add((gsub(gsub(gsub(v, "\\", "\\\\"), '"', '\\"'), "\n", "\\n")))
      if find(v, "-----BEGIN", 1, true) then
        add_pem_lines(v)
      end
    end

    -- Raw (still escaped) contents of every "key": "..." string value in a JSON text.
    local function json_string_values(text, key)
      local out = {}
      local pos = 1
      local quoted = '"' .. key .. '"'
      while true do
        local _, e = find(text, quoted, pos, true)
        if not e then break end
        pos = e + 1
        local _, q = find(text, "^%s*:%s*\"", pos)
        if q then
          local i = q + 1
          while i <= #text do
            local c = sub(text, i, i)
            if c == "\\" then
              i = i + 2
            elseif c == '"' then
              out[#out + 1] = sub(text, q + 1, i - 1)
              break
            else
              i = i + 1
            end
          end
          pos = i + 1
        end
      end
      return out
    end

    local values, json_without_secrets = 0, 0

    local f = io.open("/redact/values", "rb")
    if f then
      local blob = f:read("*a")
      f:close()
      for raw in string.gmatch(blob, "([^%z]*)%z") do
        if raw ~= "" then
          values = values + 1
          if sub(raw, 1, 1) == "{" then
            local found = 0
            for _, key in ipairs(JSON_SECRET_KEYS) do
              for _, esc in ipairs(json_string_values(raw, key)) do
                local v = gsub(esc, "\\(.)", function(c) return JSON_UNESCAPE[c] or ("\\" .. c) end)
                if v ~= "" then
                  found = found + 1
                  add_secret(v)
                end
              end
            end
            if found == 0 then json_without_secrets = json_without_secrets + 1 end
          elseif find(raw, "-----BEGIN", 1, true) then
            add_pem_lines(raw)
          else
            add_secret(trim_newline(raw))
          end
        end
      end
    end

    -- Longest first so a secret that contains another is masked whole.
    table.sort(targets, function(a, b)
      if #a ~= #b then return #a > #b end
      return a < b
    end)
    seen = nil

    -- print() goes to fully buffered stdout under a non-tty PID 1, so the
    -- startup line never reaches the pod log; stderr is unbuffered.
    local function log(msg)
      io.stderr:write(msg, "\n")
    end

    if #targets == 0 then
      log(string.format("[redact] WARNING: 0 redaction targets loaded from %d secret values; logs pass through unredacted", values))
    else
      log(string.format("[redact] loaded %d redaction targets from %d secret values", #targets, values))
    end
    if json_without_secrets > 0 then
      log(string.format("[redact] WARNING: %d JSON secret values had no recognized secret fields", json_without_secrets))
    end

    local function replace_all(s, t, start)
      local parts, n, i = {}, 0, 1
      local a, b = start, start + #t - 1
      while a do
        parts[n + 1] = sub(s, i, a - 1)
        parts[n + 2] = MASK
        n = n + 2
        i = b + 1
        a, b = find(s, t, i, true)
      end
      parts[n + 1] = sub(s, i)
      return table.concat(parts)
    end

    local function scrub_string(s)
      local changed = false
      for k = 1, #targets do
        local t = targets[k]
        local a = find(s, t, 1, true)
        if a then
          s = replace_all(s, t, a)
          changed = true
        end
      end
      return s, changed
    end

    local function scrub_table(tbl)
      local changed = false
      for k, v in pairs(tbl) do
        local tv = type(v)
        if tv == "string" then
          local s, c = scrub_string(v)
          if c then
            tbl[k] = s
            changed = true
          end
        elseif tv == "table" then
          if scrub_table(v) then changed = true end
        end
      end
      return changed
    end

    function redact(tag, timestamp, record)
      if #targets > 0 and scrub_table(record) then
        return 2, timestamp, record
      end
      return 0, timestamp, record
    end
kind: ConfigMap
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: fluent-bit-config
  namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    deprecated.daemonset.template.generation: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: fluent-bit
  name: fluent-bit
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      initContainers:
        - command:
            - sh
            - -c
            - |
              set -eu
              out=/redact/values
              : > "$out"
              n=0
              for f in /secrets/*; do
                [ -f "$f" ] || continue
                cat "$f" >> "$out"
                printf '\0' >> "$out"
                n=$((n + 1))
              done
              echo "redact-values: wrote $n secret values"
          image: cr.fluentbit.io/fluent/fluent-bit:3.2.4-debug
          name: redact-values
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /secrets
              name: shared-secrets
              readOnly: true
            - mountPath: /redact
              name: redact-values
      containers:
        - image: cr.fluentbit.io/fluent/fluent-bit:3.2.4
          name: fluent-bit
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /var/log
              name: varlog
            - mountPath: /var/lib/docker/containers
              name: varlibdockercontainers
              readOnly: true
            - mountPath: /fluent-bit/etc/
              name: config
            - mountPath: /etc/machine-id
              name: etcmachineid
              readOnly: true
            - mountPath: /redact
              name: redact-values
              readOnly: true
      serviceAccountName: fluent-bit-sa
      tolerations:
        - operator: Exists
      volumes:
        - hostPath:
            path: /var/log
            type: ""
          name: varlog
        - hostPath:
            path: /var/lib/docker/containers
            type: ""
          name: varlibdockercontainers
        - configMap:
            defaultMode: 420
            name: fluent-bit-config
          name: config
        - hostPath:
            path: /etc/machine-id
            type: File
          name: etcmachineid
        - name: shared-secrets
          secret:
            secretName: shared-secrets
        - emptyDir:
            medium: Memory
            sizeLimit: 8Mi
          name: redact-values
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit-sa
    namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    deprecated.daemonset.template.generation: "1"
  labels:
    app.kubernetes.io/name: node-exporter
  name: node-exporter
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      containers:
        - args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
          image: prom/node-exporter:v1.12.1
          name: node-exporter
          ports:
            - containerPort: 9100
              hostPort: 9100
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /host/proc
              name: proc
              readOnly: true
            - mountPath: /host/sys
              name: sys
              readOnly: true
            - mountPath: /host/root
              name: root
              readOnly: true
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      volumes:
        - hostPath:
            path: /proc
            type: ""
          name: proc
        - hostPath:
            path: /sys
            type: ""
          name: sys
        - hostPath:
            path: /
            type: ""
          name: root
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: default
spec:
  ports:
    - name: metrics
      port: 9100
      protocol: TCP
      targetPort: 9100
  selector:
    app.kubernetes.io/name: node-exporter
  type: ClusterIP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: aerial-observability-rules
  namespace: default
spec:
  groups:
    - name: aerial_anomaly_detection
      interval: 30s
      rules:
        - record: aerial_anomaly_score:host_cpu
          expr: |
            (
              max(1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100
              - median_over_time((max(1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100)[2h])
            ) / (1.4826 * mad_over_time((max(1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100)[2h]) + 1.0)
        - record: aerial_anomaly_score:postgres_deadlocks
          expr: |
            (
              sum(increase(pg_stat_database_deadlocks{datname!~"template.*"}[1h]))
              - median_over_time((sum(increase(pg_stat_database_deadlocks{datname!~"template.*"}[1h])))[6h])
            ) / (1.4826 * mad_over_time((sum(increase(pg_stat_database_deadlocks{datname!~"template.*"}[1h])))[6h]) + 0.1)
        - record: aerial_anomaly_score:eri_runner_errors
          expr: |
            (
              sum(rate(aerial_brain_runner_errors_total[5m])) * 60
              - median_over_time((sum(rate(aerial_brain_runner_errors_total[5m])) * 60)[2h])
            ) / (1.4826 * mad_over_time((sum(rate(aerial_brain_runner_errors_total[5m])) * 60)[2h]) + 0.1)
        - record: aerial_anomaly_score:zscore
          expr: |
            zscore_over_time(aerial_brain_runner_errors_total[2h])
    - name: observability_ingestion
      interval: 1m
      rules:
        - alert: VictoriaLogsIngestionStalled
          expr: |
            sum(increase(vl_rows_ingested_total{job="victorialogs"}[15m])) == 0
            or absent(vl_rows_ingested_total{job="victorialogs"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs has ingested no log rows for 15 minutes
        - alert: VictoriaTracesIngestionStalled
          expr: |
            sum(increase(vt_rows_ingested_total{job="victoriatraces"}[15m])) == 0
            or absent(vt_rows_ingested_total{job="victoriatraces"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: VictoriaTraces has ingested no spans for 15 minutes
    - name: pr_lifecycle_restate
      interval: 1m
      rules:
        - alert: SynapseRestateSendErrors
          expr: |
            sum by (handler) (increase(synapse_restate_sends_total{status="error"}[15m])) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: synapse Restate sends to {{ $labels.handler }} keep failing; PR lifecycle events are retrying
        - alert: SynapseRestateSendRejected
          expr: |
            sum by (handler) (increase(synapse_restate_sends_total{status="terminal"}[15m])) > 0
          labels:
            severity: critical
          annotations:
            summary: Restate rejected synapse {{ $labels.handler }} sends terminally; the jobs were dropped
        - alert: SynapseLifecycleJobsDropped
          expr: |
            sum by (kind, reason) (increase(synapse_jobs_dropped_total{kind=~"github_webhook|deploy_webhook"}[15m])) > 0
          labels:
            severity: critical
          annotations:
            summary: synapse dropped {{ $labels.kind }} jobs ({{ $labels.reason }}); those PR lifecycle events never reached Restate
        - alert: PrstateEffectErrors
          expr: |
            sum by (kind, result) (increase(prstate_effects_total{result=~"error|dropped|unconfigured"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: prstate {{ $labels.kind }} effects are failing ({{ $labels.result }})
    - name: nats_health
      interval: 1m
      rules:
        - alert: NatsMetricsMissing
          expr: absent(gnatsd_varz_mem{job="default/nats"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: NATS metrics have not been scraped for 10 minutes
        - alert: NatsMemoryHigh
          expr: max(container_memory_working_set_bytes{container="nats", pod=~"nats-.*"}) > 600 * 1024 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: NATS memory has been above 600 MiB (of its 1 GiB limit) for 15 minutes
        - alert: NatsStreamNearFull
          expr: |
            max by (account, stream_name) (jetstream_stream_total_bytes{job="default/nats"})
              / max by (account, stream_name) (jetstream_stream_limit_bytes{job="default/nats"} > 0) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NATS stream {{ $labels.account }}/{{ $labels.stream_name }} is above 80% of its byte limit"
        - alert: NatsHealthzFailing
          expr: max(gnatsd_healthz_status{job="default/nats"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: NATS /healthz is failing
    - name: vanadis_restate_health
      interval: 30s
      rules:
        - alert: VanadisRestateReconcileErrors
          expr: |
            sum(increase(vanadis_restate_reconcile_errors_total[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: vanadis-restate reconcile or handler errors detected (Restate invocation backing off)
    - name: github_credential_health
      interval: 1m
      rules:
        # A service configured for the GitHub App (github_credential: app)
        # keeps sending PAT-authenticated requests: App env missing or token
        # mint failing. A deliberate move to pat sets
        # github_credential_configured{credential="app"} to 0 and never pages.
        - alert: GitHubPATTrafficOnAppCredential
          expr: |
            sum by (namespace, job) (rate(github_requests_by_source_total{source="pat"}[5m])) > 0
            and on (namespace, job)
            max by (namespace, job) (github_credential_configured{credential="app"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} is configured for the GitHub App but has sent PAT-authenticated GitHub requests for 15 minutes"
    - name: eri_session_health
      interval: 30s
      rules:
        - alert: BrainUnrotatedSessionTurns
          expr: |
            sum(increase(aerial_brain_unrotated_session_turns_total[15m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Eri processed turns on a session exceeding the unrotated turn threshold without rotation
        - alert: EriTurnCapHit
          expr: |
            sum by (job) (increase(aerial_brain_turn_timeouts_total{reason="turn_cap"}[30m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }}: a turn hit the turn_timeout_minutes cap and was retried"
