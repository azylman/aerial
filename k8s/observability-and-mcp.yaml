apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'Aerial System'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /share/aerial/services/grafana/dashboards
          foldersFromFilesStructure: true
      - name: 'Aerial Custom'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /share/aerial-config/services/grafana/dashboards
          foldersFromFilesStructure: true
  victoriametrics.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics:8428
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
        editable: false
  victorialogs.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victorialogs:9428
        editable: false
  victoriatraces.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaTraces
        uid: victoriatraces
        type: jaeger
        access: proxy
        url: http://victoriatraces:10428/select/jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: victorialogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            customQuery: true
            query: 'trace_id:"$${__trace.traceId}"'
        editable: false
kind: ConfigMap
metadata:
