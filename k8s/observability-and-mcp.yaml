apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.kubernetes.io/storage-provisioner: rancher.io/local-path
  name: bazel-remote-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 55Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: bazel-remote
  name: bazel-remote
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
    spec:
      nodeSelector:
        kubernetes.io/hostname: quiet-zero
      securityContext:
        fsGroup: 1000
      containers:
        - name: bazel-remote
          image: buchgr/bazel-remote:v2.6.4
          args:
            - --dir=/data
            - --max_size=50
            - --http_address=0.0.0.0:9090
            - --grpc_address=0.0.0.0:9092
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
            - containerPort: 9092
              name: grpc
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /status
              port: 9090
          livenessProbe:
            httpGet:
              path: /status
              port: 9090
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - mountPath: /data
              name: bazel-remote-data
      volumes:
        - name: bazel-remote-data
          persistentVolumeClaim:
            claimName: bazel-remote-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: bazel-remote
  name: bazel-remote
  namespace: default
spec:
  ports:
    - name: http
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: grpc
      port: 9092
      protocol: TCP
      targetPort: 9092
  selector:
    app.kubernetes.io/name: bazel-remote
  type: ClusterIP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: bazel-remote
  namespace: default
spec:
  discoveryRole: endpointslices
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.kubernetes.io/storage-provisioner: rancher.io/local-path
  name: victoriametrics-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.kubernetes.io/storage-provisioner: rancher.io/local-path
  name: victorialogs-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.kubernetes.io/storage-provisioner: rancher.io/local-path
  name: victoriatraces-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: local-path
---
apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'Aerial System'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /share/aerial/services/grafana/dashboards
          foldersFromFilesStructure: true
      - name: 'Aerial Custom'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /share/aerial-config/services/grafana/dashboards
          foldersFromFilesStructure: true
  victoriametrics.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics:8428
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
        editable: false
  victorialogs.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victorialogs:9428
        editable: false
  victoriatraces.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaTraces
        uid: victoriatraces
        type: jaeger
        access: proxy
        url: http://victoriatraces:10428/select/jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: victorialogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            customQuery: true
            query: 'trace_id:"$${__trace.traceId}"'
        editable: false
kind: ConfigMap
metadata:
  annotations:
    # Grafana's $${__trace.traceId} placeholder must reach Grafana untouched.
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: grafana-provisioning
  namespace: default
