      persistentVolumeClaim:
        claimName: victoriametrics-pvc
  volumeMounts:
    - name: data
      mountPath: /victoria-metrics-data
  securityContext:
    fsGroup: 65533
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  extraArgs:
