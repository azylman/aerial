apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: docket-store
  name: docket-store
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docket-store
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docket-store
    spec:
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              psql -h postgres -U aerial -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'docket'" | grep -q 1 || psql -h postgres -U aerial -d postgres -c "CREATE DATABASE docket;" && psql -h postgres -U aerial -d docket -c "CREATE EXTENSION IF NOT EXISTS vector;"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: postgres-secret
          image: ghcr.io/cloudnative-pg/postgresql:18
          name: init-docket-db
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "${DOCKET_PUBLIC_URL:=http://docket.aerial.lan}"
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "true"
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: postgres-secret
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres
            - name: VIKUNJA_DATABASE_HOST
              value: postgres
            - name: VIKUNJA_DATABASE_PORT
              value: "5432"
            - name: VIKUNJA_DATABASE_USER
              value: aerial
            - name: VIKUNJA_DATABASE_DATABASE
              value: docket
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: postgres-secret
          image: vikunja/vikunja:latest
          name: docket-store
          ports:
            - containerPort: 3456
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /app/vikunja/files
              name: files
      securityContext:
        fsGroup: 1000
      volumes:
        - emptyDir: {}
          name: files
---
