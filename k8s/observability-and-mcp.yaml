              name: prov-ds
              subPath: victoriatraces.yml
            - mountPath: /local/provisioning/dashboards/dashboards.yml
              name: prov-db
              subPath: dashboards.yml
            - mountPath: /share
              name: share
              readOnly: true
      initContainers:
        - command:
            - /bin/sh
            - -c
            - psql -h postgres -U aerial -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'grafana'" | grep -q 1 || psql -h postgres -U aerial -d postgres -c "CREATE DATABASE grafana;"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: postgres-secret
          image: ghcr.io/cloudnative-pg/postgresql:18
          name: init-grafana-db
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - args:
            - --repo=${AERIAL_REPO_URL:=https://github.com/azylman/aerial.git}
            - --ref=main
            - --root=/share/.sync/aerial
            - --link=/share/aerial
            - --period=30s
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: git-sync-secret
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
        - args:
            - --repo=${AERIAL_CONFIG_REPO_URL:=https://github.com/azylman/aerial-config.git}
            - --ref=main
            - --root=/share/.sync/aerial-config
            - --link=/share/aerial-config
            - --period=30s
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: git-sync-secret
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial-config
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial-config
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
      securityContext:
        fsGroup: 65533
      volumes:
        - configMap:
            defaultMode: 420
            name: grafana-provisioning
          name: prov-ds
        - configMap:
            defaultMode: 420
            name: grafana-provisioning
          name: prov-db
        - emptyDir: {}
