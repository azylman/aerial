apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: prospera
  name: prospera
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prospera
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prospera
    spec:
      containers:
        - env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),service.version=${TAG_AERIAL_PROSPERA:=latest}
            - name: CONFIG_PATH
              value: /share/aerial-config/services/prospera/prospera.yaml
            - name: RESTATE_PORT
              value: "9080"
            - name: RESTATE_INGRESS_URL
              value: http://restate.aerial:8080
            - name: RESTATE_ADMIN_URL
              value: http://restate.aerial:9070
            - name: NATS_AERIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: NATS_AERIAL_PASSWORD
                  name: nats-aerial-client
            - name: NATS_URL
              value: nats://aerial:$(NATS_AERIAL_PASSWORD)@nats.aerial:4222
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-aerial-role
          envFrom:
            - secretRef:
                name: prospera-secret
                optional: true
          image: ghcr.io/azylman/aerial-prospera:${TAG_AERIAL_PROSPERA:=latest}
          imagePullPolicy: Always
          name: prospera
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9080
              name: restate
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - mountPath: /config/tracing
              name: tracing-config
              readOnly: true
            - mountPath: /share
              name: share
              readOnly: true
      initContainers:
        - args:
            - --repo=${AERIAL_CONFIG_REPO_URL:=https://github.com/azylman/aerial-config.git}
            - --ref=main
            - --root=/share/.sync/aerial-config
            - --link=/share/aerial-config
            - --period=30s
            - --webhook-url=http://127.0.0.1:8080/-/reload
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: git-sync-secret
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial-config
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial-config
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
      securityContext:
        fsGroup: 65533
      volumes:
        - configMap:
            name: tracing-config
            optional: true
          name: tracing-config
        - emptyDir: {}
          name: share
---
apiVersion: v1
kind: Service
metadata:
  name: prospera
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: http-default
      port: 80
      protocol: TCP
      targetPort: 8080
    - appProtocol: kubernetes.io/h2c
      name: restate
      port: 9080
      protocol: TCP
      targetPort: 9080
  selector:
    app.kubernetes.io/name: prospera
  type: ClusterIP
