---
# otel-collector: the single trace-redaction checkpoint in front of VictoriaTraces.
# Every OTLP span is masked here: registered secret values (plus their base64,
# URL-encoded and git basic-auth variants) are replaced with [REDACTED] in resource,
# scope, span and span-event fields. Matching is value-only (no regexes). At pod start
# the redact-pattern initContainer (its own image, so eri releases never roll this
# Deployment) reads shared-secrets plus the non-secret canary below and writes the
# complete transform/redact trace_statements list to /redact/statements.yaml: values
# are packed longest-first into groups whose OTTL literal stays under
# -max-pattern-bytes, one statement per group per field. OTTL parse time grows
# super-linearly with literal size, so many small literals start in seconds where one
# huge pattern took minutes on a 1-core limit. Secret rotation needs a pod restart:
# Stakater Reloader (reloader.stakater.com/auto) rolls the Deployment when
# shared-secrets, otel-collector-config or otel-collector-canary change, same as
# fluent-bit. Flux substitution is disabled on this ConfigMap so ${file:...} reaches
# the collector.
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: otel-collector-config
  namespace: default
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # trace_statements is a whole-value ${file:...} reference, so confmap parses the
      # generated file as YAML (a list of context blocks). Its paths carry explicit
      # context prefixes: unprefixed paths make OTTL log every rewritten statement at
      # startup, which would print the secret pattern. error_mode silent keeps ignore
      # semantics (a failing statement never drops a batch) without logging the
      # failing statement text, which embeds the pattern.
      transform/redact:
        error_mode: silent
        trace_statements: ${file:/redact/statements.yaml}
      batch:
        send_batch_size: 1024
        timeout: 2s
    exporters:
      otlphttp/victoriatraces:
        traces_endpoint: http://victoriatraces.default.svc.cluster.local:10428/insert/opentelemetry/v1/traces
        compression: gzip
    service:
      extensions: [health_check]
      telemetry:
        logs:
          encoding: json
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/redact, batch]
          exporters: [otlphttp/victoriatraces]
---
# Non-secret canary value registered only in the collector pattern. Verification
# sends spans carrying it (raw and base64) and checks VictoriaTraces shows [REDACTED].
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-canary
  namespace: default
data:
  values: |
    aerial-redaction-canary-5e1f9b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: otel-collector
  name: otel-collector
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: redact-pattern
          image: ghcr.io/azylman/aerial-redact-pattern:${TAG_AERIAL_REDACT_PATTERN:=latest}
          imagePullPolicy: IfNotPresent
          args:
            - -secrets-dir=/secrets
            - -extra-file=/canary/values
            - -statements-out=/redact/statements.yaml
            - -max-pattern-bytes=1024
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /secrets
              name: shared-secrets
              readOnly: true
            - mountPath: /canary
              name: canary
              readOnly: true
            - mountPath: /redact
              name: redact-pattern
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 8888
              name: metrics
              protocol: TCP
            - containerPort: 13133
              name: health
              protocol: TCP
          # Config parse (redaction statements) can be slow on a 1-core node; the
          # startupProbe allows ~5 min before liveness takes over, so a slow start
          # is never killed mid-parse.
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 30
            failureThreshold: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/otelcol
              name: config
              readOnly: true
            - mountPath: /redact
              name: redact-pattern
              readOnly: true
      volumes:
        - configMap:
            name: otel-collector-config
          name: config
        - configMap:
            name: otel-collector-canary
          name: canary
        - name: shared-secrets
          secret:
            secretName: shared-secrets
        - emptyDir:
            medium: Memory
            sizeLimit: 8Mi
          name: redact-pattern
---
# Collector self-metrics are scraped by the kubernetes-services VMServiceScrape via
# the prometheus.io annotations (port must match a Service port number).
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "8888"
    prometheus.io/scrape: "true"
  name: otel-collector
  namespace: default
spec:
  ports:
    - appProtocol: grpc
      name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: otlp-http
    - name: metrics
      port: 8888
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: otel-collector
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: grafana
  name: grafana
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - env:
            - name: GF_PATHS_PROVISIONING
              value: /local/provisioning
            - name: GF_DATABASE_TYPE
              value: "postgres"
            - name: GF_DATABASE_HOST
              value: "postgres:5432"
            - name: GF_DATABASE_NAME
              value: "grafana"
            - name: GF_DATABASE_USER
              value: "aerial"
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-aerial-role
            - name: GF_DATABASE_SSL_MODE
              value: "disable"
            - name: GF_SERVER_ROOT_URL
              value: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-aerial-role
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: Main Org.
            - name: GF_AUTH_ANONYMOUS_HIDE_VERSION
              value: "true"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "true"
            - name: GF_PANELS_DISABLE_SANITIZE_HTML
              value: "true"
            - name: GF_LOG_MODE
              value: console
            - name: GF_LOG_CONSOLE_FORMAT
              value: json
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: victoriametrics-logs-datasource@0.34.0
          image: grafana/grafana:13.3.0
          name: grafana
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /local/provisioning/datasources/victoriametrics.yml
              name: prov-ds
              subPath: victoriametrics.yml
            - mountPath: /local/provisioning/datasources/victorialogs.yml
              name: prov-ds
              subPath: victorialogs.yml
            - mountPath: /local/provisioning/datasources/victoriatraces.yml
              name: prov-ds
              subPath: victoriatraces.yml
            - mountPath: /local/provisioning/dashboards/dashboards.yml
              name: prov-db
              subPath: dashboards.yml
            - mountPath: /share
              name: share
              readOnly: true
      initContainers:
        - args:
            - --repo=${AERIAL_REPO_URL:=https://github.com/azylman/aerial.git}
            - --ref=main
            - --root=/share/.sync/aerial
            - --link=/share/aerial
            - --period=30s
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: git-sync-secret
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
        - args:
            - --repo=${AERIAL_CONFIG_REPO_URL:=https://github.com/azylman/aerial-config.git}
            - --ref=main
            - --root=/share/.sync/aerial-config
            - --link=/share/aerial-config
            - --period=30s
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: '*'
            - name: GITSYNC_USERNAME
              value: x-access-token
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: git-sync-secret
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          name: git-sync-aerial-config
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - git
                - -C
                - /share/aerial-config
                - rev-parse
                - HEAD
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /share
              name: share
      securityContext:
        fsGroup: 65533
      volumes:
        - configMap:
            defaultMode: 420
            name: grafana-provisioning
          name: prov-ds
        - configMap:
            defaultMode: 420
            name: grafana-provisioning
          name: prov-db
        - emptyDir: {}
          name: share
