apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: docket-mcp
  name: docket-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docket-mcp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docket-mcp
    spec:
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              until psql -h postgres -U aerial -d docket -tc "SELECT to_regclass('public.tasks')" | grep -q tasks; do sleep 2; done && psql -h postgres -U aerial -d docket -v ON_ERROR_STOP=1 -f /config/docket-schema.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: postgres-secret
          image: ghcr.io/cloudnative-pg/postgresql:18
          name: init-docket-schema
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /config/docket-schema.sql
              name: config
              subPath: docket-schema.sql
      containers:
        - env:
            - name: PORT
              value: "8080"
            - name: CONFIG_PATH
              value: /config/config.yaml
            - name: POSTGRES_DB
              value: "docket"
          envFrom:
            - secretRef:
                name: postgres-secret
          image: ghcr.io/azylman/aerial-docket-mcp:${TAG_AERIAL_DOCKET_MCP:=latest}
          name: docket-mcp
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - mountPath: /config/tracing
              name: tracing-config
              readOnly: true
            - mountPath: /config/config.yaml
              name: config
              subPath: docket-mcp.yaml
            - mountPath: /local/config.yaml
              name: config
              subPath: docket-mcp.yaml
            - mountPath: /config/docket-schema.sql
              name: config
              subPath: docket-schema.sql
      volumes:
        - configMap:
            name: tracing-config
            optional: true
          name: tracing-config
        - configMap:
            defaultMode: 420
            name: mcp-configs
          name: config
---
