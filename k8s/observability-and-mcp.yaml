kind: Service
metadata:
  name: docket-mcp
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: http-default
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: docket-mcp
  type: ClusterIP
