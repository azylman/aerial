apiVersion: v1
kind: Namespace
metadata:
  name: aerial
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  aerial.server: |
    aerial:53 {
        errors
        cache 30
        rewrite name suffix .aerial .default.svc.cluster.local
        forward . /etc/resolv.conf
    }
    lan:53 {
        errors
        cache 30
        rewrite name suffix .lan .default.svc.cluster.local
        forward . /etc/resolv.conf
    }
