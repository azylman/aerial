apiVersion: v1
kind: Namespace
metadata:
  name: aerial
---
apiVersion: v1
kind: Namespace
metadata:
  name: restate
---
apiVersion: v1
kind: Namespace
metadata:
  name: restate-marida
---
apiVersion: v1
kind: Namespace
metadata:
  name: restate-miorine
---
apiVersion: v1
data:
  aerial.override: |
    rewrite stop {
        name regex restate\.aerial\.?$ restate.restate.svc.cluster.local.
        answer name (.*)\.restate\.svc\.cluster\.local\.?$ restate.aerial.
    }
    rewrite stop {
        name regex restate-marida\.aerial\.?$ restate.restate-marida.svc.cluster.local.
        answer name (.*)\.restate-marida\.svc\.cluster\.local\.?$ restate-marida.aerial.
    }
    rewrite stop {
        name regex (.*)\.aerial\.?$ {1}.default.svc.cluster.local.
        answer name (.*)\.default\.svc\.cluster\.local\.?$ {1}.aerial.
    }
kind: ConfigMap
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: coredns-custom
  namespace: kube-system
