apiVersion: v1
kind: Namespace
metadata:
  name: aerial
---
apiVersion: v1
data:
  aerial.override: |
    rewrite stop {
        name regex (.*)\.aerial\.?$ {1}.default.svc.cluster.local.
        answer name (.*)\.default\.svc\.cluster\.local\.?$ {1}.aerial.
    }
    rewrite stop {
        name regex (.*)\.lan\.?$ {1}.default.svc.cluster.local.
        answer name (.*)\.default\.svc\.cluster\.local\.?$ {1}.lan.
    }
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
