apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: default
spec:
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: app
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: app
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  instances: 1
  logLevel: info
  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        login: true
        name: aerial
        passwordSecret:
          name: postgres-aerial-role
        superuser: true
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: "on"
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
      full_page_writes: "on"
      log_destination: csvlog
      log_directory: /controller/log
      log_filename: postgres
      log_rotation_age: "0"
      log_rotation_size: "0"
      log_truncate_on_rotation: "false"
      logging_collector: "on"
      max_parallel_workers: "32"
      max_replication_slots: "32"
      max_worker_processes: "32"
      shared_memory_type: mmap
      shared_preload_libraries: ""
      ssl_max_protocol_version: TLSv1.3
      ssl_min_protocol_version: TLSv1.3
      wal_keep_size: 512MB
      wal_level: logical
      wal_log_hints: "on"
      wal_receiver_timeout: 5s
      wal_sender_timeout: 5s
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  storage:
    resizeInUseVolumes: true
    size: 20Gi
    storageClass: local-path
  switchoverDelay: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
    - name: metrics
      port: 9187
      protocol: TCP
      targetPort: 9187
  selector:
    cnpg.io/cluster: postgres
    role: primary
  type: ClusterIP
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-nightly-backup
  namespace: default
spec:
  backupOwnerReference: self
  cluster:
    name: postgres
  method: barmanObjectStore
  schedule: 0 0 3 * * *
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      version: 0.15.1
  interval: 30m
  values:
    fullnameOverride: arc-controller
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: roborev-runner-aerial
  namespace: default
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      version: 0.15.1
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  interval: 5m
  values:
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-systems
    githubConfigUrl: ${AERIAL_REPO_URL:=https://github.com/azylman/aerial}
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
    maxRunners: 6
    minRunners: 0
    runnerScaleSetName: roborev-runner-aerial
    scaleSetLabels:
      - self-hosted
      - roborev
    template:
      spec:
        containers:
          - command:
              - /entrypoint.sh
            env:
              - name: TARGET_REPO
                value: ${AERIAL_GITHUB_REPO:=azylman/aerial}
              - name: RUNNER_LABELS
                value: self-hosted,roborev
              - name: GITHUB_PAT
                valueFrom:
                  secretKeyRef:
                    key: GITHUB_PAT
                    name: roborev-runner-secret
            image: ghcr.io/azylman/aerial-github-runner:${TAG_AERIAL_GITHUB_RUNNER:=latest}
            name: runner
            volumeMounts:
              - mountPath: /cache
                name: ci-cache
              - mountPath: /local/antigravity-oauth-token
                name: oauth-token
                readOnly: true
                subPath: antigravity-oauth-token
              - mountPath: /local/claude-oauth-token
                name: oauth-token
                readOnly: true
                subPath: claude-oauth-token
              - mountPath: /local/postgres-password
                name: oauth-token
                readOnly: true
                subPath: postgres-password
              - mountPath: /root/.claude/projects
                name: roborev-claude-cache
              - mountPath: /root/.gemini/antigravity-cli/brain
                name: roborev-brain-cache
              - mountPath: /root/.gemini/antigravity-cli/conversations
                name: roborev-conversations-cache
        volumes:
          - hostPath:
              path: /var/lib/aerial/ci-cache
              type: DirectoryOrCreate
            name: ci-cache
          - name: oauth-token
            secret:
              defaultMode: 384
              items:
                - key: ANTIGRAVITY_OAUTH_TOKEN
                  path: antigravity-oauth-token
                - key: CLAUDE_CODE_OAUTH_TOKEN
                  path: claude-oauth-token
                - key: POSTGRES_PASSWORD
                  path: postgres-password
              optional: true
              secretName: roborev-runner-secret
          - hostPath:
              path: /var/lib/aerial/roborev-cache/brain
              type: DirectoryOrCreate
            name: roborev-brain-cache
          - hostPath:
              path: /var/lib/aerial/roborev-cache/claude-projects
              type: DirectoryOrCreate
            name: roborev-claude-cache
          - hostPath:
              path: /var/lib/aerial/roborev-cache/conversations
              type: DirectoryOrCreate
            name: roborev-conversations-cache
  valuesFrom:
    - kind: Secret
      name: roborev-runner-secret
      optional: true
      targetPath: githubConfigSecret.github_token
      valuesKey: GITHUB_PAT
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-runner-aerial
  namespace: default
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      version: 0.15.1
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  interval: 5m
  values:
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-systems
    githubConfigUrl: ${AERIAL_REPO_URL:=https://github.com/azylman/aerial}
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
    maxRunners: 16
    minRunners: 0
    runnerScaleSetName: ci-runner-aerial
    scaleSetLabels:
      - self-hosted
      - ci
    template:
      spec:
        containers:
          - command:
              - /entrypoint.sh
            env:
              - name: TARGET_REPO
                value: ${AERIAL_GITHUB_REPO:=azylman/aerial}
              - name: RUNNER_LABELS
                value: self-hosted,ci
            image: ghcr.io/azylman/aerial-github-runner:${TAG_AERIAL_GITHUB_RUNNER:=latest}
            name: runner
            volumeMounts:
              - mountPath: /var/run/docker.sock
                name: docker-sock
              - mountPath: /cache
                name: ci-cache
        volumes:
          - hostPath:
              path: /var/run/docker.sock
            name: docker-sock
          - hostPath:
              path: /var/lib/aerial/ci-cache
              type: DirectoryOrCreate
            name: ci-cache
  valuesFrom:
    - kind: Secret
      name: git-sync-secret
      optional: true
      targetPath: githubConfigSecret.github_token
      valuesKey: GITHUB_PAT
---
