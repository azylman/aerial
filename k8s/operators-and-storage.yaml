apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aerial
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  url: https://github.com/azylman/aerial.git
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aerial-config
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: github-auth
  timeout: 60s
  url: https://github.com/azylman/aerial-config.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerial-core
  namespace: flux-system
spec:
  force: false
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: aerial
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerial-config
  namespace: flux-system
spec:
  force: false
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: aerial-config
  timeout: 5m
  wait: true
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: synapse-provider
  namespace: flux-system
spec:
  address: http://synapse.default.svc.cluster.local/webhooks/flux
  type: generic
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: synapse-alert
  namespace: flux-system
spec:
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
  providerRef:
    name: synapse-provider
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
  namespace: flux-system
spec:
  events:
    - ping
    - push
  interval: 10m
  resources:
    - kind: GitRepository
      name: aerial
    - kind: GitRepository
      name: aerial-config
  secretRef:
    name: webhook-token
  type: github
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: admin@aerial.lan
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-api-token-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zylman-wildcard-tls
  namespace: default
spec:
  commonName: zylman.com
  dnsNames:
    - zylman.com
    - '*.zylman.com'
    - '*.lan.zylman.com'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: zylman-wildcard-tls
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: default
spec:
  affinity:
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: app
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: app
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  instances: 2
  logLevel: info
  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        login: true
        name: aerial
        passwordSecret:
          name: postgres-aerial-role
        superuser: true
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: "on"
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
      full_page_writes: "on"
      log_destination: csvlog
      log_directory: /controller/log
      log_filename: postgres
      log_rotation_age: "0"
      log_rotation_size: "0"
      log_truncate_on_rotation: "false"
      logging_collector: "on"
      max_parallel_workers: "32"
      max_replication_slots: "32"
      max_worker_processes: "32"
      shared_memory_type: mmap
      shared_preload_libraries: ""
      ssl_max_protocol_version: TLSv1.3
      ssl_min_protocol_version: TLSv1.3
      wal_keep_size: 512MB
      wal_level: logical
      wal_log_hints: "on"
      wal_receiver_timeout: 5s
      wal_sender_timeout: 5s
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  resources: {}
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  storage:
    resizeInUseVolumes: true
    size: 20Gi
    storageClass: local-path
  switchoverDelay: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
    - name: metrics
      port: 9187
      protocol: TCP
      targetPort: 9187
  selector:
    cnpg.io/cluster: postgres
    role: primary
  type: ClusterIP
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-nightly-backup
  namespace: default
spec:
  backupOwnerReference: self
  cluster:
    name: postgres
  method: barmanObjectStore
  schedule: 0 0 3 * * *
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: smb-nas
parameters:
  source: //nas.lan/Aerial
provisioner: smb.csi.k8s.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-aerial-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Ti
  csi:
    driver: smb.csi.k8s.io
    volumeAttributes:
      source: //nas.lan/Aerial
    volumeHandle: nas-aerial-pv
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-nas
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: roborev-runner-aerial
  name: roborev-runner-aerial
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: roborev-runner-aerial
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roborev-runner-aerial
    spec:
      containers:
        - env:
            - name: TARGET_REPO
              value: azylman/aerial
            - name: RUNNER_NAME
              value: aerial-roborev-aerial
            - name: RUNNER_LABELS
              value: self-hosted,roborev
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  key: GITHUB_PAT
                  name: shared-secrets
          image: ghcr.io/azylman/aerial-github-runner:latest
          name: runner
          volumeMounts:
            - mountPath: /root/.roborev
              name: roborev-data
            - mountPath: /local/antigravity-oauth-token
              name: oauth-token
              readOnly: true
              subPath: antigravity-oauth-token
      nodeSelector:
        kubernetes.io/hostname: calibarn
      volumes:
        - hostPath:
            path: /var/lib/docker/volumes/aerial-roborev-aerial/_data
            type: DirectoryOrCreate
          name: roborev-data
        - name: oauth-token
          secret:
            defaultMode: 384
            items:
              - key: ANTIGRAVITY_OAUTH_TOKEN
                path: antigravity-oauth-token
            optional: true
            secretName: shared-secrets
---
