apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-bootstrap-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-bootstrap
  namespace: default
# Note: Kubernetes RBAC cannot restrict the 'create' verb by resourceNames because object
# names are evaluated after creation admission. Read and patch verbs are strictly bounded
# to the four managed bootstrap secrets (postgres-aerial-role, infisical-secret,
# infisical-universal-auth, infisical-admin).
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - postgres-aerial-role
      - infisical-secret
      - infisical-universal-auth
      - infisical-admin
    resources:
      - secrets
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical-bootstrap-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infisical-bootstrap
subjects:
  - kind: ServiceAccount
    name: infisical-bootstrap-sa
    namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app.kubernetes.io/name: infisical-bootstrap
  name: infisical-bootstrap
  namespace: default
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical-bootstrap
    spec:
      containers:
        - command:
            - node
            - -e
            - |
              "use strict";
              const crypto = require("crypto");
              const fs = require("fs");
              const http = require("http");
              const https = require("https");

              const ns = "default";
              const saDir = "/var/run/secrets/kubernetes.io/serviceaccount";
              const saToken = fs.readFileSync(saDir + "/token", "utf8").trim();
              const caCert = fs.readFileSync(saDir + "/ca.crt");
              const infisicalUrl = (process.env.INFISICAL_URL || "http://infisical.default.svc.cluster.local:8080").replace(/\/$/, "");
              const projectSlug = process.env.INFISICAL_PROJECT_SLUG || "aerial-8-jn8";
              const randHex = (bytes = 16) => crypto.randomBytes(bytes).toString("hex");
              const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
              const b64d = (v) => (v ? Buffer.from(v, "base64").toString("utf8") : "");
              const isAlreadyExists = (status, data) => {
                if (status === 409) return true;
                if (status === 400 && data) {
                  const msg = typeof data === "string" ? data : (data.message || "");
                  return /already exists/i.test(msg);
                }
                return false;
              };
              const isAlreadyBootstrapped = (status, data) => {
                if (status === 409) return true;
                if (status === 400 && data) {
                  const msg = typeof data === "string" ? data : (data.message || "");
                  return /already/i.test(msg);
                }
                return false;
              };

              function httpJson(urlStr, { method = "GET", headers = {}, body, ca } = {}) {
                return new Promise((resolve, reject) => {
                  const u = new URL(urlStr);
                  const mod = u.protocol === "https:" ? https : http;
                  const payload = body !== undefined ? JSON.stringify(body) : undefined;
                  const reqHeaders = { Accept: "application/json", ...headers };
                  if (payload !== undefined) {
                    reqHeaders["Content-Type"] = reqHeaders["Content-Type"] || "application/json";
                    reqHeaders["Content-Length"] = Buffer.byteLength(payload);
                  }
                  const req = mod.request(
                    u,
                    { method, headers: reqHeaders, ca, timeout: 15000 },
                    (res) => {
                      let raw = "";
                      res.setEncoding("utf8");
                      res.on("data", (chunk) => { raw += chunk; });
                      res.on("end", () => {
                        let data = null;
                        if (raw) {
                          try { data = JSON.parse(raw); } catch (_) { data = { raw }; }
                        }
                        resolve({ status: res.statusCode || 0, data });
                      });
                    }
                  );
                  req.on("timeout", () => req.destroy(new Error("Request timeout: " + method + " " + u.pathname)));
                  req.on("error", reject);
                  if (payload !== undefined) req.write(payload);
                  req.end();
                });
              }

              const k8sUrl = (p) => "https://kubernetes.default.svc/api/v1/namespaces/" + ns + p;
              const k8sHeaders = (extra = {}) => ({ Authorization: "Bearer " + saToken, ...extra });

              async function ensureSecret(name, type, stringData) {
                const getRes = await httpJson(k8sUrl("/secrets/" + name), { headers: k8sHeaders(), ca: caCert });
                if (getRes.status === 200) {
                  console.log("[infisical-bootstrap] Secret/" + name + " already exists; skipping.");
                  return getRes.data;
                }
                if (getRes.status !== 404) {
                  throw new Error("Failed checking Secret/" + name + ": HTTP " + getRes.status);
                }
                const createRes = await httpJson(k8sUrl("/secrets"), {
                  method: "POST",
                  headers: k8sHeaders(),
                  ca: caCert,
                  body: { apiVersion: "v1", kind: "Secret", metadata: { name, namespace: ns }, type, stringData },
                });
                if (createRes.status === 201 || createRes.status === 200) {
                  console.log("[infisical-bootstrap] Created Secret/" + name + ".");
                  return createRes.data;
                }
                if (createRes.status === 409) {
                  const retry = await httpJson(k8sUrl("/secrets/" + name), { headers: k8sHeaders(), ca: caCert });
                  return retry.data;
                }
                throw new Error("Failed creating Secret/" + name + ": HTTP " + createRes.status);
              }

              async function upsertSecret(name, stringData) {
                const getRes = await httpJson(k8sUrl("/secrets/" + name), { headers: k8sHeaders(), ca: caCert });
                if (getRes.status === 404) {
                  return ensureSecret(name, "Opaque", stringData);
                }
                if (getRes.status !== 200) {
                  throw new Error("Failed reading Secret/" + name + " for update: HTTP " + getRes.status);
                }
                const patchRes = await httpJson(k8sUrl("/secrets/" + name), {
                  method: "PATCH",
                  headers: k8sHeaders({ "Content-Type": "application/merge-patch+json" }),
                  ca: caCert,
                  body: { stringData },
                });
                if (patchRes.status !== 200) {
                  throw new Error("Failed patching Secret/" + name + ": HTTP " + patchRes.status);
                }
                return patchRes.data;
              }

              async function upsertSecretWithRetry(name, stringData, maxAttempts = 30) {
                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                  try {
                    return await upsertSecret(name, stringData);
                  } catch (err) {
                    if (attempt === maxAttempts) throw err;
                    const delay = Math.min(1000 * attempt, 5000);
                    console.warn("[infisical-bootstrap] upsertSecret(" + name + ") attempt " + attempt + "/" + maxAttempts + " failed: " + (err && err.message ? err.message : err) + ". Retrying in " + delay + "ms...");
                    await sleep(delay);
                  }
                }
              }

              async function waitForInfisical() {
                for (let i = 1; i <= 120; i++) {
                  try {
                    const res = await httpJson(infisicalUrl + "/api/status");
                    if (res.status === 200) return;
                  } catch (_) {}
                  console.log("[infisical-bootstrap] Waiting for Infisical API (" + i + "/120)...");
                  await sleep(3000);
                }
                throw new Error("Timed out waiting for Infisical /api/status");
              }

              (async () => {
                await ensureSecret("postgres-aerial-role", "kubernetes.io/basic-auth", {
                  username: "aerial",
                  password: randHex(16),
                });
                await ensureSecret("infisical-secret", "Opaque", {
                  AUTH_SECRET: randHex(16),
                  ENCRYPTION_KEY: randHex(16),
                });

                const uaRes = await httpJson(k8sUrl("/secrets/infisical-universal-auth"), { headers: k8sHeaders(), ca: caCert });
                const uaData = (uaRes.status === 200 && uaRes.data && uaRes.data.data) || {};
                if (b64d(uaData.INFISICAL_CLIENT_ID) && b64d(uaData.INFISICAL_CLIENT_SECRET)) {
                  console.log("[infisical-bootstrap] Secret/infisical-universal-auth already configured; nothing to do.");
                  return;
                }

                await waitForInfisical();

                const adminRes = await httpJson(k8sUrl("/secrets/infisical-admin"), { headers: k8sHeaders(), ca: caCert });
                const adminData = (adminRes.status === 200 && adminRes.data && adminRes.data.data) || {};

                let token = b64d(adminData.INFISICAL_TOKEN);
                let identityId = b64d(adminData.INFISICAL_IDENTITY_ID);
                let adminEmail = b64d(adminData.INFISICAL_ADMIN_EMAIL) || "admin@aerial.local";
                let adminPassword = b64d(adminData.INFISICAL_ADMIN_PASSWORD) || randHex(16);

                if (!adminData.INFISICAL_ADMIN_PASSWORD) {
                  await upsertSecretWithRetry("infisical-admin", {
                    INFISICAL_ADMIN_EMAIL: adminEmail,
                    INFISICAL_ADMIN_PASSWORD: adminPassword,
                  });
                }

                if (!token || !identityId) {
                  const bootRes = await httpJson(infisicalUrl + "/api/v1/admin/bootstrap", {
                    method: "POST",
                    body: { email: adminEmail, password: adminPassword, organization: "Aerial" },
                  });
                  if (bootRes.status === 200 && bootRes.data && bootRes.data.identity) {
                    identityId = bootRes.data.identity.id;
                    token = bootRes.data.identity.credentials.token;
                    try {
                      await upsertSecretWithRetry("infisical-admin", {
                        INFISICAL_TOKEN: token,
                        INFISICAL_IDENTITY_ID: identityId,
                        INFISICAL_ADMIN_EMAIL: adminEmail,
                        INFISICAL_ADMIN_PASSWORD: adminPassword,
                      }, 60);
                      console.log("[infisical-bootstrap] Initialized Infisical organization and checkpointed admin identity.");
                    } catch (persistErr) {
                      console.error("[infisical-bootstrap] CRITICAL: Failed to checkpoint admin credentials to Secret/infisical-admin: " + (persistErr && persistErr.message ? persistErr.message : persistErr));
                      throw persistErr;
                    }
                  } else if (isAlreadyBootstrapped(bootRes.status, bootRes.data)) {
                    throw new Error(
                      "Infisical instance is already bootstrapped but credentials are missing from Secret/infisical-admin. " +
                      "Recovery: Log into Infisical admin UI or create a machine identity bearer token, then patch the existing secret: " +
                      "kubectl patch secret infisical-admin --type=merge -p '{\"stringData\":{\"INFISICAL_TOKEN\":\"<token>\",\"INFISICAL_IDENTITY_ID\":\"<id>\"}}' " +
                      "or populate Secret/infisical-universal-auth directly (see README.md)."
                    );
                  } else {
                    throw new Error("Infisical /api/v1/admin/bootstrap failed: HTTP " + bootRes.status + " - " + JSON.stringify(bootRes.data));
                  }
                }

                const authHeaders = { Authorization: "Bearer " + token };
                let projRes = await httpJson(infisicalUrl + "/api/v1/projects/slug/" + encodeURIComponent(projectSlug), {
                  headers: authHeaders,
                });
                let project = projRes.status === 200 && projRes.data && (projRes.data.project || projRes.data.workspace);
                if (!project) {
                  const createProj = await httpJson(infisicalUrl + "/api/v1/projects", {
                    method: "POST",
                    headers: authHeaders,
                    body: {
                      projectName: "Aerial",
                      slug: projectSlug,
                      type: "secret-manager",
                      shouldCreateDefaultEnvs: false,
                    },
                  });
                  if (createProj.status === 200 && createProj.data && (createProj.data.project || createProj.data.workspace)) {
                    project = createProj.data.project || createProj.data.workspace;
                    console.log("[infisical-bootstrap] Created Infisical project '" + projectSlug + "'.");
                  } else if (isAlreadyExists(createProj.status, createProj.data)) {
                    projRes = await httpJson(infisicalUrl + "/api/v1/projects/slug/" + encodeURIComponent(projectSlug), {
                      headers: authHeaders,
                    });
                    project = projRes.status === 200 && projRes.data && (projRes.data.project || projRes.data.workspace);
                  }
                  if (!project) {
                    throw new Error("Failed creating Infisical project '" + projectSlug + "': HTTP " + createProj.status);
                  }
                }

                const envRes = await httpJson(infisicalUrl + "/api/v1/projects/" + project.id + "/environments", {
                  method: "POST",
                  headers: authHeaders,
                  body: { name: "default", slug: "default" },
                });
                if (envRes.status !== 200 && !isAlreadyExists(envRes.status, envRes.data)) {
                  throw new Error("Failed creating 'default' environment: HTTP " + envRes.status + " - " + JSON.stringify(envRes.data));
                }

                const memRes = await httpJson(infisicalUrl + "/api/v1/projects/" + project.id + "/identity-memberships/" + identityId, {
                  method: "POST",
                  headers: authHeaders,
                  body: { roles: [{ role: "admin" }] },
                });
                if (memRes.status !== 200 && !isAlreadyExists(memRes.status, memRes.data)) {
                  throw new Error("Failed binding identity to project: HTTP " + memRes.status + " - " + JSON.stringify(memRes.data));
                }

                for (const secretKey of ["NATS_AERIAL_PASSWORD", "NATS_MIORINE_PASSWORD", "NATS_SULETTA_PASSWORD"]) {
                  const getSec = await httpJson(
                    infisicalUrl + "/api/v3/secrets/raw/" + secretKey + "?workspaceId=" + encodeURIComponent(project.id) + "&environment=default&secretPath=%2F",
                    { headers: authHeaders }
                  );
                  if (getSec.status === 200) {
                    continue;
                  }
                  const createSec = await httpJson(infisicalUrl + "/api/v3/secrets/raw/" + secretKey, {
                    method: "POST",
                    headers: authHeaders,
                    body: {
                      workspaceId: project.id,
                      environment: "default",
                      secretPath: "/",
                      secretValue: randHex(16),
                      type: "shared",
                    },
                  });
                  if (createSec.status !== 200 && !isAlreadyExists(createSec.status, createSec.data)) {
                    throw new Error("Failed seeding " + secretKey + " in Infisical: HTTP " + createSec.status + " - " + JSON.stringify(createSec.data));
                  }
                }

                await upsertSecretWithRetry("infisical-admin", {
                  INFISICAL_PROJECT_ID: project.id,
                  INFISICAL_PROJECT_SLUG: projectSlug,
                });

                let uaConfigRes = await httpJson(infisicalUrl + "/api/v1/auth/universal-auth/identities/" + identityId, {
                  headers: authHeaders,
                });
                if (uaConfigRes.status === 404 || (uaConfigRes.data && uaConfigRes.data.message === "Universal auth configuration not found")) {
                  uaConfigRes = await httpJson(infisicalUrl + "/api/v1/auth/universal-auth/identities/" + identityId, {
                    method: "POST",
                    headers: authHeaders,
                    body: {
                      // Restrict Universal Auth to private RFC1918 subnets (k3s pod/service CIDRs 10.42.0.0/16, 10.43.0.0/16) and localhost
                      // Restrict Universal Auth to k3s cluster networks (pod CIDR 10.42.0.0/16, service CIDR 10.43.0.0/16) and loopback
                      clientSecretTrustedIps: [
                        { ipAddress: "10.42.0.0/16" },
                        { ipAddress: "10.43.0.0/16" },
                        { ipAddress: "127.0.0.1/32" },
                      ],
                      accessTokenTTL: 2592000,
                    },
                  });
                }
                if (uaConfigRes.status !== 200 && !isAlreadyExists(uaConfigRes.status, uaConfigRes.data)) {
                  throw new Error("Failed attaching Universal Auth: HTTP " + uaConfigRes.status);
                }
                const clientId = uaConfigRes.data && uaConfigRes.data.identityUniversalAuth && uaConfigRes.data.identityUniversalAuth.clientId;
                if (!clientId) {
                  throw new Error("Failed extracting Universal Auth clientId from response: " + JSON.stringify(uaConfigRes.data));
                }

                const listSecretsRes = await httpJson(infisicalUrl + "/api/v1/auth/universal-auth/identities/" + identityId + "/client-secrets", {
                  headers: authHeaders,
                });
                if (listSecretsRes.status === 200 && Array.isArray(listSecretsRes.data && listSecretsRes.data.clientSecretData)) {
                  for (const s of listSecretsRes.data.clientSecretData) {
                    if (s && s.id && !s.isClientSecretRevoked && s.description === "external-secrets-operator") {
                      try {
                        await httpJson(infisicalUrl + "/api/v1/auth/universal-auth/identities/" + identityId + "/client-secrets/" + s.id + "/revoke", {
                          method: "POST",
                          headers: authHeaders,
                          body: {},
                        });
                        console.log("[infisical-bootstrap] Revoked unpersisted orphaned client secret " + s.id + ".");
                      } catch (_) {}
                    }
                  }
                }

                const csRes = await httpJson(infisicalUrl + "/api/v1/auth/universal-auth/identities/" + identityId + "/client-secrets", {
                  method: "POST",
                  headers: authHeaders,
                  body: { description: "external-secrets-operator", ttl: 0, numUsesLimit: 0 },
                });
                if (csRes.status !== 200 || !csRes.data || !csRes.data.clientSecret) {
                  throw new Error("Failed creating Universal Auth client secret: HTTP " + csRes.status);
                }
                const clientSecret = csRes.data.clientSecret;
                const clientSecretId = csRes.data.clientSecretData && csRes.data.clientSecretData.id;

                try {
                  await upsertSecretWithRetry("infisical-universal-auth", {
                    INFISICAL_CLIENT_ID: clientId,
                    INFISICAL_CLIENT_SECRET: clientSecret,
                    INFISICAL_PROJECT_ID: project.id,
                    INFISICAL_PROJECT_SLUG: projectSlug,
                  });
                  console.log("[infisical-bootstrap] Successfully provisioned Infisical Universal Auth and seeded NATS secrets.");
                } catch (persistErr) {
                  if (clientSecretId) {
                    try {
                      await httpJson(infisicalUrl + "/api/v1/auth/universal-auth/identities/" + identityId + "/client-secrets/" + clientSecretId + "/revoke", {
                        method: "POST",
                        headers: authHeaders,
                        body: {},
                      });
                      console.warn("[infisical-bootstrap] Revoked orphaned client secret " + clientSecretId + " following persistence failure.");
                    } catch (_) {}
                  }
                  throw persistErr;
                }
              })().catch((err) => {
                console.error("[infisical-bootstrap] FATAL:", err && err.message ? err.message : err);
                process.exit(1);
              });
          env:
            - name: INFISICAL_URL
              value: http://infisical.default.svc.cluster.local:8080
            - name: INFISICAL_PROJECT_SLUG
              value: aerial-8-jn8
          image: docker.io/library/node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
          name: infisical-bootstrap
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
      restartPolicy: OnFailure
      serviceAccountName: infisical-bootstrap-sa
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: default
spec:
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: app
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: app
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  instances: 1
  logLevel: info
  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        login: true
        name: aerial
        passwordSecret:
          name: postgres-aerial-role
        superuser: true
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: "on"
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
      full_page_writes: "on"
      log_destination: csvlog
      log_directory: /controller/log
      log_filename: postgres
      log_rotation_age: "0"
      log_rotation_size: "0"
      log_truncate_on_rotation: "false"
      logging_collector: "on"
      max_parallel_workers: "32"
      max_replication_slots: "32"
      max_worker_processes: "32"
      shared_memory_type: mmap
      shared_preload_libraries: ""
      ssl_max_protocol_version: TLSv1.3
      ssl_min_protocol_version: TLSv1.3
      wal_keep_size: 512MB
      wal_level: logical
      wal_log_hints: "on"
      wal_receiver_timeout: 5s
      wal_sender_timeout: 5s
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  storage:
    resizeInUseVolumes: true
    size: 20Gi
    storageClass: local-path
  switchoverDelay: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
    - name: metrics
      port: 9187
      protocol: TCP
      targetPort: 9187
  selector:
    cnpg.io/cluster: postgres
    role: primary
  type: ClusterIP
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-nightly-backup
  namespace: default
spec:
  backupOwnerReference: self
  cluster:
    name: postgres
  method: barmanObjectStore
  schedule: 0 0 3 * * *
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-aerial
  namespace: default
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
  ensure: present
  extensions:
    - ensure: present
      name: vector
  name: aerial
  owner: aerial
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-infisical
  namespace: default
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
  ensure: present
  name: infisical
  owner: aerial
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-grafana
  namespace: default
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
  ensure: present
  name: grafana
  owner: aerial
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-docket
  namespace: default
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
  ensure: present
  extensions:
    - ensure: present
      name: vector
  name: docket
  owner: aerial
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: roborev-runner-aerial
  namespace: default
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      version: 0.15.1
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  interval: 5m
  values:
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-systems
    githubConfigUrl: ${AERIAL_REPO_URL:=https://github.com/azylman/aerial}
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
    maxRunners: 6
    minRunners: 0
    runnerScaleSetName: roborev-runner-aerial
    scaleSetLabels:
      - self-hosted
      - roborev
    template:
      spec:
        containers:
          - command:
              - /entrypoint.sh
            env:
              - name: TARGET_REPO
                value: ${AERIAL_GITHUB_REPO:=azylman/aerial}
              - name: RUNNER_LABELS
                value: self-hosted,roborev
              - name: GITHUB_PAT
                valueFrom:
                  secretKeyRef:
                    key: GITHUB_PAT
                    name: roborev-runner-secret
            image: ghcr.io/azylman/aerial-github-runner:${TAG_AERIAL_GITHUB_RUNNER:=latest}
            name: runner
            volumeMounts:
              - mountPath: /cache
                name: ci-cache
              - mountPath: /local/antigravity-oauth-token
                name: oauth-token
                readOnly: true
                subPath: antigravity-oauth-token
              - mountPath: /local/claude-oauth-token
                name: oauth-token
                readOnly: true
                subPath: claude-oauth-token
              - mountPath: /local/postgres-password
                name: postgres-password
                readOnly: true
                subPath: postgres-password
              - mountPath: /local/codex-auth.json
                name: oauth-token
                readOnly: true
                subPath: codex-auth.json
              - mountPath: /root/.claude/projects
                name: roborev-claude-cache
              - mountPath: /root/.codex
                name: roborev-codex-cache
              - mountPath: /root/.gemini/antigravity-cli/brain
                name: roborev-brain-cache
              - mountPath: /root/.gemini/antigravity-cli/conversations
                name: roborev-conversations-cache
        volumes:
          - hostPath:
              path: /var/lib/aerial/ci-cache
              type: DirectoryOrCreate
            name: ci-cache
          - name: oauth-token
            secret:
              defaultMode: 384
              items:
                - key: ANTIGRAVITY_OAUTH_TOKEN
                  path: antigravity-oauth-token
                - key: CLAUDE_CODE_OAUTH_TOKEN
                  path: claude-oauth-token
                - key: CODEX_AUTH_JSON
                  path: codex-auth.json
              optional: true
              secretName: roborev-runner-secret
          - name: postgres-password
            secret:
              defaultMode: 384
              items:
                - key: password
                  path: postgres-password
              optional: true
              secretName: postgres-aerial-role
          - hostPath:
              path: /var/lib/aerial/roborev-cache/brain
              type: DirectoryOrCreate
            name: roborev-brain-cache
          - hostPath:
              path: /var/lib/aerial/roborev-cache/claude-projects
              type: DirectoryOrCreate
            name: roborev-claude-cache
          - hostPath:
              path: /var/lib/aerial/roborev-cache/codex
              type: DirectoryOrCreate
            name: roborev-codex-cache
          - hostPath:
              path: /var/lib/aerial/roborev-cache/conversations
              type: DirectoryOrCreate
            name: roborev-conversations-cache
  valuesFrom:
    - kind: Secret
      name: roborev-runner-secret
      optional: true
      targetPath: githubConfigSecret.github_token
      valuesKey: GITHUB_PAT
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-runner-aerial
  namespace: default
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      version: 0.15.1
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  interval: 5m
  values:
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-systems
    githubConfigUrl: ${AERIAL_REPO_URL:=https://github.com/azylman/aerial}
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
    maxRunners: 16
    minRunners: 0
    runnerScaleSetName: ci-runner-aerial
    scaleSetLabels:
      - self-hosted
      - ci
    template:
      spec:
        containers:
          - command:
              - /entrypoint.sh
            env:
              - name: TARGET_REPO
                value: ${AERIAL_GITHUB_REPO:=azylman/aerial}
              - name: RUNNER_LABELS
                value: self-hosted,ci
            image: ghcr.io/azylman/aerial-github-runner:${TAG_AERIAL_GITHUB_RUNNER:=latest}
            name: runner
            volumeMounts:
              - mountPath: /var/run/docker.sock
                name: docker-sock
              - mountPath: /cache
                name: ci-cache
              - mountPath: /tmp
                name: tmp
              - mountPath: /actions-runner/_work
                name: work
        volumes:
          - hostPath:
              path: /var/run/docker.sock
            name: docker-sock
          - hostPath:
              path: /var/lib/aerial/ci-cache
              type: DirectoryOrCreate
            name: ci-cache
          - emptyDir:
              medium: Memory
              sizeLimit: 2Gi
            name: tmp
          - emptyDir:
              medium: Memory
              sizeLimit: 4Gi
            name: work
  valuesFrom:
    - kind: Secret
      name: git-sync-secret
      optional: true
      targetPath: githubConfigSecret.github_token
      valuesKey: GITHUB_PAT
---
apiVersion: restate.dev/v1
kind: RestateCluster
metadata:
  name: restate
spec:
  cluster:
    autoProvision: true
  compute:
    env:
      - name: RESTATE_AUTO_PROVISION
        value: "false"
      - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
        value: 256 MiB
      - name: RESTATE_TRACING_ENDPOINT
        value: http://victoriatraces.default.svc.cluster.local:4317
    image: docker.io/restatedev/restate:1.7.14@sha256:c947270d4fb0ab41b61d228029e19676c46848e1147a037e598ee7f9e0695c2d
    replicas: 1
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 128Mi
  security:
    disableNetworkPolicies: true
  storage:
    storageClassName: local-path
    storageRequestBytes: 10737418240
---
# Blue/green standby for side-by-side Restate upgrades; clients reach the live cluster via the restate.aerial CoreDNS alias.
apiVersion: restate.dev/v1
kind: RestateCluster
metadata:
  name: restate-green
spec:
  cluster:
    autoProvision: true
  compute:
    env:
      - name: RESTATE_AUTO_PROVISION
        value: "false"
      - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
        value: 256 MiB
      - name: RESTATE_TRACING_ENDPOINT
        value: http://victoriatraces.default.svc.cluster.local:4317
    image: docker.io/restatedev/restate:1.8.1-hotfix.2@sha256:e3a11e7c694cfe0c134eca1652992c068bef0bcba3caeec9d2a3b3bc50daa62e
    nodeSelector:
      storage-tier: nvme
    replicas: 1
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 128Mi
  security:
    disableNetworkPolicies: true
  storage:
    storageClassName: local-path
    storageRequestBytes: 10737418240
---

