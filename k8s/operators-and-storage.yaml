          accounts: {
            aerial: {
              jetstream: enabled
              users: [{ user: "aerial", password: "{{ .aerial_password }}" }]
            }
            miorine: {
              jetstream: enabled
              users: [{ user: "miorine", password: "{{ .miorine_password }}" }]
            }
            suletta: {
              jetstream: enabled
              users: [{ user: "suletta", password: "{{ .suletta_password }}" }]
