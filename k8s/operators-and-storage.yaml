  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-aerial-password-generator
  refreshInterval: "0"
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: CreateOrMerge
    deletionPolicy: Retain
    immutable: true
    name: postgres-aerial-role
    template:
      data:
        username: aerial
      mergePolicy: Merge
      type: kubernetes.io/basic-auth
