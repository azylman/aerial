apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-server-config
  namespace: default
spec:
  data:
    - remoteRef:
        key: NATS_AERIAL_PASSWORD
      secretKey: aerial_password
    - remoteRef:
        key: NATS_ERI_AERIAL_PASSWORD
      secretKey: eri_aerial_password
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: infisical
  target:
    creationPolicy: Owner
    name: nats-server-config
    template:
      data:
        nats.conf: |
          accounts: {
            aerial: {
              jetstream: enabled
              users: [
                { user: "aerial", password: "{{ .aerial_password }}" },
                {
                  user: "eri-aerial",
                  password: "{{ .eri_aerial_password }}",
                  permissions: {
                    publish: {
                      allow: [
                        "aerial.transcripts.steps.aerial.>",
                        "aerial.events.>",
                        "aerial.turn.>",
                        "aerial.dispatch.>",
                        "aerial.coalesced.widget_sync.>",
                        "voice.stream.>",
                        "_INBOX.>",
                        "$JS.API.INFO",
                        "$JS.API.STREAM.INFO.>",
                        "$JS.API.STREAM.CREATE.>",
                        "$JS.API.STREAM.UPDATE.>"
                      ]
                    },
                    subscribe: {
                      allow: [
                        "voice.stream.>",
                        "_INBOX.>"
                      ]
                    }
                  }
                }
              ]
            }
          }
---
