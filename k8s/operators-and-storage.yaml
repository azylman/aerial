        ensure: present
        inherit: true
        login: true
        name: eri
        passwordSecret:
          name: postgres-eri-role
      - connectionLimit: -1
        ensure: present
        inherit: true
        login: false
        name: memory_writer
      - connectionLimit: -1
        ensure: present
        inherit: true
        inRoles:
          - memory_writer
        login: true
        name: coven_aerial
        passwordSecret:
          name: postgres-coven-aerial-role
