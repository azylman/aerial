apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-runner-aerial-config
  namespace: default
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      version: 0.15.1
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  interval: 5m
  values:
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-systems
    githubConfigUrl: https://github.com/azylman/aerial-config
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
        nodeSelector:
          kubernetes.io/hostname: calibarn
    maxRunners: 2
    minRunners: 0
    runnerScaleSetName: ci-runner-aerial-config
    scaleSetLabels:
      - self-hosted
      - ci
    template:
      spec:
        containers:
          - command:
              - /entrypoint.sh
            env:
              - name: TARGET_REPO
                value: azylman/aerial-config
              - name: RUNNER_LABELS
                value: self-hosted,ci
            image: ghcr.io/azylman/aerial-github-runner:${TAG_AERIAL_GITHUB_RUNNER:=latest}
            name: runner
            volumeMounts:
              - mountPath: /var/run/docker.sock
                name: docker-sock
              - mountPath: /cache
                name: ci-cache
        nodeSelector:
          kubernetes.io/hostname: calibarn
        volumes:
          - hostPath:
              path: /var/run/docker.sock
            name: docker-sock
          - hostPath:
              path: /var/lib/aerial/ci-cache
              type: DirectoryOrCreate
            name: ci-cache
  valuesFrom:
    - kind: Secret
      name: git-sync-secret
      targetPath: githubConfigSecret.github_token
      valuesKey: GITHUB_PAT
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: flux-system
spec:
  interval: 24h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
