    name: postgres-19
  databaseReclaimPolicy: retain
  ensure: present
  name: grafana
  owner: aerial
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-19-docket
  namespace: default
spec:
  cluster:
    name: postgres-19
  databaseReclaimPolicy: retain
  ensure: present
  extensions:
    - ensure: present
      name: vector
  name: docket
  owner: aerial
---
# Live Restate cluster; clients reach it via the restate.aerial CoreDNS alias.
apiVersion: restate.dev/v1
kind: RestateCluster
metadata:
  name: restate-green
spec:
  cluster:
    autoProvision: true
  compute:
    env:
      - name: RESTATE_AUTO_PROVISION
        value: "false"
      - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
        value: 256 MiB
      - name: RESTATE_TRACING_ENDPOINT
        value: http://otel-collector.default.svc.cluster.local:4317
    image: docker.io/restatedev/restate:1.8.1-hotfix.2@sha256:e3a11e7c694cfe0c134eca1652992c068bef0bcba3caeec9d2a3b3bc50daa62e
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 128Mi
  security:
    disableNetworkPolicies: true
  storage:
    storageClassName: local-path
    storageRequestBytes: 10737418240
---

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
  namespace: default
spec:
  provider:
    infisical:
      hostAPI: http://infisical.default.svc.cluster.local:8080
      auth:
        tokenAuthCredentials:
          accessToken:
            key: INFISICAL_TOKEN
            name: infisical-universal-auth
      secretsScope:
        projectSlug: ${INFISICAL_PROJECT_SLUG:=aerial}
        environmentSlug: default
        secretsPath: /
        recursive: false
