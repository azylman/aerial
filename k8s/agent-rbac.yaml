apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: default
automountServiceAccountToken: false
# Workloads without a dedicated ServiceAccount (sidecars, CronJobs) still pull
# private GHCR images; without this they only run while the image is cached.
imagePullSecrets:
  - name: ghcr-creds
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: eri-aerial
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: vanadis
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: vanadis-restate
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: vanadis-nats
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: haro
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: coven
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: transcripts
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: synapse
  namespace: default
---
apiVersion: v1
imagePullSecrets:
  - name: ghcr-creds
kind: ServiceAccount
metadata:
  name: console
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerial-agent
rules:
  - apiGroups:
      - aerial.io
    resources:
      - memories
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - aerial.io
    resources:
      - transcripts
    verbs:
      - get
      - list
  - apiGroups:
      - aerial.io
    resources:
      - schedules
      - builds
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - aerial.io
    resources:
      - prs
    verbs:
      - get
      - list
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerial-supervisor
rules:
  - apiGroups:
      - aerial.io
    resources:
      - builds
      - builds/all
      - schedules
      - schedules/all
      - prs
      - prs/all
      - transcripts
      - transcripts/all
      - memories
      - memories/all
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerial-auth-delegator
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerial-k8s-reader
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - namespaces
      - nodes
      - serviceaccounts
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - controllerrevisions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - referencegrants
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - helmrepositories
      - ocirepositories
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.victoriametrics.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - restate.dev
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - external-secrets.io
      - generators.external-secrets.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aerial-supervisors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aerial-supervisor
subjects:
  - kind: ServiceAccount
    name: eri-aerial
    namespace: default
  - kind: ServiceAccount
    name: vanadis
    namespace: default
  - kind: ServiceAccount
