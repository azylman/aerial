version: 0.8
index_id: docker-logs

doc_mapping:
  mode: lenient
  timestamp_field: timestamp
  field_mappings:
    - name: timestamp
      type: datetime
      fast: true
      input_formats:
        - rfc3339
        - unix_timestamp
    - name: container_name
      type: text
      tokenizer: raw
      fast: true
    - name: service
      type: text
      tokenizer: raw
      fast: true
    - name: stream
      type: text
      tokenizer: raw
      fast: true
    - name: level
      type: text
      tokenizer: raw
      fast: true
    - name: message
      type: text
      tokenizer: default
      record: position
    - name: attributes
      type: json
      tokenizer: default
      record: basic
      fast: true
      expand_dots: true

search_settings:
  default_search_fields:
    - message
    - container_name

retention:
  period: 30 days
  schedule: daily
