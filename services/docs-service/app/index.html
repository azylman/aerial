<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aerial Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Aerial Assistant Documentation & Architecture Diagrams">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#181825">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="assets/aerial-tokens.css">
  <link rel="stylesheet" href="assets/css/aerial-docs.css">
  <!-- Shared theme state, then a synchronous pre-paint apply (docsify-theme.js reuses it). -->
  <script src="assets/aerial-theme.js"></script>
  <script>
    window.aerialDocsApplyTheme = function (theme) {
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      var canvas = getComputedStyle(root).getPropertyValue('--ae-canvas').trim();
      if (meta && canvas) meta.content = canvas;
    };
    window.aerialDocsApplyTheme(window.AerialTheme ? window.AerialTheme.get() : 'dark');
  </script>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'Aerial Docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: '_404.md',
      relativePath: false,
      executeScript: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No matching records found',
        depth: 3,
        hideOtherSidebarContent: false
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>

  <!-- Vendored Core & Plugins -->
  <script src="assets/js/docsify.min.js"></script>
  <script src="assets/js/plugins/search.min.js"></script>
  <script src="assets/js/plugins/docsify-copy-code.min.js"></script>
  <script src="assets/js/plugins/zoom-image.min.js"></script>

  <!-- Vendored Prism Language Components -->
  <script src="assets/js/prism/prism-bash.min.js"></script>
  <script src="assets/js/prism/prism-yaml.min.js"></script>
  <script src="assets/js/prism/prism-json.min.js"></script>
  <script src="assets/js/prism/prism-go.min.js"></script>
  <script src="assets/js/prism/prism-python.min.js"></script>
  <script src="assets/js/prism/prism-docker.min.js"></script>

  <!-- Mermaid.js Engine & Plugin -->
  <script src="assets/js/mermaid.min.js"></script>
  <script src="assets/js/plugins/docsify-mermaid.js"></script>

  <!-- Shared Light/Dark Theme Toggle -->
  <script src="assets/js/plugins/docsify-theme.js"></script>
</body>
</html>
